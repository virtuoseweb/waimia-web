<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-label="Console d'orchestration des agents au trait sumi-e">
  <rect width="620" height="420" fill="#F6F1E8"/>
  <g fill="none" stroke="#0C0B09" stroke-linecap="round" stroke-linejoin="round">
    <!-- window frame -->
    <rect x="96" y="78" width="428" height="264" rx="14" stroke-width="1.4"/>
    <!-- title bar -->
    <path d="M96 116 L524 116" stroke-width="1"/>
    <circle cx="120" cy="97" r="4.2" stroke-width="1.1"/>
    <circle cx="138" cy="97" r="4.2" stroke-width="1.1"/>
    <circle cx="156" cy="97" r="4.2" stroke-width="1.1"/>
    <!-- prompt lines (abstract command output) -->
    <path d="M126 150 L142 150" stroke-width="1.6"/>
    <path d="M156 150 L368 150" stroke-width="0.9" stroke-dasharray="40 14"/>
    <path d="M126 178 L142 178" stroke-width="1.6"/>
    <path d="M156 178 L300 178" stroke-width="0.9" stroke-dasharray="28 12"/>
    <path d="M126 206 L142 206" stroke-width="1.6"/>
    <path d="M156 206 L420 206" stroke-width="0.9" stroke-dasharray="52 16"/>
    <path d="M126 234 L142 234" stroke-width="1.6"/>
    <path d="M156 234 L262 234" stroke-width="0.9" stroke-dasharray="22 12"/>
    <!-- separator -->
    <path d="M126 268 L494 268" stroke-width="0.7" stroke-dasharray="8 10"/>
    <!-- active prompt + caret -->
    <path d="M126 300 L150 300" stroke-width="1.7"/>
    <path d="M164 300 L330 300" stroke-width="0.9" stroke-dasharray="34 14"/>
  </g>
  <!-- single accent: the live cursor / decision blot -->
  <rect x="342" y="289" width="10" height="22" rx="2" fill="#C94F2E"/>
</svg>
