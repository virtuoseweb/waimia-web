<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Scorecard de maturite IA">
  <title>Scorecard de maturite IA</title>

  <!-- Fond paper DS -->
  <rect width="1200" height="750" fill="#F6F1E8"/>

  <!-- Cadre externe -->
  <rect x="1" y="1" width="1198" height="748" fill="none" stroke="#0C0B09" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Header de fenetre (meme grammaire que les dashboards) -->
  <rect x="0" y="0" width="1200" height="52" fill="#EFE9DD"/>
  <!-- 3 dots -->
  <circle cx="32" cy="26" r="6" fill="#0C0B09" opacity="0.18"/>
  <circle cx="52" cy="26" r="6" fill="#0C0B09" opacity="0.12"/>
  <circle cx="72" cy="26" r="6" fill="#0C0B09" opacity="0.12"/>
  <!-- Barre de titre -->
  <rect x="108" y="18" width="170" height="16" rx="4" fill="#0C0B09" opacity="0.12"/>
  <!-- Nav header -->
  <rect x="320" y="20" width="78" height="12" rx="3" fill="#6B6560" opacity="0.5"/>
  <rect x="418" y="20" width="78" height="12" rx="3" fill="#6B6560" opacity="0.5"/>
  <!-- Badge 47 criteres (header droite) -->
  <rect x="1040" y="14" width="136" height="24" rx="4" fill="#0C0B09" opacity="0.08"/>
  <rect x="1052" y="20" width="112" height="12" rx="3" fill="#6B6560" opacity="0.5"/>

  <!-- En-tete de carte (titre + sous-ligne) -->
  <rect x="48" y="80" width="340" height="24" rx="4" fill="#0C0B09" opacity="0.18"/>
  <rect x="48" y="114" width="240" height="12" rx="3" fill="#6B6560" opacity="0.4"/>

  <!-- Carte principale scorecard (4 dimensions) -->
  <rect x="48" y="152" width="760" height="554" rx="8" fill="#FFFFFF" opacity="0.7" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>

  <!-- En-tete colonnes : Dimension | 0 1 2 3 -->
  <rect x="72" y="178" width="120" height="11" rx="3" fill="#6B6560" opacity="0.5"/>
  <!-- Graduations 0->3 (reperes colonne) -->
  <rect x="400" y="180" width="10" height="10" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="528" y="180" width="10" height="10" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="656" y="180" width="10" height="10" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="784" y="180" width="10" height="10" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="72" y="206" width="712" height="1" fill="#0C0B09" opacity="0.08"/>

  <!-- ============ RANGEE 1 : Donnees (score 2/3) ============ -->
  <rect x="72" y="234" width="150" height="13" rx="3" fill="#0C0B09" opacity="0.32"/>
  <rect x="72" y="254" width="90" height="9" rx="3" fill="#6B6560" opacity="0.3"/>
  <!-- Piste jauge 0->3 -->
  <rect x="280" y="236" width="520" height="20" rx="10" fill="#0C0B09" opacity="0.05"/>
  <!-- Crans graduations (3 separateurs internes) -->
  <line x1="410" y1="236" x2="410" y2="256" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="540" y1="236" x2="540" y2="256" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="670" y1="236" x2="670" y2="256" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <!-- Segment rempli (niveau 2 => jusqu'au 2e cran) -->
  <rect x="280" y="236" width="390" height="20" rx="10" fill="#6B6560" opacity="0.3"/>
  <!-- Curseur de niveau -->
  <circle cx="670" cy="246" r="9" fill="#0C0B09" opacity="0.22"/>

  <!-- ============ RANGEE 2 : Outillage (score 1/3) ============ -->
  <rect x="72" y="316" width="170" height="13" rx="3" fill="#0C0B09" opacity="0.32"/>
  <rect x="72" y="336" width="100" height="9" rx="3" fill="#6B6560" opacity="0.3"/>
  <rect x="280" y="318" width="520" height="20" rx="10" fill="#0C0B09" opacity="0.05"/>
  <line x1="410" y1="318" x2="410" y2="338" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="540" y1="318" x2="540" y2="338" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="670" y1="318" x2="670" y2="338" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <!-- Segment rempli (niveau 1 => jusqu'au 1er cran) -->
  <rect x="280" y="318" width="130" height="20" rx="10" fill="#6B6560" opacity="0.3"/>
  <circle cx="410" cy="328" r="9" fill="#0C0B09" opacity="0.22"/>

  <!-- ============ RANGEE 3 : Equipe (score 3/3 => MIEUX NOTEE, accent) ============ -->
  <rect x="72" y="398" width="130" height="13" rx="3" fill="#C94F2E" opacity="0.7"/>
  <rect x="72" y="418" width="110" height="9" rx="3" fill="#6B6560" opacity="0.3"/>
  <rect x="280" y="400" width="520" height="20" rx="10" fill="#0C0B09" opacity="0.05"/>
  <line x1="410" y1="400" x2="410" y2="420" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="540" y1="400" x2="540" y2="420" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="670" y1="400" x2="670" y2="420" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <!-- Segment rempli (niveau 3 => pleine largeur, accent terracotta) -->
  <rect x="280" y="400" width="520" height="20" rx="10" fill="#C94F2E" opacity="0.5"/>
  <circle cx="800" cy="410" r="9" fill="#C94F2E" opacity="0.85"/>

  <!-- ============ RANGEE 4 : Gouvernance (score 1/3, demi-cran ~1.5) ============ -->
  <rect x="72" y="480" width="190" height="13" rx="3" fill="#0C0B09" opacity="0.32"/>
  <rect x="72" y="500" width="90" height="9" rx="3" fill="#6B6560" opacity="0.3"/>
  <rect x="280" y="482" width="520" height="20" rx="10" fill="#0C0B09" opacity="0.05"/>
  <line x1="410" y1="482" x2="410" y2="502" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="540" y1="482" x2="540" y2="502" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <line x1="670" y1="482" x2="670" y2="502" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.12"/>
  <!-- Segment rempli (niveau ~1.5) -->
  <rect x="280" y="482" width="195" height="20" rx="10" fill="#6B6560" opacity="0.3"/>
  <circle cx="475" cy="492" r="9" fill="#0C0B09" opacity="0.22"/>

  <!-- Separateur bas + ligne score global -->
  <rect x="72" y="556" width="712" height="1" fill="#0C0B09" opacity="0.08"/>
  <rect x="72" y="582" width="170" height="13" rx="3" fill="#0C0B09" opacity="0.18"/>
  <!-- Barre score global agrege -->
  <rect x="280" y="582" width="520" height="22" rx="11" fill="#0C0B09" opacity="0.06"/>
  <rect x="280" y="582" width="312" height="22" rx="11" fill="#C94F2E" opacity="0.4"/>
  <!-- Valeur globale chiffre simule -->
  <rect x="72" y="636" width="120" height="26" rx="4" fill="#C94F2E" opacity="0.5"/>
  <rect x="210" y="642" width="160" height="12" rx="3" fill="#6B6560" opacity="0.4"/>

  <!-- ============ ENCART RADAR 4 axes (resume) ============ -->
  <rect x="832" y="152" width="344" height="554" rx="8" fill="#FFFFFF" opacity="0.7" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <rect x="856" y="178" width="150" height="12" rx="3" fill="#0C0B09" opacity="0.18"/>

  <!-- Centre radar : (1004, 360), rayon max 130 -->
  <!-- Grilles concentriques (4 niveaux : 0,1,2,3) en losange 4 axes -->
  <!-- niveau 3 (exterieur) -->
  <polygon points="1004,230 1134,360 1004,490 874,360" fill="none" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <!-- niveau 2 -->
  <polygon points="1004,273 1091,360 1004,447 917,360" fill="none" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.08"/>
  <!-- niveau 1 -->
  <polygon points="1004,317 1047,360 1004,403 961,360" fill="none" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.08"/>
  <!-- Axes -->
  <line x1="1004" y1="360" x2="1004" y2="230" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="1004" y1="360" x2="1134" y2="360" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="1004" y1="360" x2="1004" y2="490" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.12"/>
  <line x1="1004" y1="360" x2="874" y2="360" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- Polygone des scores : Donnees(haut)=2, Outillage(droite)=1, Equipe(bas)=3, Gouvernance(gauche)=1.5 -->
  <!-- haut score2 => y=360-87=273 ; droite score1 => x=1004+43=1047 ; bas score3 => y=360+130=490 ; gauche score1.5 => x=1004-65=939 -->
  <polygon points="1004,273 1047,360 1004,490 939,360" fill="#C94F2E" opacity="0.1" stroke="#C94F2E" stroke-width="2" stroke-linejoin="round"/>
  <!-- Sommets -->
  <circle cx="1004" cy="273" r="4" fill="#0C0B09" opacity="0.4"/>
  <circle cx="1047" cy="360" r="4" fill="#0C0B09" opacity="0.4"/>
  <circle cx="1004" cy="490" r="5" fill="#C94F2E" opacity="0.85"/>
  <circle cx="939" cy="360" r="4" fill="#0C0B09" opacity="0.4"/>

  <!-- Reperes d'axes (petits rect = labels dimensions) -->
  <rect x="966" y="206" width="76" height="9" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="1142" y="356" width="30" height="9" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="966" y="502" width="76" height="9" rx="2" fill="#C94F2E" opacity="0.5"/>
  <rect x="838" y="356" width="30" height="9" rx="2" fill="#6B6560" opacity="0.4"/>

  <!-- Legende basse encart : 4 lignes score -->
  <rect x="856" y="560" width="296" height="1" fill="#0C0B09" opacity="0.07"/>
  <rect x="856" y="574" width="140" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1116" y="574" width="36" height="9" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="856" y="598" width="120" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1116" y="598" width="36" height="9" rx="2" fill="#6B6560" opacity="0.4"/>
  <rect x="856" y="622" width="100" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1116" y="622" width="36" height="9" rx="2" fill="#C94F2E" opacity="0.5"/>
  <rect x="856" y="646" width="150" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1116" y="646" width="36" height="9" rx="2" fill="#6B6560" opacity="0.4"/>

</svg>
