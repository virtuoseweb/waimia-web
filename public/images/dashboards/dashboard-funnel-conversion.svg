<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Tableau de bord tunnel de conversion temps reel">
  <title>Dashboard tunnel de conversion</title>

  <!-- Fond paper DS -->
  <rect width="1200" height="750" fill="#F6F1E8"/>

  <!-- Cadre externe -->
  <rect x="1" y="1" width="1198" height="748" fill="none" stroke="#0C0B09" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Header de fenetre (meme grammaire que le calendrier) -->
  <rect x="0" y="0" width="1200" height="52" fill="#EFE9DD"/>
  <!-- 3 dots -->
  <circle cx="32" cy="26" r="6" fill="#0C0B09" opacity="0.18"/>
  <circle cx="52" cy="26" r="6" fill="#0C0B09" opacity="0.12"/>
  <circle cx="72" cy="26" r="6" fill="#0C0B09" opacity="0.12"/>
  <!-- Barre de titre -->
  <rect x="108" y="18" width="170" height="16" rx="4" fill="#0C0B09" opacity="0.12"/>
  <!-- Nav header -->
  <rect x="320" y="20" width="78" height="12" rx="3" fill="#6B6560" opacity="0.5"/>
  <rect x="418" y="20" width="78" height="12" rx="3" fill="#6B6560" opacity="0.5"/>
  <!-- Indicateur temps reel (point + label) -->
  <circle cx="1066" cy="26" r="5" fill="#C94F2E" opacity="0.85"/>
  <rect x="1080" y="20" width="96" height="12" rx="3" fill="#C94F2E" opacity="0.6"/>

  <!-- Titre page -->
  <rect x="48" y="78" width="300" height="22" rx="4" fill="#0C0B09" opacity="0.18"/>
  <rect x="48" y="108" width="220" height="12" rx="3" fill="#6B6560" opacity="0.4"/>

  <!-- 3 mini-metriques en haut (paires label-barre) -->
  <rect x="48" y="146" width="240" height="92" rx="8" fill="#FFFFFF" opacity="0.7" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <rect x="68" y="164" width="90" height="10" rx="3" fill="#6B6560" opacity="0.5"/>
  <rect x="68" y="182" width="130" height="26" rx="4" fill="#0C0B09" opacity="0.14"/>
  <rect x="68" y="216" width="70" height="9" rx="3" fill="#C94F2E" opacity="0.5"/>

  <rect x="312" y="146" width="240" height="92" rx="8" fill="#FFFFFF" opacity="0.7" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <rect x="332" y="164" width="90" height="10" rx="3" fill="#6B6560" opacity="0.5"/>
  <rect x="332" y="182" width="130" height="26" rx="4" fill="#0C0B09" opacity="0.14"/>
  <rect x="332" y="216" width="70" height="9" rx="3" fill="#C94F2E" opacity="0.5"/>

  <rect x="576" y="146" width="240" height="92" rx="8" fill="#FFFFFF" opacity="0.7" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <rect x="596" y="164" width="90" height="10" rx="3" fill="#6B6560" opacity="0.5"/>
  <rect x="596" y="182" width="130" height="26" rx="4" fill="#0C0B09" opacity="0.14"/>
  <rect x="596" y="216" width="70" height="9" rx="3" fill="#C94F2E" opacity="0.5"/>

  <!-- Zone principale : entonnoir -->
  <rect x="48" y="262" width="768" height="444" rx="8" fill="#FFFFFF" opacity="0.6" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <rect x="68" y="282" width="200" height="14" rx="3" fill="#0C0B09" opacity="0.18"/>

  <!-- Palier 1 : Visiteurs (le plus large) -->
  <rect x="92" y="324" width="680" height="64" rx="6" fill="#0C0B09" opacity="0.07"/>
  <rect x="92" y="324" width="680" height="64" rx="6" fill="#6B6560" opacity="0.18"/>
  <rect x="112" y="342" width="120" height="11" rx="3" fill="#0C0B09" opacity="0.3"/>
  <rect x="112" y="362" width="90" height="14" rx="3" fill="#0C0B09" opacity="0.2"/>

  <!-- % de passage 1->2 -->
  <rect x="700" y="396" width="52" height="9" rx="3" fill="#6B6560" opacity="0.45"/>

  <!-- Palier 2 : Leads -->
  <rect x="158" y="412" width="548" height="64" rx="6" fill="#0C0B09" opacity="0.07"/>
  <rect x="158" y="412" width="548" height="64" rx="6" fill="#6B6560" opacity="0.22"/>
  <rect x="178" y="430" width="120" height="11" rx="3" fill="#0C0B09" opacity="0.3"/>
  <rect x="178" y="450" width="80" height="14" rx="3" fill="#0C0B09" opacity="0.2"/>

  <!-- % de passage 2->3 -->
  <rect x="640" y="484" width="52" height="9" rx="3" fill="#6B6560" opacity="0.45"/>

  <!-- Palier 3 : Qualifies -->
  <rect x="234" y="500" width="396" height="64" rx="6" fill="#0C0B09" opacity="0.07"/>
  <rect x="234" y="500" width="396" height="64" rx="6" fill="#6B6560" opacity="0.26"/>
  <rect x="254" y="518" width="120" height="11" rx="3" fill="#0C0B09" opacity="0.3"/>
  <rect x="254" y="538" width="70" height="14" rx="3" fill="#0C0B09" opacity="0.2"/>

  <!-- % de passage 3->4 (accent, taux cle) -->
  <rect x="560" y="572" width="60" height="11" rx="3" fill="#C94F2E" opacity="0.6"/>

  <!-- Palier 4 : Clients (accent terracotta, palier final) -->
  <rect x="310" y="590" width="244" height="64" rx="6" fill="#C94F2E" opacity="0.1"/>
  <rect x="310" y="590" width="244" height="64" rx="6" fill="#C94F2E" opacity="0.45"/>
  <rect x="330" y="608" width="120" height="11" rx="3" fill="#C94F2E" opacity="0.85"/>
  <rect x="330" y="628" width="64" height="14" rx="3" fill="#C94F2E" opacity="0.7"/>

  <!-- Panel lateral droit : courbe temps reel -->
  <rect x="840" y="262" width="336" height="444" rx="8" fill="#FFFFFF" opacity="0.7" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.1"/>
  <rect x="860" y="282" width="160" height="14" rx="3" fill="#0C0B09" opacity="0.18"/>
  <!-- Valeur cle live -->
  <rect x="860" y="312" width="120" height="24" rx="4" fill="#C94F2E" opacity="0.5"/>

  <!-- Axes courbe -->
  <line x1="868" y1="560" x2="1156" y2="560" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.2"/>
  <line x1="868" y1="370" x2="868" y2="560" stroke="#0C0B09" stroke-width="0.75" stroke-opacity="0.2"/>
  <!-- Gridlines -->
  <line x1="868" y1="510" x2="1156" y2="510" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="4 4"/>
  <line x1="868" y1="460" x2="1156" y2="460" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="4 4"/>
  <line x1="868" y1="410" x2="1156" y2="410" stroke="#0C0B09" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="4 4"/>
  <!-- Courbe temps reel (accent), fluctuante puis montante -->
  <polyline points="868,540 908,520 948,528 988,500 1028,508 1068,470 1108,452 1156,420" fill="none" stroke="#C94F2E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="868,540 908,520 948,528 988,500 1028,508 1068,470 1108,452 1156,420 1156,560 868,560" fill="#C94F2E" opacity="0.06"/>
  <!-- Point live en bout de courbe -->
  <circle cx="1156" cy="420" r="5" fill="#C94F2E" opacity="0.9"/>

  <!-- Mini legende / lignes table sous la courbe -->
  <rect x="860" y="600" width="288" height="1" fill="#0C0B09" opacity="0.07"/>
  <rect x="860" y="612" width="180" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1090" y="612" width="58" height="9" rx="2" fill="#6B6560" opacity="0.3"/>
  <rect x="860" y="636" width="150" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1090" y="636" width="58" height="9" rx="2" fill="#6B6560" opacity="0.3"/>
  <rect x="860" y="660" width="170" height="9" rx="2" fill="#6B6560" opacity="0.35"/>
  <rect x="1090" y="660" width="58" height="9" rx="2" fill="#C94F2E" opacity="0.4"/>

</svg>
