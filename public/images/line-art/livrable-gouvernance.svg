<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" role="presentation">
  <!-- Livrable : cadre de gouvernance -> bouclier / cadre de regles et de controle -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- bouclier -->
    <path d="M32 8 L52 16 L52 32 C52 44 43 52 32 57 C21 52 12 44 12 32 L12 16 Z"/>
    <!-- lignes de regles internes -->
    <path d="M22 26 L42 26" stroke-width="1.5" opacity="0.55"/>
    <path d="M22 34 L42 34" stroke-width="1.5" opacity="0.55"/>
    <path d="M22 42 L34 42" stroke-width="1.5" opacity="0.55"/>
  </g>
  <!-- accent : marque de validation / conformite -->
  <g stroke="var(--accent, #C94F2E)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M26 19 L30 23 L39 14"/>
  </g>
</svg>
