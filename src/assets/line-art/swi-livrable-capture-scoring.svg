<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" role="presentation">
  <!-- Livrable : quiz de routing + capture + scoring -> entonnoir qui qualifie, sortie validee -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- entonnoir -->
    <path d="M12 14 L52 14 L38 34 L38 50 L26 44 L26 34 Z"/>
    <!-- lignes d'entree (leads en haut) -->
    <path d="M20 9 L20 13" stroke-width="1.5" opacity="0.6"/>
    <path d="M32 9 L32 13" stroke-width="1.5" opacity="0.6"/>
    <path d="M44 9 L44 13" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- accent : la coche de score / lead qualifie -->
  <g stroke="var(--accent, #C94F2E)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="46" cy="46" r="8" stroke-width="2"/>
    <path d="M42 46 L45 49 L51 43"/>
  </g>
</svg>
