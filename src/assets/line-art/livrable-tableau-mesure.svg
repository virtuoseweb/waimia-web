<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" role="presentation">
  <!-- Livrable : tableau de mesure -> dashboard de KPI avec courbe et barres -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cadre du tableau -->
    <rect x="8" y="12" width="48" height="40" rx="4"/>
    <!-- barre de titre -->
    <path d="M8 20 L56 20" stroke-width="1.4" opacity="0.7"/>
    <!-- axes du graphe -->
    <path d="M16 44 L16 26" stroke-width="1.4" opacity="0.6"/>
    <path d="M16 44 L48 44" stroke-width="1.4" opacity="0.6"/>
    <!-- barres -->
    <path d="M22 44 L22 38"/>
    <path d="M30 44 L30 33"/>
    <path d="M38 44 L38 29"/>
  </g>
  <!-- accent : la courbe de tendance (la mesure qui compte) -->
  <g stroke="var(--accent, #C94F2E)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 40 L26 35 L34 31 L46 24"/>
  </g>
  <circle cx="46" cy="24" r="2.6" fill="var(--accent, #C94F2E)"/>
</svg>
