<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" role="presentation">
  <!-- Livrable : landing pages par persona -> plusieurs pages empilees -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- page du fond -->
    <rect x="16" y="10" width="30" height="38" rx="3" opacity="0.5" stroke-width="1.6"/>
    <!-- page du milieu -->
    <rect x="13" y="14" width="30" height="38" rx="3" opacity="0.75" stroke-width="1.8"/>
    <!-- page de devant -->
    <rect x="10" y="18" width="30" height="38" rx="3"/>
    <!-- contenu de la page de devant -->
    <path d="M16 28 L34 28" stroke-width="1.5" opacity="0.6"/>
    <path d="M16 35 L30 35" stroke-width="1.5" opacity="0.6"/>
    <path d="M16 42 L26 42" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- accent : CTA / persona ciblee sur la page de devant -->
  <rect x="16" y="46" width="14" height="6" rx="3" fill="var(--accent, #C94F2E)" stroke="none"/>
</svg>
