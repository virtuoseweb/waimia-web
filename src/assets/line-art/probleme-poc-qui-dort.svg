<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" role="presentation">
  <!-- Probleme : le POC qui dort. Une experimentation prometteuse mise en pause, jamais passee en production. -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ecran / prototype -->
    <rect x="8" y="20" width="40" height="28" rx="3"/>
    <path d="M22 54 L34 54"/>
    <path d="M28 48 L28 54"/>
    <!-- contenu schematique fige a l'interieur (idee en sommeil) -->
    <path d="M14 28 L34 28" stroke-width="1.5" opacity="0.5"/>
    <path d="M14 34 L28 34" stroke-width="1.5" opacity="0.5"/>
    <path d="M14 40 L24 40" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- accent : "z z z" du sommeil qui s'eleve (le POC dort) en terracotta, ordonne en diagonale -->
  <g stroke="var(--accent, #C94F2E)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 30 L48 30 L40 38 L48 38"/>
    <path d="M48 18 L54 18 L48 24 L54 24"/>
    <path d="M54 9 L58 9 L54 13 L58 13"/>
  </g>
</svg>
