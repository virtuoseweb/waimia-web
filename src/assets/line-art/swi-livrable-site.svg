<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true" role="presentation">
  <!-- Livrable : site web cree ou refondu -> fenetre de navigateur -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- cadre de la fenetre -->
    <rect x="8" y="12" width="48" height="40" rx="4"/>
    <!-- barre d'onglets -->
    <path d="M8 22 L56 22"/>
    <!-- pastilles de la barre -->
    <circle cx="14" cy="17" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="19" cy="17" r="1.4" fill="currentColor" stroke="none"/>
    <circle cx="24" cy="17" r="1.4" fill="currentColor" stroke="none"/>
    <!-- contenu : blocs de page -->
    <path d="M14 30 L34 30" stroke-width="1.5" opacity="0.6"/>
    <path d="M14 37 L42 37" stroke-width="1.5" opacity="0.6"/>
    <path d="M14 44 L30 44" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- accent : bloc visuel mis en avant -->
  <rect x="40" y="30" width="12" height="14" rx="2" fill="var(--accent, #C94F2E)" stroke="none"/>
</svg>
