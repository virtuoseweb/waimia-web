name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Annule les runs obsolètes quand on pousse plusieurs fois sur la même PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # astro check : surfacé mais non-bloquant tant que la suite type n'est pas figée
      - name: Type / content check (non-blocking)
        run: pnpm check
        continue-on-error: true

      # Le build doit passer : c'est la garantie que toute PR reste déployable sur Vercel
      - name: Build
        run: pnpm build

      # Gate codegen : drift entre les touchpoints du catalogue (schema/demos/registry/composants/manifest).
      # exit 1 si désynchronisé → empêche une PR de casser la source unique de la bibliothèque.
      - name: Drift-guard catalogue (touchpoints)
        run: node scripts/check-touchpoints.mjs

      # Gate qualité GF-1 structurel sur le dist/ bâti (pages indexées only) : heading-order,
      # liens internes redirect-aware, img alt, html lang. exit 1 sur régression ; les dettes
      # connues (gated produit/légal) sont listées non-bloquantes via ALLOWLIST documentée.
      - name: Gate qualité statique (a11y structurel + liens internes)
        run: node scripts/check-static-quality.mjs

      # Gate SEO sur le dist/ bâti (pages indexées only) : meta description présente + <= 160 chars,
      # canonical présent, aucune page noindex listée au sitemap (cohérence noindex<->crawl).
      # Complète check-static-quality (qui couvre h1/img-alt/html-lang). exit 1 sur régression.
      - name: Gate SEO (meta-length + noindex<->sitemap + canonical)
        run: node scripts/check-seo.mjs

      # Gate pureté DS : interdit tout hex brut réintroduit dans sections/*.astro (le DS est
      # 100% token-driven → l'outil d'identité repeint en swappant les valeurs de tokens).
      # Les rgba de marque restants sont surfacés en dette non-bloquante (à tokeniser).
      - name: Gate pureté DS (token-driven, anti hex brut)
        run: node scripts/check-token-purity.mjs

      # Gate anti-régression : var() est invalide dans une condition @media/@container (spec CSS)
      # Le bloc est jeté silencieusement par le navigateur. Le reflow responsive n'est jamais appliqué.
      - name: Gate media-query (anti var() en condition @media)
        run: node scripts/check-media-query-var.mjs

      # Gate anti-régression forms : un form ne doit pas poster vers un endpoint /api/* absent.
      # Regression de reference : f3ac27d (SR-05) - endpoints supprimes, forms en 404 silencieux.
      - name: Gate · form endpoints exist (anti-régression forms)
        run: node scripts/check-form-endpoints.mjs

      # Gate gutter canonique : le gutter horizontal du site est UNIQUE = var(--gut) (tokens.css,
      # responsive 32→20→16px). Interdit tout override de padding horizontal sur .wrap/.wrap-wide/
      # .wrap-tight (ex. padding: 0 var(--space-8)) et tout usage du token fantôme var(--space-page-x).
      # exit 1 sur régression → fige l'uniformité du gutter partout.
      - name: Gate gutter canonique (var(--gut) unique, anti-override .wrap*)
        run: node scripts/check-gutter.mjs

  # Gates SEO sur le build TEL QUE DÉPLOYÉ EN PRODUCTION (WAIMIA_INTERNAL_TOOLS=0 : sans le
  # catalogue interne /preview, /library, /dashboard-seo, comme sur waimia.com). Le job
  # `build` ci-dessus garde le build complet, dont dépendent le sweep GF-1 et les e2e.
  # Ce job échoue si : une URL du sitemap n'est pas 200 / indexable / canonique, un JSON-LD
  # est invalide, une page indexable n'a pas de title / description / h1 / canonical, une
  # redirection fait une chaîne ou pointe un 404, une surface interne est générée ou liée.
  seo:
    name: SEO (build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build de production (sans surfaces internes)
        run: pnpm build
        env:
          WAIMIA_INTERNAL_TOOLS: '0'

      # title, meta description, h1 unique, canonical, Open Graph sur chaque page indexable.
      - name: Gate head (title + description + h1 + canonical)
        run: node scripts/check-head.mjs

      # Syntaxe, propriétés requises par type, références @id, couverture par type de page,
      # FAQ balisée seulement si visible, prix balisé seulement si affiché.
      - name: Gate JSON-LD (données structurées valides)
        run: node scripts/check-jsonld.mjs

      # Chaque URL du sitemap : 200, indexable, canonique, non redirigée, explorable, lastmod réel.
      - name: Gate sitemap (sitemap / robots / noindex cohérents)
        run: node scripts/check-sitemap.mjs

      # Config Vercel générée : un seul saut, cible 200, ni chaîne ni boucle, slash final.
      - name: Gate redirections (config Vercel générée)
        run: node scripts/check-redirects.mjs

      # Aucune surface interne générée ni liée, .md et llms.txt limités aux pages indexables,
      # aucun résidu /en, robots.txt et en-têtes X-Robots-Tag cohérents.
      - name: Gate surface publique (catalogue interne hors production)
        run: node scripts/check-public-surface.mjs --prod

      - name: Gate SEO historique (meta-length + noindex<->sitemap) sur le build de production
        run: node scripts/check-seo.mjs

      - name: Gate qualité statique sur le build de production (liens internes, titres, alt)
        run: node scripts/check-static-quality.mjs

      # Taux horaire et paliers de maintenance : source unique src/data/pricing.ts, aucun
      # montant horaire en dur dans le contenu, aucun jeton {{prix.*}} non résolu dans le build.
      - name: Gate prix (source unique du taux horaire)
        run: node scripts/check-pricing.mjs

      # Rapport de maillage : liens entrants contextuels par page, orphelines, profondeur.
      # Mode avertissement : n'échoue jamais, le rapport est dans le log du job.
      - name: Rapport maillage interne (avertissement)
        run: node scripts/check-internal-mesh.mjs
        continue-on-error: true

  # Suite Playwright e2e contre le BUILD servi (parité prod — le dev diverge du build).
  # Job SÉPARÉ, hors required-checks pour l'instant : visible mais non-bloquant le temps
  # de prouver sa stabilité en CI, puis promotion en gate. Couvre le DYNAMIQUE que le gate
  # statique ne voit pas : aria-pressed, JSON-LD, hreflang, overflow mobile, rendu templates,
  # formulaires. La suite est verte localement (45 passed / 9 skipped légitimes).
  e2e:
    name: E2E (Playwright · build servi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium + deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # serve-dist (parité prod) : --port en ARG, --root dist/client (sortie adapter Vercel).
      # On attend le 200 avant de lancer Playwright (baseURL externe → webServer désactivé).
      - name: E2E contre le build servi
        run: |
          node scripts/serve-dist.mjs --port 4330 --root dist/client &
          SERVE_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:4330/ >/dev/null 2>&1 && break; sleep 1; done
          PLAYWRIGHT_BASE_URL=http://localhost:4330 pnpm exec playwright test
          STATUS=$?
          kill $SERVE_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload traces/screenshots (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
