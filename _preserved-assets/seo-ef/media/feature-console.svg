<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Console d'orchestration des agents Waimia : fenetre de supervision avec courbe d'activite, journal de decisions et indicateur d'etat">
  <rect width="720" height="540" fill="#F6F1E8"/>

  <!-- application window -->
  <rect x="64" y="72" width="592" height="396" rx="16" fill="#EFE9DD" stroke="rgba(12,11,9,0.09)" stroke-width="1"/>
  <rect x="64" y="72" width="592" height="396" rx="16" fill="none" stroke="#0C0B09" stroke-width="1.6"/>

  <!-- chrome / title bar -->
  <path d="M64 112 L656 112" stroke="#0C0B09" stroke-width="1.2"/>
  <g fill="none" stroke="#0C0B09" stroke-width="1.2">
    <circle cx="92" cy="92" r="4.4"/>
    <circle cx="112" cy="92" r="4.4"/>
    <circle cx="132" cy="92" r="4.4"/>
  </g>
  <!-- title label (mono micro-text, drawn as a dashed run) -->
  <path d="M296 92 L416 92" fill="none" stroke="#6B6560" stroke-width="1" stroke-linecap="round" stroke-dasharray="46 10"/>

  <!-- status indicator : running, top-right -->
  <g fill="none" stroke="#0C0B09" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="612" cy="92" r="6.5" stroke-width="1.4"/>
    <path d="M608.5 92 L611.5 95.2 L616 87.5" stroke-width="1.5"/>
  </g>

  <!-- left rail : agent list -->
  <path d="M168 112 L168 468" fill="none" stroke="rgba(12,11,9,0.09)" stroke-width="1"/>
  <g fill="none" stroke="#0C0B09" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="96" cy="152" r="4" stroke-width="1.3"/>
    <circle cx="96" cy="184" r="4" stroke-width="1.3"/>
    <circle cx="96" cy="216" r="4" stroke-width="1.3"/>
    <circle cx="96" cy="248" r="4" stroke-width="1.3"/>
  </g>
  <g fill="none" stroke="#6B6560" stroke-width="1.4" stroke-linecap="round">
    <path d="M112 152 L150 152"/>
    <path d="M112 184 L144 184"/>
    <path d="M112 216 L150 216"/>
    <path d="M112 248 L138 248"/>
  </g>
  <!-- selected agent marker (left bar on the active row) -->
  <path d="M74 207 L74 225" fill="none" stroke="#0C0B09" stroke-width="2.4" stroke-linecap="round"/>

  <!-- panel A : activity sparkline -->
  <rect x="200" y="140" width="424" height="120" rx="10" fill="none" stroke="rgba(12,11,9,0.09)" stroke-width="1"/>
  <path d="M224 162 L300 162" fill="none" stroke="#6B6560" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="34 8"/>
  <path d="M224 226 L264 210 L304 220 L344 184 L384 198 L424 162 L464 176 L504 150 L544 168 L592 138"
        fill="none" stroke="#0C0B09" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 244 L596 244" fill="none" stroke="rgba(12,11,9,0.09)" stroke-width="1" stroke-dasharray="6 8"/>
  <!-- single accent : the live data point -->
  <circle cx="592" cy="138" r="5" fill="#C94F2E"/>

  <!-- panel B : decision log -->
  <rect x="200" y="288" width="424" height="156" rx="10" fill="none" stroke="rgba(12,11,9,0.09)" stroke-width="1"/>
  <g fill="none" stroke="#0C0B09" stroke-width="1.7" stroke-linecap="round">
    <path d="M224 320 L236 320"/>
    <path d="M224 348 L236 348"/>
    <path d="M224 376 L236 376"/>
    <path d="M224 404 L236 404"/>
  </g>
  <g fill="none" stroke="#6B6560" stroke-width="1" stroke-linecap="round">
    <path d="M250 320 L520 320" stroke-dasharray="40 12"/>
    <path d="M250 348 L452 348" stroke-dasharray="28 12"/>
    <path d="M250 376 L560 376" stroke-dasharray="52 14"/>
    <path d="M250 404 L408 404" stroke-dasharray="22 12"/>
  </g>
</svg>
