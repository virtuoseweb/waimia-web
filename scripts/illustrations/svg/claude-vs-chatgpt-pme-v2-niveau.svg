<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- duotone creme-aere · deux colonnes de hauteur égale ; une règle de niveau posée sur leurs sommets ; une silhouette sur un escabeau vérifie la bulle. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>

  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <rect y="540" width="1456" height="84" fill="{{ground}}"/>
  <!-- ombres au sol -->
  <path d="M600 540 L640 540 L740 578 L700 578 Z" fill="{{soft}}"/>
  <path d="M1040 540 L1080 540 L1180 578 L1140 578 Z" fill="{{soft}}"/>
  <!-- colonne gauche -->
  <rect x="420" y="232" width="180" height="308" fill="{{shape}}"/>
  <rect x="404" y="210" width="212" height="24" fill="{{detail}}"/>
  <rect x="404" y="520" width="212" height="22" fill="{{detail}}"/>
  <g fill="{{pale}}"><rect x="446" y="246" width="10" height="262"/><rect x="488" y="246" width="10" height="262"/><rect x="530" y="246" width="10" height="262"/><rect x="572" y="246" width="10" height="262"/></g>
  <!-- colonne droite -->
  <rect x="860" y="232" width="180" height="308" fill="{{shape}}"/>
  <rect x="844" y="210" width="212" height="24" fill="{{detail}}"/>
  <rect x="844" y="520" width="212" height="22" fill="{{detail}}"/>
  <g fill="{{pale}}"><rect x="886" y="246" width="10" height="262"/><rect x="928" y="246" width="10" height="262"/><rect x="970" y="246" width="10" height="262"/><rect x="1012" y="246" width="10" height="262"/></g>
  <!-- règle de niveau posée à plat -->
  <rect x="380" y="188" width="700" height="22" fill="{{subject}}"/>
  <rect x="690" y="192" width="80" height="14" rx="7" fill="{{light}}"/>
  <circle cx="730" cy="199" r="5" fill="{{detail}}"/>
  <rect x="718" y="192" width="2" height="14" fill="{{subject}}"/><rect x="740" y="192" width="2" height="14" fill="{{subject}}"/>
  <!-- escabeau dans l'espace entre les colonnes -->
  <g stroke="{{subject}}" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M700 540 L742 330"/><path d="M790 540 L748 330"/>
  </g>
  <g fill="{{subject}}">
    <rect x="726" y="398" width="34" height="5"/><rect x="718" y="440" width="50" height="5"/><rect x="710" y="482" width="66" height="5"/>
    <rect x="732" y="326" width="28" height="7"/>
  </g>
  <!-- silhouette sur l'escabeau, le visage à hauteur de la bulle -->
  <use href="#woman" transform="translate(746 326) scale(1.0)"/>
  <path d="M752 258 L766 214" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
</svg>
