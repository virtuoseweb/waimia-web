<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « un aiguilleur trie les pannes : une voie repart en boucle,
       une voie mène au grand signal d'alerte ». Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <clipPath id="above-ground"><rect width="1456" height="470"/></clipPath>
  </defs>

  <!-- Ciel et grand disque de signal -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1070" cy="250" r="150" fill="{{shape}}" clip-path="url(#above-ground)"/>
  <circle cx="1070" cy="250" r="96" fill="{{light}}" opacity="0.35"/>

  <!-- Mât du signal -->
  <rect x="1063" y="395" width="14" height="80" fill="{{deep}}"/>

  <!-- Sol -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <rect y="470" width="1456" height="3" fill="{{deep}}" opacity="0.55"/>

  <!-- Voie principale venant de la gauche -->
  <g fill="none" stroke="{{deep}}" stroke-linecap="round">
    <path d="M0 560 L520 560" stroke-width="5"/>
    <path d="M0 590 L520 590" stroke-width="5"/>
    <!-- branche droite : continue -->
    <path d="M520 560 L1456 560" stroke-width="5"/>
    <path d="M520 590 L1456 590" stroke-width="5"/>
    <!-- branche qui monte vers le signal -->
    <path d="M520 560 Q760 540 1040 486" stroke-width="4"/>
    <path d="M540 590 Q800 560 1100 492" stroke-width="4"/>
    <!-- branche qui repart en boucle vers l'arrière -->
    <path d="M500 560 Q360 520 300 490 Q250 470 300 470 Q380 476 440 520" stroke-width="4"/>
  </g>
  <!-- Traverses -->
  <g fill="{{deep}}" opacity="0.7">
    <rect x="40" y="553" width="8" height="44"/><rect x="120" y="553" width="8" height="44"/>
    <rect x="200" y="553" width="8" height="44"/><rect x="280" y="553" width="8" height="44"/>
    <rect x="360" y="553" width="8" height="44"/><rect x="440" y="553" width="8" height="44"/>
    <rect x="640" y="553" width="8" height="44"/><rect x="760" y="553" width="8" height="44"/>
    <rect x="880" y="553" width="8" height="44"/><rect x="1000" y="553" width="8" height="44"/>
    <rect x="1120" y="553" width="8" height="44"/><rect x="1240" y="553" width="8" height="44"/>
    <rect x="1360" y="553" width="8" height="44"/>
  </g>

  <!-- Levier d'aiguillage et aiguilleur -->
  <rect x="566" y="520" width="34" height="14" fill="{{deep}}"/>
  <rect x="580" y="470" width="5" height="54" fill="{{detail}}" transform="rotate(-22 582 524)"/>
  <circle cx="563" cy="474" r="7" fill="{{detail}}"/>
  <use href="#man" transform="translate(628 534) scale(0.95)"/>

  <!-- Deux silhouettes lointaines au pied du signal -->
  <use href="#man" transform="translate(1140 474) scale(0.55)"/>
  <use href="#man" transform="translate(1166 474) scale(0.5)"/>
</svg>
