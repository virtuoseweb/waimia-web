<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- tritone sol-bleu (ciel en ton fixe clair : le titre du héros passe dessus) · « quand reprendre le prototype » : un bateau en papier géant, chargé de
       caisses, s'enfonce un peu dans l'eau ; une planche le relie à un vrai navire à coque
       solide ; de petites silhouettes transbordent les caisses de l'un à l'autre. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="410"/></clipPath>
  </defs>

  <!-- Ciel, grand demi-disque posé sur l'horizon entre les deux bateaux -->
  <rect width="1456" height="624" fill="{{soft}}"/>
  <circle cx="730" cy="410" r="130" fill="{{pale}}" clip-path="url(#sky)"/>

  <g transform="translate(730 410) scale(0.56) translate(-740 -440)">
  <!-- Bateau en papier, légèrement penché, enfoncé dans l'eau -->
  <g transform="rotate(-5 400 450)">
    <path d="M400 168 L512 384 L288 384 Z" fill="{{light}}"/>
    <path d="M400 168 L512 384 L456 384 Z" fill="{{pale}}"/>
    <path d="M150 384 L650 384 L580 468 L220 468 Z" fill="{{light}}"/>
    <path d="M150 384 L288 384 L220 468 Z" fill="{{pale}}"/>
    <path d="M512 384 L650 384 L580 468 Z" fill="{{pale}}"/>
    <!-- caisses posées sur le bord du papier -->
    <g fill="{{subject}}">
      <rect x="196" y="340" width="46" height="44"/><rect x="246" y="352" width="34" height="32"/>
      <rect x="208" y="306" width="34" height="34"/>
      <rect x="530" y="348" width="40" height="36"/>
    </g>
  </g>
  </g>
  <!-- Eau : couvre le bas du bateau en papier, qui s'enfonce ; le navire flotte au-dessus -->
  <rect y="410" width="1456" height="214" fill="{{ground}}"/>
  <g fill="{{detail}}">
    <rect x="90" y="500" width="150" height="4"/><rect x="420" y="540" width="210" height="4"/>
    <rect x="700" y="486" width="120" height="4"/><rect x="980" y="560" width="190" height="4"/>
    <rect x="1250" y="500" width="130" height="4"/><rect x="230" y="590" width="170" height="4"/>
  </g>

  <g transform="translate(730 410) scale(0.56) translate(-740 -440)">
  <!-- Vrai navire : coque pleine, bande claire, rouf, cheminée -->
  <path d="M846 378 L1330 378 Q1324 430 1290 464 L900 464 Q866 430 846 378 Z" fill="{{subject}}"/>
  <rect x="852" y="394" width="472" height="10" fill="{{light}}"/>
  <rect x="1060" y="300" width="160" height="78" fill="{{light}}"/>
  <g fill="{{soft}}">
    <rect x="1080" y="318" width="22" height="20"/><rect x="1118" y="318" width="22" height="20"/>
    <rect x="1156" y="318" width="22" height="20"/>
  </g>
  <rect x="1178" y="250" width="30" height="50" fill="{{subject}}"/>
  <rect x="1178" y="262" width="30" height="8" fill="{{detail}}"/>
  <g fill="{{light}}">
    <rect x="930" y="340" width="40" height="38"/><rect x="976" y="352" width="34" height="26"/>
    <rect x="940" y="306" width="30" height="34"/>
  </g>

  <!-- Passerelle du papier vers le navire -->
  <path d="M600 376 L868 370 L868 377 L600 383 Z" fill="{{subject}}"/>

  <!-- Transbordement : une caisse passée à la main, une portée sur la planche, une reçue -->
  <use href="#man" transform="translate(588 366) scale(0.86)"/>
  <use href="#man" transform="translate(726 373) scale(0.86)"/>
  <rect x="732" y="320" width="26" height="20" fill="{{pale}}"/>
  <use href="#woman" transform="translate(900 378) scale(0.86)"/>
  </g>
</svg>
