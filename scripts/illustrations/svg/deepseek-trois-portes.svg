<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
<!-- Waimia · moteur B · un long mur percé de trois portes sous un ciel bleu ; par les deux premières, des feuilles s'envolent loin au-dessus du mur ; devant la troisième, elles restent en pile, gardées -->
<defs>
<g id="man"><circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/><rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/><rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/></g>
<g id="woman"><circle cx="0" cy="-90" r="7" fill="{{subject}}"/><circle cx="-5" cy="-96" r="5" fill="{{subject}}"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/><rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/><rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/></g>
<rect id="sheet" x="-10" y="-13" width="20" height="26" fill="{{light}}"/>
</defs>
<rect width="1456" height="624" fill="{{field}}"/>
<rect x="0" y="500" width="1456" height="124" fill="{{ground}}"/>

<!-- le mur et ses trois portes -->
<rect x="440" y="262" width="600" height="238" fill="{{shape}}"/>
<rect x="430" y="250" width="620" height="16" fill="{{deep}}"/>
<path d="M492 500 L568 500 L596 560 L464 560 Z" fill="{{shape}}"/>
<path d="M692 500 L768 500 L796 560 L664 560 Z" fill="{{shape}}"/>
<path d="M892 500 L968 500 L996 560 L864 560 Z" fill="{{shape}}"/>
<rect x="492" y="358" width="76" height="142" fill="{{subject}}"/>
<rect x="692" y="358" width="76" height="142" fill="{{subject}}"/>
<rect x="892" y="358" width="76" height="142" fill="{{subject}}"/>

<!-- feuilles qui partent loin, par les portes 1 et 2 -->
<use href="#sheet" transform="translate(536 330) rotate(-12)"/>
<use href="#sheet" transform="translate(566 270) rotate(10) scale(0.95)"/>
<use href="#sheet" transform="translate(616 212) rotate(-18) scale(0.9)"/>
<use href="#sheet" transform="translate(690 166) rotate(14) scale(0.8)"/>
<use href="#sheet" transform="translate(782 132) rotate(-10) scale(0.7)"/>
<use href="#sheet" transform="translate(744 324) rotate(15)"/>
<use href="#sheet" transform="translate(790 262) rotate(-8) scale(0.95)"/>
<use href="#sheet" transform="translate(850 206) rotate(20) scale(0.85)"/>
<use href="#sheet" transform="translate(930 160) rotate(-14) scale(0.75)"/>
<use href="#sheet" transform="translate(1020 126) rotate(8) scale(0.62)"/>
<use href="#sheet" transform="translate(890 110) rotate(18) scale(0.6)"/>
<use href="#sheet" transform="translate(1110 98) rotate(-12) scale(0.5)"/>
<use href="#sheet" transform="translate(1190 78) rotate(10) scale(0.42)"/>
<use href="#sheet" transform="translate(1262 62) rotate(-6) scale(0.35)"/>

<!-- porte 3 : la pile reste ici -->
<rect x="984" y="474" width="44" height="26" fill="{{light}}"/>
<rect x="988" y="460" width="40" height="14" fill="{{soft}}"/>
<rect x="984" y="448" width="44" height="12" fill="{{light}}"/>
<use href="#woman" transform="translate(1066 500) scale(1.3)"/>

<!-- un homme regarde les feuilles partir -->
<use href="#man" transform="translate(462 500) scale(1.3)"/>
</svg>
