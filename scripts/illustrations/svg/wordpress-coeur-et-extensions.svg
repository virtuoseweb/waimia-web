<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « WordPress » : un cœur (la rotonde) entouré d'annexes reliées par une
       coursive, comme les extensions d'un même édifice. Une personne vérifie un toit. Distribution
       prévue : terracotta-plein. Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <!-- Annexe : corps, toit à deux pentes, porte et fenêtre. Pieds à y=0 -->
    <g id="annex">
      <rect x="-42" y="-62" width="84" height="62" fill="{{subject}}"/>
      <path d="M-52 -62 L0 -106 L52 -62 Z" fill="{{deep}}"/>
      <rect x="-26" y="-42" width="16" height="42" fill="{{detail}}"/>
      <rect x="6" y="-46" width="20" height="20" fill="{{detail}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Nuages -->
  <g fill="{{detail}}" opacity="0.85">
    <ellipse cx="250" cy="170" rx="120" ry="14"/><ellipse cx="330" cy="150" rx="70" ry="12"/>
    <ellipse cx="1150" cy="140" rx="130" ry="14"/><ellipse cx="1230" cy="120" rx="64" ry="11"/>
  </g>
  <!-- Sol -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <rect y="470" width="1456" height="3" fill="{{deep}}" opacity="0.5"/>

  <!-- Coursive continue qui relie le cœur et toutes les annexes -->
  <rect x="150" y="448" width="1156" height="12" fill="{{subject}}"/>
  <g fill="{{subject}}">
    <rect x="190" y="460" width="6" height="12"/><rect x="330" y="460" width="6" height="12"/>
    <rect x="470" y="460" width="6" height="12"/><rect x="980" y="460" width="6" height="12"/>
    <rect x="1120" y="460" width="6" height="12"/><rect x="1260" y="460" width="6" height="12"/>
  </g>

  <!-- Le cœur : rotonde à dôme -->
  <path d="M568 470 A160 160 0 0 1 888 470 Z" fill="{{shape}}"/>
  <path d="M608 470 A120 120 0 0 1 848 470 Z" fill="{{detail}}" opacity="0.55"/>
  <rect x="548" y="458" width="360" height="14" fill="{{subject}}"/>
  <!-- Colonnes -->
  <g fill="{{subject}}">
    <rect x="590" y="350" width="12" height="108"/><rect x="650" y="316" width="12" height="142"/>
    <rect x="794" y="316" width="12" height="142"/><rect x="854" y="350" width="12" height="108"/>
  </g>
  <!-- Arche d'entrée -->
  <path d="M700 458 L700 400 A28 28 0 0 1 756 400 L756 458 Z" fill="{{subject}}"/>
  <!-- Lanterne au sommet -->
  <rect x="716" y="276" width="24" height="34" fill="{{subject}}"/>
  <path d="M708 276 L728 252 L748 276 Z" fill="{{subject}}"/>
  <circle cx="728" cy="246" r="5" fill="{{subject}}"/>

  <!-- Annexes à gauche -->
  <use href="#annex" transform="translate(470 448) scale(0.95)"/>
  <use href="#annex" transform="translate(330 448) scale(0.8)"/>
  <use href="#annex" transform="translate(190 448) scale(1.12)"/>
  <!-- Annexes à droite -->
  <use href="#annex" transform="translate(986 448) scale(0.95)"/>
  <use href="#annex" transform="translate(1126 448) scale(0.85)"/>
  <use href="#annex" transform="translate(1266 448) scale(1.1)"/>

  <!-- Échelle contre l'annexe de droite, une personne contrôle le toit -->
  <g stroke="{{subject}}" stroke-width="4" stroke-linecap="round">
    <line x1="1340" y1="470" x2="1304" y2="372"/><line x1="1364" y1="470" x2="1326" y2="378"/>
    <line x1="1337" y1="440" x2="1361" y2="440"/><line x1="1329" y1="414" x2="1352" y2="414"/><line x1="1321" y1="392" x2="1343" y2="392"/>
  </g>
  <use href="#man" transform="translate(1332 392) scale(0.5)"/>
  <!-- Personne au pied du cœur, de dos, qui regarde le dôme -->
  <use href="#man" transform="translate(500 548) scale(0.9)"/>
  <!-- Petite silhouette de l'autre côté -->
  <use href="#man" transform="translate(1040 560) scale(0.7)"/>
</svg>
