<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Refonte de site internet » : une refonte au sens propre. Un fondeur verse
       le métal d'un creuset dans un moule neuf ; à côté, le plan épinglé sur son chevalet
       donne la forme voulue, et une caisse garde les pièces de l'ancien objet à refondre.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 560 et 1200. Rôles : subject = le moule neuf ; silhouette en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Sol local -->
  <ellipse cx="880" cy="506" rx="400" ry="22" fill="{{ground}}"/>
  <ellipse cx="830" cy="502" rx="120" ry="8" fill="{{shape}}"/>
  <ellipse cx="1150" cy="502" rx="70" ry="6" fill="{{shape}}"/>
  <ellipse cx="610" cy="502" rx="36" ry="6" fill="{{shape}}"/>

  <!-- Le moule neuf, en bleu, et son entonnoir de coulée -->
  <rect x="730" y="392" width="200" height="110" rx="4" fill="{{subject}}"/>
  <rect x="730" y="440" width="200" height="5" fill="{{light}}"/>
  <path d="M812 392 L800 372 L852 372 L840 392 Z" fill="{{deep}}"/>

  <!-- Le creuset tenu à la tige, incliné ; le métal coule dans le moule -->
  <path d="M826 300 Q830 340 826 372" fill="none" stroke="{{soft}}" stroke-width="10" stroke-linecap="round"/>
  <g transform="rotate(-38 790 270)">
    <path d="M752 250 L828 250 L818 306 L762 306 Z" fill="{{deep}}"/>
    <rect x="748" y="244" width="84" height="10" rx="3" fill="{{shadow}}"/>
  </g>
  <path d="M660 340 L772 286" stroke="{{shadow}}" stroke-width="7" stroke-linecap="round"/>
  <!-- Quelques étincelles -->
  <g fill="{{soft}}">
    <circle cx="866" cy="360" r="4"/><circle cx="878" cy="342" r="3"/><circle cx="790" cy="358" r="3.5"/>
  </g>

  <!-- Le plan épinglé sur son chevalet -->
  <g fill="{{deep}}">
    <path d="M1010 502 L1018 502 L1040 300 L1032 300 Z"/>
    <path d="M1080 502 L1088 502 L1060 300 L1052 300 Z"/>
    <rect x="1000" y="420" width="96" height="7"/>
  </g>
  <rect x="992" y="300" width="112" height="118" fill="{{light}}" stroke="{{deep}}" stroke-width="4"/>
  <rect x="1012" y="330" width="72" height="50" rx="6" fill="none" stroke="{{subject}}" stroke-width="4"/>
  <rect x="1012" y="350" width="72" height="3" fill="{{subject}}"/>
  <circle cx="1048" cy="306" r="4" fill="{{shadow}}"/>

  <!-- La caisse des pièces de l'ancien objet -->
  <path d="M1126 452 L1150 436 L1166 454 Z" fill="{{soft}}"/>
  <rect x="1158" y="440" width="22" height="16" fill="{{soft}}" transform="rotate(18 1169 448)"/>
  <rect x="1110" y="452" width="86" height="50" fill="{{deep}}"/>
  <rect x="1110" y="470" width="86" height="4" fill="{{shape}}"/>

  <!-- Le fondeur, tablier, les deux mains sur la tige -->
  <g transform="translate(610 500) scale(2.1)">
    <g fill="{{shadow}}">
      <rect x="-9" y="-44" width="8" height="42"/>
      <rect x="1" y="-44" width="8" height="42"/>
      <rect x="-10" y="-3" width="10" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="12" height="3" rx="1.5"/>
      <path d="M-12 -82 Q0 -86 12 -82 L14 -42 L-14 -42 Z"/>
      <circle cx="1" cy="-92" r="7.5"/>
      <path d="M-7 -98 Q2 -104 10 -97 L9 -94 L-7 -95 Z"/>
    </g>
    <path d="M-6 -74 L8 -74 L10 -30 L-8 -30 Z" fill="{{deep}}"/>
    <path d="M9 -78 L16 -70 L24 -76" fill="none" stroke="{{shadow}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
