<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « Claude in Chrome : agir à votre place, sous contrôle » : une
       fauconnière, bras levé, retient par une longue filière un faucon qui vole vers l'un des
       trois perchoirs plantés dans la plaine ; seul le faucon porte la couleur.
       Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="4" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
    <g id="perch">
      <rect x="-7" y="-70" width="14" height="70" fill="{{subject}}"/>
      <rect x="-17" y="-92" width="34" height="24" rx="9" fill="{{subject}}"/>
      <rect x="-11" y="-88" width="22" height="5" rx="2.5" fill="{{soft}}"/>
    </g>
  </defs>

  <!-- Grand fond uni -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Grand disque pâle, haut à gauche -->
  <circle cx="470" cy="250" r="190" fill="{{shape}}"/>

  <!-- Plaine -->
  <rect y="480" width="1456" height="144" fill="{{ground}}"/>
  <g fill="{{soft}}">
    <rect x="60" y="520" width="170" height="5"/><rect x="330" y="580" width="230" height="5"/>
    <rect x="700" y="540" width="150" height="5"/><rect x="900" y="596" width="200" height="5"/>
    <rect x="1250" y="530" width="140" height="5"/>
  </g>

  <!-- Trois perchoirs à distance croissante : les seuls endroits où le faucon se pose -->
  <use href="#perch" transform="translate(200 566) scale(1.15)"/>
  <use href="#perch" transform="translate(410 530) scale(0.8)"/>
  <use href="#perch" transform="translate(600 506) scale(0.55)"/>

  <!-- Filière : du gant au faucon -->
  <path d="M1013 252 L585 222 L585 229 L1013 259 Z" fill="{{subject}}"/>

  <!-- Faucon en vol, tourné vers la gauche : ailes longues et pointues, queue serrée -->
  <g transform="translate(560 214) scale(1.3)">
    <path d="M-30 -14 L-4 -40 L70 -112 L118 -128 L60 -60 L40 -10 Z" fill="{{detail}}"/>
    <path d="M-20 -12 L10 -70 L52 -96 L24 -40 L20 -10 Z" fill="{{detail}}"/>
    <path d="M-62 -10 Q-40 -26 10 -22 L70 -14 Q30 6 -40 6 Z" fill="{{detail}}"/>
    <path d="M64 -18 L108 -34 L112 2 L64 -2 Z" fill="{{detail}}"/>
    <circle cx="-62" cy="-12" r="13" fill="{{detail}}"/>
    <path d="M-73 -18 L-88 -14 L-90 -4 L-84 -8 L-73 -6 Z" fill="{{subject}}"/>
    <circle cx="-66" cy="-15" r="2.6" fill="{{subject}}"/>
    <rect x="16" y="2" width="5" height="10" fill="{{subject}}"/>
  </g>

  <!-- La fauconnière, bras levé, gant au poing -->
  <use href="#woman" transform="translate(1080 480) scale(2.1)"/>
  <rect x="1074" y="224" width="12" height="92" rx="6" fill="{{subject}}" transform="rotate(-50 1080 312)"/>
  <rect x="1001" y="242" width="22" height="20" rx="7" fill="{{subject}}"/>
</svg>
