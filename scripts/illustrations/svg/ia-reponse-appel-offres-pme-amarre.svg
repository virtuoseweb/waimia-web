<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « tout est prêt, le départ reste à décider » : un voilier chargé,
       voiles hissées, encore amarré au ponton devant un demi-disque posé sur l'horizon ; au bout
       du ponton, une personne a la main sur la bitte d'amarrage. Deux collègues regardent.
       Distribution prévue : sol-bleu (mer = {{ground}}). Focal dans x 650 → 1100. -->
  <defs>
    <!-- Silhouette de profil tournée vers la droite, sans col (elle regarde le bateau) -->
    <g id="man-right">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M6 -95 Q-2 -101 -8 -93 L-8 -88 Q-3 -93 4 -92 Z" fill="{{subject}}"/>
      <path d="M-10 -80 Q0 -84 10 -80 L12 -42 L-12 -42 Z" fill="{{subject}}"/>
      <rect x="-10.5" y="-44" width="9" height="42" fill="{{subject}}"/>
      <rect x="1.5" y="-44" width="9" height="42" fill="{{subject}}"/>
      <rect x="-10" y="-3" width="13" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="2" y="-3" width="13" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman-right">
      <circle cx="0" cy="-88" r="7.5" fill="{{subject}}"/>
      <circle cx="-6" cy="-93" r="5" fill="{{subject}}"/>
      <path d="M-9 -78 Q0 -82 9 -78 L11 -52 L-11 -52 Z" fill="{{subject}}"/>
      <path d="M-11 -53 L11 -53 L9 -24 L-9 -24 Z" fill="{{subject}}"/>
      <rect x="-6.5" y="-25" width="5" height="23" fill="{{subject}}"/>
      <rect x="1.5" y="-25" width="5" height="23" fill="{{subject}}"/>
      <rect x="-7" y="-3" width="9" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1" y="-3" width="9" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="440"/></clipPath>
  </defs>

  <!-- Grand ciel uni -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Demi-disque posé sur l'horizon, derrière le bateau -->
  <circle cx="940" cy="440" r="210" fill="{{shape}}" clip-path="url(#sky)"/>

  <!-- Mer -->
  <rect y="440" width="1456" height="184" fill="{{ground}}"/>
  <g fill="{{pale}}">
    <rect x="80" y="520" width="150" height="3"/><rect x="330" y="560" width="210" height="3"/>
    <rect x="860" y="512" width="170" height="3"/><rect x="1110" y="470" width="140" height="3"/>
    <rect x="1000" y="580" width="230" height="3"/><rect x="640" y="600" width="120" height="3"/>
    <rect x="1290" y="540" width="110" height="3"/>
  </g>

  <!-- Ponton -->
  <g>
    <rect x="96" y="478" width="10" height="90" fill="{{mid}}"/>
    <rect x="300" y="478" width="10" height="90" fill="{{mid}}"/>
    <rect x="504" y="478" width="10" height="90" fill="{{mid}}"/>
    <rect x="708" y="478" width="10" height="90" fill="{{mid}}"/>
    <rect x="-10" y="464" width="770" height="18" fill="{{pale}}"/>
    <rect x="-10" y="478" width="770" height="4" fill="{{soft}}"/>
  </g>

  <!-- Bitte d'amarrage au bout du ponton -->
  <rect x="736" y="424" width="13" height="40" fill="{{subject}}"/>
  <rect x="732" y="420" width="21" height="7" fill="{{subject}}"/>

  <!-- Amarre : de la bitte à l'étrave, avec un léger mou -->
  <path d="M748 430 Q776 452 806 452" fill="none" stroke="{{subject}}" stroke-width="3.5"/>

  <!-- Voilier -->
  <g>
    <!-- grand-voile, bôme -->
    <path d="M913 150 L913 402 L1064 402 Z" fill="{{light}}"/>
    <path d="M913 236 L1002 336 L1002 344 L913 248 Z" fill="{{pale}}"/>
    <rect x="908" y="402" width="160" height="6" fill="{{subject}}"/>
    <!-- foc, plus petit et plus bas -->
    <path d="M899 188 L899 420 L820 420 Z" fill="{{light}}"/>
    <!-- mât -->
    <rect x="901" y="138" width="9" height="312" fill="{{subject}}"/>
    <!-- caisses chargées sur le pont arrière -->
    <rect x="936" y="424" width="34" height="24" fill="{{detail}}"/>
    <rect x="974" y="430" width="30" height="18" fill="{{detail}}"/>
    <rect x="1008" y="420" width="30" height="28" fill="{{detail}}"/>
    <rect x="943" y="408" width="22" height="16" fill="{{detail}}"/>
    <g fill="{{soft}}">
      <rect x="936" y="434" width="34" height="3"/><rect x="1008" y="432" width="30" height="3"/>
    </g>
    <!-- coque -->
    <path d="M800 448 L1080 448 L1056 488 L834 488 Z" fill="{{subject}}"/>
    <rect x="828" y="458" width="236" height="4" fill="{{light}}"/>
  </g>
  <!-- Reflet sombre de la coque -->
  <path d="M834 492 L1056 492 L1040 500 L850 500 Z" fill="{{deep}}"/>

  <!-- La personne qui décide, main posée sur la bitte -->
  <g transform="translate(702 464) scale(1.1)">
    <use href="#man-right"/>
    <path d="M4 -79 L33 -46 L28 -42 L-1 -74 Z" fill="{{subject}}"/>
    <circle cx="31" cy="-43" r="3.6" fill="{{subject}}"/>
  </g>

  <!-- Deux collègues en retrait sur le ponton -->
  <use href="#woman-right" transform="translate(560 464) scale(0.92)"/>
  <use href="#man-right" transform="translate(596 464) scale(0.94)"/>
</svg>
