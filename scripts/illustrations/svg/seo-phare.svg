<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · fallback Claude · duotone · « être trouvé » (SEO / GEO) : un phare sur une
       falaise, son faisceau balaie un grand ciel ; sur la mer, de petits bateaux se tournent
       vers lui. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="boat">
      <path d="M-26 0 L26 0 L18 10 L-18 10 Z" fill="{{subject}}"/>
      <rect x="-1.5" y="-38" width="3" height="38" fill="{{subject}}"/>
      <path d="M2 -36 L24 -4 L2 -4 Z" fill="{{light}}"/>
      <path d="M-2 -30 L-18 -4 L-2 -4 Z" fill="{{pale}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="440"/></clipPath>
  </defs>

  <!-- Grand ciel uni -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Disque bas sur l'horizon, à gauche -->
  <circle cx="300" cy="440" r="150" fill="{{shape}}" clip-path="url(#sky)"/>

  <!-- Faisceau : trois bandes de valeur en éventail, du phare vers la gauche -->
  <g clip-path="url(#sky)">
    <path d="M1150 150 L-40 20 L-40 330 Z" fill="{{soft}}"/>
    <path d="M1150 150 L-40 80 L-40 260 Z" fill="{{pale}}"/>
    <path d="M1150 150 L-40 128 L-40 205 Z" fill="{{light}}"/>
  </g>

  <!-- Mer : bande sombre avec reflets horizontaux -->
  <rect y="440" width="1456" height="184" fill="{{ground}}"/>
  <g fill="{{mid}}">
    <rect x="60" y="470" width="180" height="3"/><rect x="330" y="500" width="240" height="3"/>
    <rect x="140" y="540" width="160" height="3"/><rect x="620" y="470" width="120" height="3"/>
    <rect x="520" y="580" width="220" height="3"/><rect x="820" y="530" width="140" height="3"/>
  </g>
  <!-- Reflet du faisceau sur l'eau -->
  <path d="M1080 440 L240 440 L120 452 L1040 452 Z" fill="{{soft}}" opacity="0.9"/>

  <!-- Petits bateaux, tous orientés vers le phare -->
  <use href="#boat" transform="translate(190 520) scale(0.9)"/>
  <use href="#boat" transform="translate(420 488) scale(0.7)"/>
  <use href="#boat" transform="translate(560 560) scale(1.05)"/>
  <use href="#boat" transform="translate(760 500) scale(0.6)"/>

  <!-- Falaise -->
  <path d="M1010 624 L1040 470 L1090 430 L1220 410 L1330 430 L1456 400 L1456 624 Z" fill="{{subject}}"/>
  <path d="M1040 470 L1090 430 L1120 440 L1070 490 Z" fill="{{deep}}"/>

  <!-- Phare : tour à bandes, lanterne -->
  <g>
    <path d="M1126 412 L1174 412 L1166 190 L1134 190 Z" fill="{{light}}"/>
    <path d="M1131 330 L1169 330 L1167 290 L1133 290 Z" fill="{{shadow}}"/>
    <path d="M1134 240 L1166 240 L1165 212 L1135 212 Z" fill="{{shadow}}"/>
    <rect x="1124" y="180" width="52" height="10" fill="{{shadow}}"/>
    <rect x="1134" y="140" width="32" height="40" fill="{{light}}"/>
    <rect x="1140" y="146" width="20" height="28" fill="{{pale}}"/>
    <path d="M1128 140 L1150 116 L1172 140 Z" fill="{{shadow}}"/>
  </g>
  <!-- Gardien minuscule au pied du phare -->
  <g transform="translate(1205 412) scale(0.38)" fill="{{light}}">
    <circle cx="0" cy="-90" r="7.5"/>
    <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
    <rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/>
  </g>
</svg>
