      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="728" cy="300" r="260" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect x="716" y="170" width="24" height="330" fill="{{subject}}"/>
  <rect x="660" y="488" width="136" height="14" fill="{{subject}}"/>
  <circle cx="728" cy="170" r="22" fill="{{subject}}"/>
  <circle cx="728" cy="170" r="8" fill="{{light}}"/>
  <g transform="rotate(-4 728 170)">
    <rect x="348" y="162" width="760" height="16" rx="8" fill="{{subject}}"/>
