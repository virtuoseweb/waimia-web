  <path d="M998 300 L1216 300 Q1188 340 1107 342 Q1026 340 998 300 Z" fill="{{subject}}"/>
  <rect x="270" y="296" width="62" height="74" fill="{{detail}}"/><rect x="336" y="318" width="52" height="52" fill="{{deep}}"/><rect x="392" y="330" width="46" height="40" fill="{{detail}}"/>
  <rect x="290" y="226" width="56" height="70" fill="{{deep}}"/><rect x="350" y="250" width="44" height="46" fill="{{detail}}"/><rect x="306" y="170" width="46" height="56" fill="{{detail}}"/>
  <circle cx="1107" cy="262" r="40" fill="{{detail}}"/><circle cx="1107" cy="262" r="16" fill="{{deep}}"/>
