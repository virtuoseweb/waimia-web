<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « n8n vs Zapier » : à gauche, une borne fontaine à pièces où une personne glisse une pièce ; à droite, une pompe à bras qu'une autre personne actionne, caisse à outils ouverte à ses pieds.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution creme-aere ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="700" cy="506" rx="420" ry="22" fill="{{ground}}"/>
  <!-- borne à pièces : bec et bassin à gauche, fente à pièce à droite -->
  <rect x="360" y="240" width="104" height="260" rx="10" fill="{{subject}}"/>
  <rect x="380" y="268" width="64" height="44" fill="{{shape}}"/>
  <rect x="446" y="326" width="7" height="24" fill="{{light}}"/>
  <rect x="322" y="368" width="38" height="12" fill="{{subject}}"/>
  <rect x="322" y="380" width="12" height="10" fill="{{subject}}"/>
  <rect x="325" y="392" width="6" height="50" fill="{{shape}}"/>
  <rect x="302" y="442" width="56" height="30" fill="{{detail}}"/>
  <use href="#man" fill="{{shadow}}" transform="translate(512 500) scale(-2 2)"/>
  <path d="M496 346 L480 366 L462 342" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pompe à bras -->
  <rect x="812" y="300" width="40" height="200" fill="{{subject}}"/>
  <rect x="800" y="292" width="64" height="14" fill="{{subject}}"/>
  <rect x="852" y="340" width="40" height="14" fill="{{subject}}"/><rect x="880" y="354" width="12" height="14" fill="{{subject}}"/>
  <rect x="883" y="370" width="6" height="66" fill="{{shape}}"/>
  <rect x="862" y="436" width="52" height="34" fill="{{detail}}"/>
  <path d="M826 300 L748 246" stroke="{{subject}}" stroke-width="12" stroke-linecap="round"/>
  <use href="#man" fill="{{shadow}}" transform="translate(712 500) scale(2)"/>
  <path d="M728 346 L740 300 L748 250" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- caisse à outils ouverte -->
  <rect x="940" y="460" width="96" height="40" fill="{{detail}}"/>
  <path d="M940 460 L956 440 L1052 440 L1036 460 Z" fill="{{shape}}"/>
  <rect x="962" y="420" width="8" height="30" fill="{{subject}}" transform="rotate(-18 966 446)"/>
  <rect x="1000" y="426" width="22" height="8" fill="{{subject}}"/>

</svg>
