<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Claude Duet vs ChatGPT dots » : deux métronomes qui battent sans arrêt, de
       tailles et de réglages différents, le balancier de l'un à gauche, de l'autre à droite.
       Une femme, mains dans le dos, écoute lequel tient le bon tempo pour elle.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 600 et 1220. Rôles : subject = les caisses, shape = les fentes ; silhouette en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="900" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="830" cy="502" rx="110" ry="8" fill="{{shape}}"/>
  <ellipse cx="1090" cy="502" rx="90" ry="7" fill="{{shape}}"/>
  <ellipse cx="640" cy="502" rx="36" ry="6" fill="{{shape}}"/>
  <g transform="translate(830 492) scale(0.95)"><rect x="-92" y="-14" width="184" height="14" rx="3" fill="{{deep}}"/><path d="M-78 -14 L78 -14 L34 -250 L-34 -250 Z" fill="{{subject}}"/><rect x="-40" y="-262" width="80" height="14" rx="4" fill="{{subject}}"/><path d="M-20 -40 L20 -40 L12 -226 L-12 -226 Z" fill="{{shape}}"/><path d="M0 -50 L-82.7 -338.4" stroke="{{deep}}" stroke-width="8" stroke-linecap="round"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="{{deep}}" transform="translate(-41.3 -194.2) rotate(-16)"/><circle cx="0" cy="-50" r="9" fill="{{deep}}"/><circle cx="-132.6" cy="-347.8" r="3.5" fill="{{soft}}"/><circle cx="-89.9" cy="-363.4" r="3.5" fill="{{soft}}"/><circle cx="-45.4" cy="-372.8" r="3.5" fill="{{soft}}"/><circle cx="0.0" cy="-376.0" r="3.5" fill="{{soft}}"/><circle cx="45.4" cy="-372.8" r="3.5" fill="{{soft}}"/><circle cx="89.9" cy="-363.4" r="3.5" fill="{{soft}}"/><circle cx="132.6" cy="-347.8" r="3.5" fill="{{soft}}"/></g>
  <g transform="translate(1090 492) scale(0.74)"><rect x="-92" y="-14" width="184" height="14" rx="3" fill="{{deep}}"/><path d="M-78 -14 L78 -14 L34 -250 L-34 -250 Z" fill="{{subject}}"/><rect x="-40" y="-262" width="80" height="14" rx="4" fill="{{subject}}"/><path d="M-20 -40 L20 -40 L12 -226 L-12 -226 Z" fill="{{shape}}"/><path d="M0 -50 L102.6 -331.9" stroke="{{deep}}" stroke-width="8" stroke-linecap="round"/><rect x="-14" y="-12" width="28" height="24" rx="3" fill="{{deep}}" transform="translate(71.8 -247.3) rotate(20)"/><circle cx="0" cy="-50" r="9" fill="{{deep}}"/><circle cx="-132.6" cy="-347.8" r="3.5" fill="{{soft}}"/><circle cx="-89.9" cy="-363.4" r="3.5" fill="{{soft}}"/><circle cx="-45.4" cy="-372.8" r="3.5" fill="{{soft}}"/><circle cx="0.0" cy="-376.0" r="3.5" fill="{{soft}}"/><circle cx="45.4" cy="-372.8" r="3.5" fill="{{soft}}"/><circle cx="89.9" cy="-363.4" r="3.5" fill="{{soft}}"/><circle cx="132.6" cy="-347.8" r="3.5" fill="{{soft}}"/></g>
  <!-- La femme écoute, mains dans le dos -->
  <g transform="translate(640 500) scale(2.1)">
    <g fill="{{shadow}}">
      <circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/>
      <rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/>
    </g>
    <path d="M-6 -78 L-11 -64 L-6 -56" fill="none" stroke="{{shadow}}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
