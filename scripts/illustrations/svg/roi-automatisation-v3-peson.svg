<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · lot IMG1 · un grand peson romain suspendu à un portique ; un sac pend au crochet, une silhouette ajuste le contrepoids -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{detail}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{detail}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{detail}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{detail}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{detail}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{detail}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{detail}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{detail}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{detail}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{detail}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{detail}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{detail}}"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{detail}}" transform="rotate(-38 0 -78)"/>
    </g>
    <g id="reacher">
      <use href="#woman"/>
      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{detail}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pusher">
      <circle cx="10" cy="-86" r="7.5" fill="{{detail}}"/>
      <path d="M-6 -78 Q4 -82 14 -76 L4 -42 L-18 -44 Z" fill="{{detail}}"/>
      <rect x="2" y="-74" width="34" height="6" rx="3" fill="{{detail}}" transform="rotate(8 2 -74)"/>
      <path d="M-18 -44 L-4 -44 L-14 -2 L-26 -2 Z" fill="{{detail}}"/>
      <path d="M-6 -44 L6 -44 L14 -2 L2 -2 Z" fill="{{detail}}"/>
      <rect x="-30" y="-3" width="12" height="3" rx="1.5" fill="{{detail}}"/>
      <rect x="2" y="-3" width="12" height="3" rx="1.5" fill="{{detail}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="728" cy="300" r="220" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <g fill="{{detail}}">
    <rect x="460" y="90" width="16" height="410"/><rect x="980" y="90" width="16" height="410"/><rect x="450" y="80" width="556" height="18"/>
    <rect x="652" y="98" width="6" height="90"/>
    <rect x="520" y="186" width="420" height="12" transform="rotate(-2 655 192)"/>
    <rect x="566" y="196" width="4" height="70"/>
    <path d="M820 186 L860 186 L870 228 L810 228 Z"/>
  </g>
  <path d="M520 266 Q500 330 520 400 L616 400 Q636 330 616 266 Q600 252 568 252 Q536 252 520 266 Z" fill="{{subject}}"/>
  <rect x="548" y="244" width="40" height="12" fill="{{subject}}"/>
  <use href="#reacher" transform="translate(800 500) scale(1.35)"/>
  <use href="#man" transform="translate(320 500) scale(1.25)"/>

</svg>
