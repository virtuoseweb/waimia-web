<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Être cité par les IA » : une femme lâche un pigeon voyageur (detail = bleu) porteur d'un
       court message ; il vole vers une haute pile d'ouvrages de référence, sous un grand disque.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <circle cx="1000" cy="340" r="160" fill="{{shape}}"/>
  <ellipse cx="860" cy="506" rx="370" ry="22" fill="{{ground}}"/>
  <ellipse cx="1128" cy="502" rx="80" ry="7" fill="{{soft}}"/>
  <!-- La pile d'ouvrages -->
  <rect x="1062" y="476" width="132" height="24" fill="{{mid}}"/><rect x="1072" y="485" width="112" height="5" fill="{{pale}}"/><rect x="1074" y="452" width="112" height="24" fill="{{soft}}"/><rect x="1084" y="461" width="92" height="5" fill="{{pale}}"/><rect x="1056" y="428" width="128" height="24" fill="{{mid}}"/><rect x="1066" y="437" width="108" height="5" fill="{{pale}}"/><rect x="1080" y="404" width="96" height="24" fill="{{soft}}"/><rect x="1090" y="413" width="76" height="5" fill="{{pale}}"/><rect x="1068" y="380" width="110" height="24" fill="{{mid}}"/><rect x="1078" y="389" width="90" height="5" fill="{{pale}}"/>
  <!-- Le pigeon voyageur -->
  <g transform="rotate(-8 830 252)">
    <path d="M800 242 L842 236 L812 168 L776 182 Z" fill="{{detail}}"/>
    <path d="M776 256 L742 240 L744 274 Z" fill="{{detail}}"/>
    <ellipse cx="816" cy="254" rx="48" ry="20" fill="{{detail}}"/>
    <circle cx="864" cy="240" r="15" fill="{{detail}}"/>
    <path d="M877 236 L892 241 L877 246 Z" fill="{{deep}}"/>
    <path d="M796 262 L836 262 L806 304 L774 296 Z" fill="{{detail}}"/>
    <rect x="828" y="268" width="22" height="11" rx="3" fill="{{light}}" stroke="{{deep}}" stroke-width="3"/>
  </g>
  <!-- Elle vient de le lâcher -->
  <use href="#woman" transform="translate(560 500) scale(2.1 2.1)"/>
  <path d="M572 336 L596 292 L614 262" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
