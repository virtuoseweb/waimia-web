<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Départ d'un salarié : ses comptes d'IA personnels » : un bureau vide où un ordinateur portable reste allumé, chaise repoussée ; la personne s'en va par la porte, son carton dans les bras.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="walk"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-5" y="-46" width="9.5" height="45" transform="rotate(16 0 -44)"/><rect x="-4.5" y="-46" width="9.5" height="45" transform="rotate(-16 0 -44)"/><rect x="-21" y="-3" width="12" height="3" rx="1.5"/><rect x="10" y="-3" width="13" height="3" rx="1.5"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="680" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="470" cy="330" rx="130" ry="96" fill="{{pale}}"/>
  <!-- bureau -->
  <rect x="340" y="380" width="280" height="14" fill="{{deep}}"/>
  <rect x="352" y="394" width="10" height="106" fill="{{deep}}"/>
  <rect x="520" y="394" width="90" height="70" fill="{{soft}}"/><rect x="600" y="394" width="10" height="106" fill="{{deep}}"/>
  <rect x="540" y="424" width="50" height="6" fill="{{mid}}"/>
  <!-- ordinateur allumé (écran bleu) -->
  <rect x="402" y="282" width="138" height="94" rx="4" fill="{{shadow}}"/>
  <rect x="411" y="291" width="120" height="76" fill="{{subject}}"/>
  <path d="M392 376 L550 376 L562 384 L380 384 Z" fill="{{shadow}}"/>
  <!-- chaise repoussée -->
  <g transform="rotate(10 670 460)" fill="{{mid}}">
    <rect x="636" y="420" width="62" height="10"/><rect x="690" y="346" width="10" height="84"/>
    <rect x="640" y="430" width="8" height="66"/><rect x="688" y="430" width="8" height="66"/>
  </g>
  <!-- mur et porte ouverte -->
  <rect x="790" y="140" width="280" height="360" fill="{{pale}}"/>
  <rect x="884" y="234" width="92" height="266" fill="{{field}}"/>
  <path d="M976 234 L1010 252 L1010 500 L976 500 Z" fill="{{soft}}"/>
  <!-- la personne s'en va, carton dans les bras -->
  <use href="#walk" fill="{{shadow}}" transform="translate(928 500) scale(2)"/>
  <path d="M944 346 L960 368 L972 360" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="936" y="330" width="54" height="44" fill="{{mid}}"/>
  <rect x="936" y="346" width="54" height="7" fill="{{pale}}"/>

</svg>
