<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Bloquer l'entraînement des IA sans disparaître des réponses » : un livre ouvert sous une vitrine de musée ; deux visiteurs le regardent de près, sans pouvoir le prendre.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="woman"><circle cx="1" cy="-90" r="7"/><circle cx="-5" cy="-95" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="900" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="940" cy="501" rx="130" ry="7" fill="{{shape}}"/>
  <rect x="816" y="370" width="248" height="16" fill="{{mid}}"/>
  <rect x="832" y="386" width="216" height="114" fill="{{soft}}"/>
  <!-- vitrine (bleue) et son contenu -->
  <rect x="832" y="176" width="216" height="194" fill="{{subject}}"/>
  <path d="M900 350 L980 350 L970 330 L910 330 Z" fill="{{deep}}"/>
  <path d="M940 328 L878 312 L884 268 L940 282 Z" fill="{{light}}"/>
  <path d="M940 328 L1002 312 L996 268 L940 282 Z" fill="{{light}}"/>
  <rect x="937" y="280" width="6" height="50" fill="{{shadow}}"/>
  <rect x="832" y="176" width="10" height="194" fill="{{light}}"/>
  <rect x="824" y="164" width="232" height="14" fill="{{deep}}"/>
  <!-- visiteurs -->
  <use href="#man" fill="{{shadow}}" transform="translate(724 500) scale(2)"/>
  <use href="#woman" fill="{{shadow}}" transform="translate(1140 500) scale(-2.05 2.05)"/>
  <path d="M1128 344 L1112 360 L1094 336" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
