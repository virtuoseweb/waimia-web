<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour cabinet de conseil » : les notes d'entretiens, en pile et en vol, entrent dans
       un grand alambic ; le condenseur et le flacon recueillent la synthèse (detail = bleu).
       Le consultant regarde la goutte tomber.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="850" cy="506" rx="390" ry="22" fill="{{ground}}"/>
  <ellipse cx="740" cy="502" rx="120" ry="7" fill="{{soft}}"/>
  <ellipse cx="1048" cy="502" rx="60" ry="7" fill="{{soft}}"/>
  <!-- Pile de notes d'entretiens -->
  <rect x="500" y="404" width="96" height="96" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="508" y="414" width="80" height="3" fill="{{mid}}"/><rect x="508" y="426" width="80" height="3" fill="{{mid}}"/><rect x="508" y="438" width="80" height="3" fill="{{mid}}"/><rect x="508" y="450" width="80" height="3" fill="{{mid}}"/><rect x="508" y="462" width="80" height="3" fill="{{mid}}"/><rect x="508" y="474" width="80" height="3" fill="{{mid}}"/><rect x="508" y="486" width="80" height="3" fill="{{mid}}"/>
  <g transform="rotate(-18 564 365)"><rect x="536" y="330" width="56" height="70" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/><rect x="544.4" y="345.4" width="39.199999999999996" height="4.2" fill="{{mid}}"/><rect x="544.4" y="359.4" width="39.199999999999996" height="4.2" fill="{{mid}}"/><rect x="544.4" y="373.4" width="25.2" height="4.2" fill="{{mid}}"/></g>
  <g transform="rotate(14 616 295)"><rect x="590" y="262" width="52" height="66" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/><rect x="597.8" y="276.52" width="36.4" height="3.96" fill="{{mid}}"/><rect x="597.8" y="289.71999999999997" width="36.4" height="3.96" fill="{{mid}}"/><rect x="597.8" y="302.91999999999996" width="23.400000000000002" height="3.96" fill="{{mid}}"/></g>
  <g transform="rotate(-8 584 216)"><rect x="560" y="186" width="48" height="60" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/><rect x="567.2" y="199.2" width="33.599999999999994" height="3.5999999999999996" fill="{{mid}}"/><rect x="567.2" y="211.2" width="33.599999999999994" height="3.5999999999999996" fill="{{mid}}"/><rect x="567.2" y="223.2" width="21.6" height="3.5999999999999996" fill="{{mid}}"/></g>
  <!-- Foyer et cuve -->
  <rect x="652" y="462" width="176" height="38" fill="{{deep}}"/>
  <ellipse cx="740" cy="400" rx="112" ry="78" fill="{{shape}}"/>
  <rect x="640" y="396" width="200" height="8" fill="{{pale}}"/>
  <!-- Chapiteau et col de cygne -->
  <path d="M692 336 Q692 262 740 252 Q788 262 788 336 Z" fill="{{deep}}"/>
  <rect x="732" y="236" width="16" height="20" rx="4" fill="{{deep}}"/>
  <path d="M744 240 Q850 170 948 300" fill="none" stroke="{{deep}}" stroke-width="13" stroke-linecap="round"/>
  <!-- Condenseur rempli d'eau, sortie, goutte, flacon -->
  <rect x="910" y="296" width="92" height="150" rx="10" fill="{{detail}}"/>
  <rect x="902" y="288" width="108" height="14" rx="5" fill="{{deep}}"/>
  <rect x="918" y="444" width="10" height="56" fill="{{deep}}"/>
  <rect x="984" y="444" width="10" height="56" fill="{{deep}}"/>
  <path d="M1002 410 L1044 410 L1044 418" fill="none" stroke="{{deep}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="1044" cy="434" rx="6" ry="9" fill="{{detail}}"/>
  <path d="M1034 446 L1054 446 L1054 462 L1090 500 L998 500 L1034 462 Z" fill="{{pale}}" stroke="{{deep}}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1020 476 L1068 476 L1090 499 L998 499 Z" fill="{{detail}}"/>
  <!-- Le consultant, tourné vers le flacon -->
  <use href="#man" transform="translate(1170 500) scale(-2 2)"/>
</svg>
