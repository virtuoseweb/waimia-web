<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · cloud souverain · un jardin clos sur une plaine : un mur, une seule porte, la cime d'un arbre
       qui dépasse. Dehors, des feuilles de papier emportées par le vent vers un grand disque ; une silhouette
       se tient devant la porte. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="sheet">
      <rect x="-14" y="-10" width="28" height="20" fill="{{light}}"/>
      <rect x="-9" y="-5" width="18" height="2.5" fill="{{mid}}"/>
      <rect x="-9" y="0" width="12" height="2.5" fill="{{mid}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="430"/></clipPath>
  </defs>

  <!-- Ciel et grand disque à gauche, posé sur l'horizon -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="330" cy="430" r="190" fill="{{shape}}" clip-path="url(#sky)"/>
  <!-- Deux bandes de nuage -->
  <rect x="640" y="120" width="260" height="14" rx="7" fill="{{detail}}"/>
  <rect x="700" y="146" width="170" height="14" rx="7" fill="{{detail}}"/>
  <rect x="1090" y="82" width="200" height="14" rx="7" fill="{{detail}}"/>

  <!-- Plaine -->
  <rect y="430" width="1456" height="194" fill="{{ground}}"/>
  <rect x="80" y="520" width="260" height="3" fill="{{soft}}"/>
  <rect x="420" y="580" width="220" height="3" fill="{{soft}}"/>

  <!-- Arbres qui dépassent du mur -->
  <circle cx="900" cy="345" r="62" fill="{{subject}}"/>
  <circle cx="1020" cy="368" r="46" fill="{{subject}}"/>
  <rect x="893" y="400" width="14" height="60" fill="{{subject}}"/>
  <rect x="1014" y="410" width="12" height="50" fill="{{subject}}"/>

  <!-- Mur d'enceinte avec créneaux et une porte -->
  <rect x="740" y="440" width="440" height="110" fill="{{shape}}"/>
  <g fill="{{shape}}">
    <rect x="740" y="418" width="36" height="22"/><rect x="810" y="418" width="36" height="22"/>
    <rect x="880" y="418" width="36" height="22"/><rect x="950" y="418" width="36" height="22"/>
    <rect x="1020" y="418" width="36" height="22"/><rect x="1090" y="418" width="36" height="22"/>
    <rect x="1144" y="418" width="36" height="22"/>
  </g>
  <rect x="740" y="440" width="440" height="10" fill="{{deep}}"/>
  <path d="M1010 556 L1010 490 Q1040 452 1070 490 L1070 556 Z" fill="{{shadow}}"/>
  <rect x="740" y="550" width="440" height="6" fill="{{deep}}"/>

  <!-- Feuilles emportées par le vent, dehors, vers la gauche -->
  <use href="#sheet" transform="translate(640 330) rotate(-18)"/>
  <use href="#sheet" transform="translate(560 270) rotate(24) scale(0.9)"/>
  <use href="#sheet" transform="translate(470 330) rotate(-8) scale(0.8)"/>
  <use href="#sheet" transform="translate(690 410) rotate(14) scale(0.7)"/>
  <use href="#sheet" transform="translate(610 480) rotate(-30) scale(0.75)"/>
  <use href="#sheet" transform="translate(400 250) rotate(12) scale(0.7)"/>

  <!-- Silhouette devant la porte -->
  <use href="#man" transform="translate(850 604) scale(1.25)"/>
</svg>
