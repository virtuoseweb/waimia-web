<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « écrire le besoin avant le devis » : un grand gabarit de papier planté dans un champ, découpé en forme de maison ; à côté, une charpente se monte exactement à cette forme. Aucun texte sur la feuille. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man"><circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/><path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/><rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/><rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/></g>
    <g id="man-walk"><circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/><path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/><rect x="-5" y="-46" width="9.5" height="45" fill="{{subject}}" transform="rotate(16 0 -44)"/><rect x="-4.5" y="-46" width="9.5" height="45" fill="{{subject}}" transform="rotate(-16 0 -44)"/><rect x="-21" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/><rect x="10" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- sol -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <rect y="470" width="1456" height="3" fill="{{deep}}"/>
  <g fill="{{soft}}">
    <rect x="80" y="520" width="200" height="3"/><rect x="330" y="560" width="160" height="3"/>
    <rect x="200" y="595" width="240" height="3"/><rect x="1180" y="540" width="180" height="3"/>
    <rect x="1020" y="585" width="140" height="3"/>
  </g>
  <!-- ombre portée du gabarit -->
  <path d="M650 470 L878 470 L922 500 L694 500 Z" fill="{{soft}}"/>
  <!-- béquille du gabarit -->
  <path d="M866 300 L906 470" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
  <!-- gabarit : grande feuille dressée, coin replié, maison découpée (le fond se voit au travers) -->
  <path d="M650 470 L650 130 L830 130 L870 170 L870 470 Z" fill="{{shape}}"/>
  <path d="M870 170 L878 176 L878 470 L870 470 Z" fill="{{deep}}"/>
  <path d="M830 130 L830 170 L870 170 Z" fill="{{pale}}"/>
  <path d="M830 130 L870 170 L866 172 L828 134 Z" fill="{{deep}}"/>
  <path d="M700 430 L700 300 L760 232 L795 272 L795 252 L808 252 L808 287 L820 300 L820 430 Z" fill="{{field}}"/>
  <rect x="748" y="378" width="24" height="52" fill="{{shape}}"/>
  <!-- la personne qui a écrit le besoin, bras tendu vers le gabarit -->
  <use href="#man" transform="translate(600 470) scale(1.6)"/>
  <path d="M616 346 L652 324" stroke="{{subject}}" stroke-width="8" stroke-linecap="round"/>
  <!-- charpente montée à la forme du gabarit -->
  <g stroke="{{subject}}" stroke-width="8" stroke-linecap="square" fill="none">
    <path d="M940 470 L940 295 L1021 203 L1102 295 L1102 470"/>
    <path d="M940 295 L1102 295 M1021 295 L1021 470 M940 382 L1102 382 M940 470 L1021 382"/>
    <path d="M1068 248 L1068 230 L1086 230 L1086 268"/>
  </g>
  <!-- planches au pied -->
  <rect x="1000" y="456" width="92" height="7" fill="{{detail}}"/>
  <rect x="1010" y="463" width="96" height="7" fill="{{subject}}"/>
  <!-- échelle -->
  <g stroke="{{subject}}" stroke-width="5" stroke-linecap="round">
    <path d="M1124 470 L1100 300 M1146 470 L1122 300"/>
    <path d="M1121 450 L1143 450 M1116 415 L1138 415 M1111 380 L1133 380 M1106 345 L1128 345 M1102 315 L1124 315"/>
  </g>
  <!-- charpentier qui apporte une planche sur l'épaule -->
  <use href="#man-walk" transform="translate(1214 470) scale(-1.4 1.4)"/>
  <rect x="1150" y="350" width="130" height="8" fill="{{detail}}" transform="rotate(-5 1215 354)"/>
  <path d="M1204 374 L1198 358" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
</svg>
