<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Extension Claude pour Chrome » : une moto conduite par une personne, avec un side-car où un passager déplie une carte pour guider le trajet.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="sit"><circle cx="1" cy="-62" r="7.5"/><path d="M-11 -52 Q0 -56 11 -52 L12 -16 L-12 -16 Z"/><rect x="-12" y="-20" width="34" height="10"/><rect x="14" y="-20" width="9" height="20"/><rect x="14" y="-3" width="14" height="3" rx="1.5"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="880" cy="506" rx="390" ry="22" fill="{{ground}}"/>
  <ellipse cx="860" cy="500" rx="250" ry="7" fill="{{shape}}"/>
  <!-- moto, derrière le side-car -->
  <circle cx="1070" cy="462" r="38" fill="{{shadow}}"/><circle cx="1070" cy="462" r="11" fill="{{light}}"/>
  <circle cx="700" cy="462" r="38" fill="{{shadow}}"/>
  <path d="M700 420 L780 380 L1010 380 L1040 414 L980 430 L720 430 Z" fill="{{shadow}}"/>
  <rect x="934" y="354" width="70" height="32" rx="12" fill="{{deep}}"/>
  <rect x="852" y="370" width="86" height="14" rx="5" fill="{{shadow}}"/>
  <path d="M990 316 L1070 462" stroke="{{shadow}}" stroke-width="10" stroke-linecap="round"/>
  <path d="M976 316 L1004 312" stroke="{{shadow}}" stroke-width="8" stroke-linecap="round"/>
  <!-- pilote -->
  <use href="#sit" fill="{{shadow}}" transform="translate(900 378) scale(2)"/>
  <path d="M916 278 L946 300 L982 316" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- passager du side-car, carte dépliée -->
  <use href="#man" fill="{{shadow}}" transform="translate(712 470) scale(1.9)"/>
  <path d="M727 323 L744 334 L756 326" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(-8 790 318)">
    <rect x="740" y="282" width="118" height="72" fill="{{soft}}"/>
    <rect x="778" y="282" width="5" height="72" fill="{{light}}"/><rect x="817" y="282" width="5" height="72" fill="{{light}}"/>
    <path d="M750 340 Q790 296 846 306" fill="none" stroke="{{shadow}}" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- side-car (bleu) et sa roue -->
  <circle cx="866" cy="466" r="30" fill="{{shadow}}"/><circle cx="866" cy="466" r="9" fill="{{light}}"/>
  <path d="M630 452 L630 402 Q630 370 670 370 L820 370 Q904 374 936 424 Q944 452 906 452 Z" fill="{{subject}}"/>
  <rect x="640" y="388" width="250" height="6" fill="{{light}}"/>

</svg>
