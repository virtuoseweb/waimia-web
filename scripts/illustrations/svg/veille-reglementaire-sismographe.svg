<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Veille réglementaire automatisée » : un enregistreur à tambour trace en continu ;
       une femme désigne le seul pic qui mérite une décision.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="880" cy="506" rx="360" ry="22" fill="{{ground}}"/>
  <ellipse cx="880" cy="502" rx="130" ry="7" fill="{{soft}}"/>
  <!-- Meuble -->
  <rect x="760" y="360" width="240" height="140" fill="{{pale}}"/>
  <rect x="780" y="384" width="200" height="90" fill="{{shape}}"/>
  <rect x="752" y="352" width="256" height="11" fill="{{deep}}"/>
  <!-- Bras du stylet -->
  <rect x="766" y="226" width="10" height="128" fill="{{deep}}"/>
  <!-- Tambour, supports, manivelle -->
  <rect x="786" y="296" width="8" height="58" fill="{{deep}}"/>
  <rect x="968" y="296" width="8" height="58" fill="{{deep}}"/>
  <rect x="794" y="252" width="174" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <ellipse cx="794" cy="298" rx="14" ry="46" fill="{{deep}}"/>
  <ellipse cx="968" cy="298" rx="14" ry="46" fill="{{deep}}"/>
  <path d="M982 298 L1000 298 L1000 318" fill="none" stroke="{{deep}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M808 304 L814 292 L820 304 L826 292 L832 304 L838 292 L844 304 L850 292 L856 304 L862 292 L868 304 L874 292 L880 320 L886 270 L892 332 L898 258 L904 332 L910 270 L916 320 L922 292 L928 304 L934 292 L940 304 L946 292 L952 304" fill="none" stroke="{{shadow}}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M771 232 L950 296" fill="none" stroke="{{detail}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Celle qui lit le tracé -->
  <use href="#woman" transform="translate(1100 500) scale(-2.1 2.1)"/>
  <path d="M1088 336 L1050 312 L1016 290" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
