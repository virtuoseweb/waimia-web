<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · fallback Claude · tritone · « brancher Claude à vos outils (MCP) » :
       un standard téléphonique géant sous un grand ciel bleu ; un opérateur relie par des
       câbles trois machines posées au loin. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-2.5 -81 L0 -75 L2.5 -81 Z" fill="{{light}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="socket">
      <circle r="11" fill="{{deep}}"/>
      <circle r="5" fill="{{shadow}}"/>
    </g>
    <g id="machine">
      <rect x="-34" y="-46" width="68" height="46" fill="{{light}}"/>
      <rect x="-34" y="-46" width="68" height="46" fill="none" stroke="{{shadow}}" stroke-width="2"/>
      <rect x="-24" y="-38" width="30" height="20" fill="{{soft}}"/>
      <circle cx="18" cy="-30" r="5" fill="{{shadow}}"/>
      <circle cx="18" cy="-14" r="3" fill="{{mid}}"/>
      <rect x="-24" y="-10" width="22" height="3" fill="{{mid}}"/>
    </g>
  </defs>

  <!-- Grand ciel bleu (référence computer-health) -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Nuage granuleux crème à droite -->
  <path d="M1080 180 q20 -40 70 -32 q22 -38 74 -20 q40 -22 74 14 q48 -4 58 40 q30 10 20 40 L1060 222 q-8 -30 20 -42 Z" fill="{{light}}"/>

  <!-- Sol : fine bande de campagne, horizon bas -->
  <rect y="532" width="1456" height="92" fill="{{ground}}"/>
  <rect y="526" width="1456" height="8" fill="{{deep}}"/>
  <g fill="{{deep}}">
    <ellipse cx="80" cy="526" rx="40" ry="10"/><ellipse cx="300" cy="526" rx="60" ry="9"/>
    <ellipse cx="1340" cy="526" rx="70" ry="10"/>
  </g>

  <!-- Le standard géant : panneau terracotta, grille de prises -->
  <rect x="210" y="90" width="430" height="436" fill="{{shape}}"/>
  <rect x="640" y="90" width="22" height="436" fill="{{deep}}"/>
  <rect x="200" y="78" width="472" height="18" fill="{{shadow}}"/>
  <rect x="200" y="470" width="472" height="56" fill="{{shadow}}"/>
  <g>
    <use href="#socket" x="262" y="140"/><use href="#socket" x="322" y="140"/><use href="#socket" x="382" y="140"/><use href="#socket" x="442" y="140"/><use href="#socket" x="502" y="140"/><use href="#socket" x="562" y="140"/>
    <use href="#socket" x="262" y="200"/><use href="#socket" x="322" y="200"/><use href="#socket" x="382" y="200"/><use href="#socket" x="442" y="200"/><use href="#socket" x="502" y="200"/><use href="#socket" x="562" y="200"/>
    <use href="#socket" x="262" y="260"/><use href="#socket" x="322" y="260"/><use href="#socket" x="382" y="260"/><use href="#socket" x="442" y="260"/><use href="#socket" x="502" y="260"/><use href="#socket" x="562" y="260"/>
    <use href="#socket" x="262" y="320"/><use href="#socket" x="322" y="320"/><use href="#socket" x="382" y="320"/><use href="#socket" x="442" y="320"/><use href="#socket" x="502" y="320"/><use href="#socket" x="562" y="320"/>
    <use href="#socket" x="262" y="380"/><use href="#socket" x="322" y="380"/><use href="#socket" x="382" y="380"/><use href="#socket" x="442" y="380"/><use href="#socket" x="502" y="380"/><use href="#socket" x="562" y="380"/>
  </g>

  <!-- Trois machines posées au loin, à droite -->
  <use href="#machine" transform="translate(905 526)"/>
  <use href="#machine" transform="translate(1085 526) scale(0.85)"/>
  <use href="#machine" transform="translate(1250 526) scale(0.72)"/>

  <!-- Câbles : des prises jusqu'aux machines, longues courbes tendues -->
  <g fill="none" stroke="{{detail}}" stroke-width="6" stroke-linecap="round">
    <path d="M442 200 C 600 40, 820 120, 900 482"/>
    <path d="M322 320 C 520 120, 980 140, 1085 488"/>
    <path d="M502 380 C 700 250, 1150 220, 1250 494"/>
  </g>
  <g fill="{{light}}">
    <circle cx="442" cy="200" r="6"/><circle cx="322" cy="320" r="6"/><circle cx="502" cy="380" r="6"/>
  </g>

  <!-- L'opératrice, debout au pied du standard, branche un quatrième câble -->
  <use href="#woman" transform="translate(735 526) scale(1.15)"/>
  <path d="M742 434 L 712 395" stroke="{{subject}}" stroke-width="6" stroke-linecap="round"/>
  <path d="M712 395 C 690 360, 650 330, 622 320" fill="none" stroke="{{detail}}" stroke-width="5" stroke-linecap="round"/>
  <circle cx="622" cy="320" r="5" fill="{{detail}}"/>
  <path d="M740 470 C 760 520, 820 540, 860 520" fill="none" stroke="{{detail}}" stroke-width="5" stroke-linecap="round"/>
</svg>
