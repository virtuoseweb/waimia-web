<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Risques de Claude en PME » : un apiculteur voilé, enfumoir à la main,
       approche une grande ruche en paille d'où sortent quelques abeilles. L'outil donne
       son miel, il peut piquer ; l'équipement et le geste réglé évitent la piqûre.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les
       bords, sujet entre x 300 et 1250.
       Rôles remplacés par render-svg.mjs (shape = la ruche, subject = apiculteur et abeilles). -->
  <defs>
    <clipPath id="ruche">
      <path d="M980 400 C980 252 1036 168 1118 168 C1200 168 1256 252 1256 400 Z"/>
    </clipPath>
    <g id="abeille">
      <ellipse cx="-2" cy="-7" rx="6" ry="3.8" fill="{{soft}}"/>
      <ellipse cx="5" cy="-7" rx="5" ry="3.2" fill="{{soft}}"/>
      <ellipse cx="0" cy="0" rx="10" ry="6" fill="{{subject}}"/>
      <rect x="-2" y="-6" width="3" height="12" fill="{{mid}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Toute la scène décalée vers la gauche : elle tient dans le recadrage 16:9 centré des
       cartes (x 174 à 1282) et évite le chapô du hero (x < 150). -->
  <g transform="translate(-130 0)">

  <!-- Sol local : une plage pâle sous la scène, sans toucher les bords -->
  <ellipse cx="1040" cy="506" rx="370" ry="22" fill="{{ground}}"/>
  <ellipse cx="1118" cy="502" rx="190" ry="8" fill="{{shape}}"/>
  <ellipse cx="836" cy="502" rx="46" ry="6" fill="{{shape}}"/>

  <!-- Support en bois -->
  <g fill="{{deep}}">
    <rect x="958" y="400" width="320" height="14"/>
    <rect x="986" y="414" width="12" height="88"/>
    <rect x="1238" y="414" width="12" height="88"/>
    <rect x="986" y="452" width="264" height="7"/>
  </g>

  <!-- Ruche en paille : dôme, spires de paille, trou de vol -->
  <path d="M980 400 C980 252 1036 168 1118 168 C1200 168 1256 252 1256 400 Z" fill="{{shape}}"/>
  <g clip-path="url(#ruche)" fill="none" stroke="{{mid}}" stroke-width="6">
    <path d="M960 206 L1280 206"/>
    <path d="M960 240 L1280 240"/>
    <path d="M960 274 L1280 274"/>
    <path d="M960 308 L1280 308"/>
    <path d="M960 342 L1280 342"/>
    <path d="M960 376 L1280 376"/>
  </g>
  <rect x="1110" y="152" width="16" height="18" rx="5" fill="{{mid}}"/>
  <path d="M1096 400 Q1096 380 1118 380 Q1140 380 1140 400 Z" fill="{{subject}}"/>

  <!-- Abeilles, calmes, autour de la ruche -->
  <use href="#abeille" transform="translate(1290 214)"/>
  <use href="#abeille" transform="translate(1322 262) scale(1.1)"/>
  <use href="#abeille" transform="translate(1268 160) scale(0.9)"/>
  <use href="#abeille" transform="translate(1196 126)"/>
  <use href="#abeille" transform="translate(1340 318) scale(0.85)"/>
  <use href="#abeille" transform="translate(1046 140) scale(0.9)"/>
  <use href="#abeille" transform="translate(1160 372) scale(0.8)"/>
  <use href="#abeille" transform="translate(1302 370) scale(0.9)"/>
  <use href="#abeille" transform="translate(1366 214) scale(0.75)"/>

  <!-- Fumée de l'enfumoir, qui file vers la ruche -->
  <g fill="{{soft}}">
    <circle cx="930" cy="318" r="10"/>
    <circle cx="948" cy="300" r="14"/>
    <circle cx="972" cy="292" r="11"/>
    <circle cx="958" cy="278" r="9"/>
    <circle cx="988" cy="282" r="8"/>
  </g>

  <!-- L'apiculteur, de profil vers la ruche : chapeau à large bord, voile, enfumoir -->
  <g transform="translate(836 500) scale(2)">
    <g fill="{{subject}}">
      <rect x="-10" y="-44" width="8.5" height="42"/>
      <rect x="1.5" y="-44" width="8.5" height="42"/>
      <rect x="-11" y="-3" width="11" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="13" height="3" rx="1.5"/>
      <path d="M-13 -80 Q0 -85 13 -80 L15 -42 L-15 -42 Z"/>
      <circle cx="1" cy="-90" r="7.5"/>
    </g>
    <!-- Voile de tulle évasé, du bord du chapeau aux épaules ; le visage se devine dessous -->
    <path d="M-11 -95 L13 -95 Q19 -86 20 -77 L-18 -77 Q-17 -86 -11 -95 Z" fill="{{mid}}"/>
    <path d="M-4 -93 Q5 -95 8 -89 Q9 -84 5 -82 L-3 -82 Q-7 -87 -4 -93 Z" fill="{{deep}}"/>
    <!-- Chapeau -->
    <ellipse cx="1" cy="-96" rx="22" ry="3.6" fill="{{subject}}"/>
    <rect x="-7" y="-106" width="16" height="11" rx="3" fill="{{subject}}"/>
    <!-- Bras tendu, gant clair -->
    <path d="M8 -77 L16 -63 L28 -63" fill="none" stroke="{{subject}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="29" cy="-63" r="3.6" fill="{{light}}"/>
    <!-- Enfumoir : soufflet en losange tenu par la main, pot, couvercle conique et bec -->
    <path d="M22 -60 L30 -70 L36 -62 L28 -54 Z" fill="{{deep}}"/>
    <rect x="36" y="-78" width="12" height="22" rx="2" fill="{{deep}}"/>
    <path d="M36 -78 L48 -78 L45 -85 L39 -85 Z" fill="{{deep}}"/>
    <path d="M42 -85 L46 -91 L49 -89 L45 -84 Z" fill="{{deep}}"/>
    <rect x="34" y="-76" width="10" height="18" rx="2" fill="{{deep}}"/>
    <path d="M34 -76 L44 -76 L41 -84 L37 -84 Z" fill="{{deep}}"/>
  </g>
  </g>
</svg>
