<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Hermes Agent v0.22 : ce qui change » : un bernard-l'ermite géant quitte sa
       vieille coquille, couchée derrière lui, pour une coquille neuve plus grande. Un homme
       regarde le déménagement : même bête, nouvel abri.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 540 et 1210. Rôles : subject = la coquille neuve ; silhouette et crabe en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Plage locale -->
  <ellipse cx="880" cy="506" rx="400" ry="24" fill="{{ground}}"/>
  <ellipse cx="1100" cy="502" rx="130" ry="8" fill="{{shape}}"/>
  <ellipse cx="700" cy="502" rx="80" ry="6" fill="{{shape}}"/>
  <ellipse cx="560" cy="502" rx="32" ry="5" fill="{{shape}}"/>

  <!-- La vieille coquille, petite, renversée -->
  <g transform="translate(716 466) scale(-0.55 0.55)">
    <ellipse cx="0" cy="0" rx="100" ry="62" fill="{{soft}}"/>
    <ellipse cx="62" cy="-54" rx="62" ry="40" transform="rotate(-28 62 -54)" fill="{{soft}}"/>
    <ellipse cx="104" cy="-96" rx="36" ry="24" transform="rotate(-36 104 -96)" fill="{{soft}}"/>
    <path d="M112 -112 L150 -150 L132 -100 Z" fill="{{soft}}"/>
    <path d="M-10 -54 Q50 -36 96 -66" fill="none" stroke="{{pale}}" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 -96 Q100 -82 124 -110" fill="none" stroke="{{pale}}" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-80" cy="8" rx="24" ry="42" fill="{{deep}}"/>
  </g>

  <!-- La coquille neuve, plus grande, en bleu -->
  <g transform="translate(1080 440)">
    <ellipse cx="0" cy="0" rx="100" ry="62" fill="{{subject}}"/>
    <ellipse cx="62" cy="-54" rx="62" ry="40" transform="rotate(-28 62 -54)" fill="{{subject}}"/>
    <ellipse cx="104" cy="-96" rx="36" ry="24" transform="rotate(-36 104 -96)" fill="{{subject}}"/>
    <path d="M112 -112 L150 -150 L132 -100 Z" fill="{{subject}}"/>
    <path d="M-10 -54 Q50 -36 96 -66" fill="none" stroke="{{light}}" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 -96 Q100 -82 124 -110" fill="none" stroke="{{light}}" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-80" cy="8" rx="24" ry="42" fill="{{deep}}"/>
  </g>

  <!-- Le bernard-l'ermite, abdomen nu, pinces tendues vers la coquille neuve -->
  <path d="M836 440 Q784 424 786 470 Q790 500 832 486" fill="{{soft}}"/>
  <g transform="translate(880 450) scale(1.25) translate(-880 -450)">
  <g fill="{{shadow}}">
    <ellipse cx="880" cy="446" rx="48" ry="28"/>
    <ellipse cx="948" cy="424" rx="28" ry="16" transform="rotate(-18 948 424)"/>
    <path d="M966 412 L996 398 L978 422 Z"/>
    <path d="M970 428 L998 432 L974 438 Z"/>
    <ellipse cx="934" cy="460" rx="18" ry="10" transform="rotate(10 934 460)"/>
    <rect x="884" y="398" width="5" height="24" transform="rotate(14 886 422)"/>
    <rect x="902" y="402" width="5" height="22" transform="rotate(26 906 424)"/>
    <circle cx="892" cy="398" r="5.5"/>
    <circle cx="914" cy="402" r="5.5"/>
  </g>
  <g fill="none" stroke="{{shadow}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M848 462 L828 476 L820 492"/>
    <path d="M864 468 L852 484 L848 494"/>
    <path d="M884 470 L890 484 L888 494"/>
    <path d="M902 466 L916 478 L922 492"/>
  </g>
  </g>

  <!-- L'homme regarde, mains dans les poches -->
  <g transform="translate(560 500) scale(1.9)">
    <g fill="{{shadow}}">
      <rect x="-9" y="-44" width="8" height="42"/>
      <rect x="1" y="-44" width="8" height="42"/>
      <rect x="-10" y="-3" width="10" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="12" height="3" rx="1.5"/>
      <path d="M-12 -82 Q0 -86 12 -82 L14 -42 L-14 -42 Z"/>
      <circle cx="1" cy="-92" r="7.5"/>
      <path d="M-6 -97 Q2 -103 9 -96 L8 -93 L-6 -94 Z"/>
    </g>
  </g>
</svg>
