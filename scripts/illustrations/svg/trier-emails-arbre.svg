<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Trier ses e-mails entrants avec Claude et n8n » : des enveloppes arrivent
       en volant comme des oiseaux et se posent sur un arbre nu, chacune sur la branche de
       sa catégorie. Un homme, en bas, en a pris une et la relit avant d'y répondre.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 560 et 1140. Rôles : subject = l'arbre et les traits des enveloppes ; silhouette en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="860" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="900" cy="502" rx="90" ry="8" fill="{{shape}}"/>
  <ellipse cx="610" cy="502" rx="36" ry="6" fill="{{shape}}"/>
  <!-- L'arbre nu, trois branches -->
  <path d="M886 502 L892 300 L910 300 L918 502 Z" fill="{{subject}}"/>
  <g fill="none" stroke="{{subject}}" stroke-linecap="round">
    <path d="M900 380 Q820 330 716 290" stroke-width="12"/>
    <path d="M902 336 Q1000 270 1112 250" stroke-width="12"/>
    <path d="M902 306 Q930 240 972 176" stroke-width="10"/>
    <path d="M800 332 L782 366" stroke-width="6"/>
    <path d="M1030 284 L1052 316" stroke-width="6"/>
  </g>
  <g transform="translate(830 324) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{light}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(786 304) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{light}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(742 284) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{light}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(971 286) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{soft}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(1018 268) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{soft}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(1064 251) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{soft}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(1106 235) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{soft}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(944 209) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{pale}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g><g transform="translate(968 165) rotate(0) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{pale}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g>
  <!-- Deux enveloppes encore en vol -->
  <g transform="translate(560 214) rotate(-12)"><path d="M-6 -12 L-26 -34 L6 -14 Z" fill="{{soft}}"/><path d="M4 -12 L22 -38 L14 -12 Z" fill="{{soft}}"/></g><g transform="translate(560 214) rotate(-12) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{light}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g>
  <g transform="translate(690 150) rotate(-6)"><path d="M-6 -12 L-26 -34 L6 -14 Z" fill="{{soft}}"/><path d="M4 -12 L22 -38 L14 -12 Z" fill="{{soft}}"/></g><g transform="translate(690 150) rotate(-6) scale(1)"><rect x="-20" y="-14" width="40" height="28" fill="{{light}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g>
  <!-- L'homme relit une enveloppe qu'il a prise -->
  <g transform="translate(610 500) scale(2.1)">
    <g fill="{{shadow}}">
      <rect x="-9" y="-44" width="8" height="42"/>
      <rect x="1" y="-44" width="8" height="42"/>
      <rect x="-10" y="-3" width="10" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="12" height="3" rx="1.5"/>
      <path d="M-12 -82 Q0 -86 12 -82 L14 -42 L-14 -42 Z"/>
      <circle cx="1" cy="-92" r="7.5"/>
      <path d="M-6 -97 Q2 -103 9 -96 L8 -93 L-6 -94 Z"/>
    </g>
    <path d="M9 -78 L15 -66 L21 -68" fill="none" stroke="{{shadow}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(668 356) rotate(-8) scale(0.9)"><rect x="-20" y="-14" width="40" height="28" fill="{{light}}" stroke="{{subject}}" stroke-width="3"/><path d="M-20 -14 L0 3 L20 -14" fill="none" stroke="{{subject}}" stroke-width="3" stroke-linejoin="round"/></g>
</svg>
