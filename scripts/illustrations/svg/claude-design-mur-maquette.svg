<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · Claude Design : un mur immense où des formes s'assemblent en mise en page ; une silhouette de dos. -->
  <defs><g id="woman"><circle cx="0" cy="-90" r="7" fill="{{subject}}"/><circle cx="-5" cy="-96" r="5" fill="{{subject}}"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/><rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/><rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <rect y="514" width="1456" height="8" fill="{{deep}}"/>
  <!-- Le mur -->
  <rect x="470" y="56" width="700" height="464" fill="{{light}}"/>
  <rect x="1170" y="56" width="20" height="464" fill="{{deep}}"/>
  <!-- Mise en page : bandeau, grand bloc central, colonnes -->
  <rect x="520" y="96" width="600" height="22" fill="{{deep}}"/>
  <rect x="520" y="148" width="420" height="230" fill="{{shape}}"/>
  <circle cx="1045" cy="210" r="62" fill="{{mid}}"/>
  <rect x="975" y="300" width="145" height="78" fill="{{soft}}"/>
  <rect x="520" y="404" width="180" height="76" fill="{{soft}}"/>
  <rect x="730" y="404" width="180" height="76" fill="{{mid}}"/>
  <!-- Le dernier bloc arrive encore, en l'air, légèrement de travers -->
  <rect x="955" y="420" width="170" height="70" fill="{{deep}}" transform="rotate(-9 1040 455)"/>
  <rect x="1236" y="150" width="90" height="56" fill="{{soft}}" transform="rotate(14 1281 178)"/>
  <circle cx="1300" cy="300" r="26" fill="{{deep}}"/>
  <!-- La silhouette, de dos, face au mur -->
  <use href="#woman" transform="translate(330 520) scale(1.5)"/>
  <ellipse cx="330" cy="522" rx="34" ry="5" fill="{{deep}}"/>
</svg>
