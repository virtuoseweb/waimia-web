<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Deviner l'e-mail pro d'un prospect » : trois gobelets retournés sur une table ; une personne hésite au-dessus du premier, alors que la bille est sous le dernier, que l'autre joueur soulève.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution creme-aere ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="woman"><circle cx="1" cy="-90" r="7"/><circle cx="-5" cy="-95" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="910" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <rect x="700" y="390" width="420" height="16" fill="{{shape}}"/>
  <rect x="716" y="406" width="10" height="94" fill="{{detail}}"/><rect x="1094" y="406" width="10" height="94" fill="{{detail}}"/>
  <rect x="716" y="452" width="388" height="7" fill="{{detail}}"/>
  <g fill="{{subject}}">
    <path d="M752 390 L764 318 L816 318 L828 390 Z"/><ellipse cx="790" cy="318" rx="26" ry="6"/>
    <path d="M852 390 L864 318 L916 318 L928 390 Z"/><ellipse cx="890" cy="318" rx="26" ry="6"/>
  </g>
  <g fill="{{light}}"><rect x="754" y="374" width="72" height="6"/><rect x="854" y="374" width="72" height="6"/></g>
  <!-- bille sous le gobelet soulevé -->
  <circle cx="990" cy="376" r="13" fill="{{subject}}"/>
  <g transform="rotate(14 1028 356)">
    <path d="M952 356 L964 284 L1016 284 L1028 356 Z" fill="{{subject}}"/><ellipse cx="990" cy="284" rx="26" ry="6" fill="{{subject}}"/>
    <rect x="954" y="340" width="72" height="6" fill="{{light}}"/>
  </g>
  <!-- la personne qui hésite -->
  <use href="#woman" fill="{{shadow}}" transform="translate(712 500) scale(2.05)"/>
  <path d="M724 342 L748 326 L772 302" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- le joueur d'en face soulève le dernier -->
  <use href="#man" fill="{{shadow}}" transform="translate(1166 500) scale(-2 2)"/>
  <path d="M1150 346 L1128 364 L1104 352" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
