<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Registre de maîtrise de l'IA » : une toise murale (shape = bleu) porte plusieurs
       traits ; un collègue trace le niveau de sa collègue adossée, et le registre ouvert attend
       sur un pupitre.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="860" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="920" cy="502" rx="120" ry="7" fill="{{soft}}"/>
  <!-- Pupitre et registre ouvert -->
  <rect x="560" y="410" width="160" height="10" fill="{{deep}}"/>
  <rect x="572" y="420" width="9" height="80" fill="{{deep}}"/>
  <rect x="699" y="420" width="9" height="80" fill="{{deep}}"/>
  <path d="M572 408 L640 402 L640 382 L576 386 Z" fill="{{light}}" stroke="{{mid}}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M640 402 L708 408 L704 386 L640 382 Z" fill="{{light}}" stroke="{{mid}}" stroke-width="3" stroke-linejoin="round"/>
  <g fill="{{mid}}"><rect x="588" y="392" width="40" height="3"/><rect x="652" y="392" width="40" height="3"/></g>
  <!-- La toise -->
  <rect x="840" y="112" width="120" height="390" fill="{{shape}}"/>
  <rect x="840" y="132" width="30" height="4" fill="{{detail}}"/><rect x="840" y="152" width="14" height="4" fill="{{detail}}"/><rect x="840" y="172" width="14" height="4" fill="{{detail}}"/><rect x="840" y="192" width="14" height="4" fill="{{detail}}"/><rect x="840" y="212" width="14" height="4" fill="{{detail}}"/><rect x="840" y="232" width="30" height="4" fill="{{detail}}"/><rect x="840" y="252" width="14" height="4" fill="{{detail}}"/><rect x="840" y="272" width="14" height="4" fill="{{detail}}"/><rect x="840" y="292" width="14" height="4" fill="{{detail}}"/><rect x="840" y="312" width="14" height="4" fill="{{detail}}"/><rect x="840" y="332" width="30" height="4" fill="{{detail}}"/><rect x="840" y="352" width="14" height="4" fill="{{detail}}"/><rect x="840" y="372" width="14" height="4" fill="{{detail}}"/><rect x="840" y="392" width="14" height="4" fill="{{detail}}"/><rect x="840" y="412" width="14" height="4" fill="{{detail}}"/><rect x="840" y="432" width="30" height="4" fill="{{detail}}"/><rect x="840" y="452" width="14" height="4" fill="{{detail}}"/><rect x="840" y="472" width="14" height="4" fill="{{detail}}"/><rect x="900" y="296" width="60" height="6" fill="{{detail}}"/>
  <!-- Elle, adossée ; lui, crayon levé -->
  <use href="#woman" transform="translate(900 500) scale(2.1 2.1)"/>
  <use href="#man" transform="translate(1010 500) scale(-2 2)"/>
  <path d="M994 344 L956 318 L926 300" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M926 300 L914 292" fill="none" stroke="{{deep}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
