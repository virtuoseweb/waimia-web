<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · lot IMG1 · à gauche un bâtiment compact d un seul bloc, à droite une haute pile de caisses dépareillées tenue par des étais -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
    <g id="reacher">
      <use href="#woman"/>
      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pusher">
      <circle cx="10" cy="-86" r="7.5" fill="{{subject}}"/>
      <path d="M-6 -78 Q4 -82 14 -76 L4 -42 L-18 -44 Z" fill="{{subject}}"/>
      <rect x="2" y="-74" width="34" height="6" rx="3" fill="{{subject}}" transform="rotate(8 2 -74)"/>
      <path d="M-18 -44 L-4 -44 L-14 -2 L-26 -2 Z" fill="{{subject}}"/>
      <path d="M-6 -44 L6 -44 L14 -2 L2 -2 Z" fill="{{subject}}"/>
      <rect x="-30" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="2" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="320" cy="120" rx="80" ry="24" fill="{{detail}}"/><ellipse cx="1200" cy="80" rx="60" ry="20" fill="{{detail}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect x="360" y="270" width="280" height="230" fill="{{shape}}"/>
  <g fill="{{detail}}"><rect x="400" y="300" width="40" height="34"/><rect x="470" y="300" width="40" height="34"/><rect x="540" y="300" width="40" height="34"/><rect x="400" y="360" width="40" height="34"/><rect x="470" y="360" width="40" height="34"/><rect x="540" y="360" width="40" height="34"/><rect x="400" y="420" width="40" height="34"/><rect x="470" y="420" width="40" height="34"/><rect x="540" y="420" width="40" height="34"/></g>
  <g fill="{{subject}}">
    <rect x="880" y="420" width="200" height="80"/>
    <rect x="900" y="340" width="150" height="80" transform="rotate(3 975 380)"/>
    <rect x="870" y="270" width="180" height="70" transform="rotate(-4 960 305)"/>
    <rect x="910" y="200" width="120" height="70" transform="rotate(5 970 235)"/>
    <rect x="880" y="140" width="140" height="60" transform="rotate(-6 950 170)"/>
  </g>
  <g fill="{{detail}}"><rect x="920" y="440" width="40" height="30"/><rect x="940" y="360" width="30" height="24"/><rect x="900" y="290" width="40" height="20"/></g>
  <g stroke="{{subject}}" stroke-width="8"><line x1="800" y1="500" x2="900" y2="230"/><line x1="1170" y1="500" x2="1030" y2="180"/><line x1="1200" y1="500" x2="1050" y2="300"/></g>
  <use href="#man" transform="translate(740 500) scale(1.2)"/>
  <use href="#reacher" transform="translate(1220 500) scale(1.2)"/>

</svg>
