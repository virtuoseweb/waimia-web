<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « un accompagnement sait où il s'arrête » : devant un grand soleil bas, une personne dénoue le lien qui attache un jeune arbre à son tuteur ; un tuteur déjà retiré gît au sol, au loin des arbres tiennent seuls. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man"><circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/><path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/><rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/><rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/></g>
    <clipPath id="sky"><rect width="1456" height="450"/></clipPath>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="860" cy="450" r="210" fill="{{shape}}" clip-path="url(#sky)"/>
  <rect y="450" width="1456" height="174" fill="{{ground}}"/>
  <!-- arbres adultes au loin, sans tuteur -->
  <g fill="{{subject}}">
    <rect x="1118" y="414" width="5" height="36"/><circle cx="1120" cy="404" r="22"/>
    <rect x="1208" y="402" width="6" height="48"/><circle cx="1211" cy="388" r="30"/>
    <rect x="1300" y="420" width="4" height="30"/><circle cx="1302" cy="411" r="17"/>
    <rect x="300" y="424" width="4" height="26"/><circle cx="302" cy="416" r="15"/>
  </g>
  <!-- jeune arbre -->
  <g fill="{{subject}}">
    <rect x="853" y="260" width="11" height="190"/>
    <circle cx="858" cy="225" r="58"/><circle cx="822" cy="250" r="36"/><circle cx="898" cy="248" r="38"/>
    <circle cx="860" cy="266" r="26"/>
  </g>
  <!-- tuteur collé au tronc, deux liens -->
  <path d="M864 450 L864 158 L868.5 146 L873 158 L873 450 Z" fill="{{deep}}"/>
  <rect x="849" y="338" width="28" height="7" fill="{{detail}}"/>
  <rect x="849" y="398" width="28" height="7" fill="{{detail}}"/>
  <!-- la personne qui dénoue le lien du bas -->
  <use href="#man" transform="translate(770 450) scale(1.55)"/>
  <path d="M787 330 L846 400" stroke="{{subject}}" stroke-width="8" stroke-linecap="round"/>
  <!-- tuteur déjà retiré, couché au sol, et son lien -->
  <path d="M930 488 L1060 488 L1070 492 L1060 496 L930 496 Z" fill="{{detail}}"/>
  <rect x="1082" y="500" width="22" height="5" fill="{{detail}}"/>
  <g fill="{{subject}}">
    <rect x="90" y="520" width="190" height="3"/><rect x="420" y="560" width="220" height="3"/>
    <rect x="1150" y="560" width="200" height="3"/><rect x="700" y="596" width="160" height="3"/>
  </g>
</svg>
