<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « stocks et SAV » : un château d'eau gradué dont on lit le niveau ; au pied,
       une personne note. Des cartons sont rangés sur le quai. Distribution prévue : sol-bleu
       (la nappe d'eau au premier plan). Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="crate">
      <rect x="-20" y="-26" width="40" height="26" fill="{{light}}"/>
      <rect x="-20" y="-26" width="40" height="26" fill="none" stroke="{{subject}}" stroke-width="2.5"/>
      <rect x="-20" y="-15" width="40" height="3" fill="{{subject}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Soleil -->
  <circle cx="300" cy="190" r="70" fill="{{detail}}"/>
  <!-- Nuages -->
  <g fill="{{detail}}" opacity="0.8">
    <ellipse cx="860" cy="130" rx="110" ry="12"/><ellipse cx="1290" cy="190" rx="90" ry="11"/>
  </g>
  <!-- Nappe d'eau -->
  <rect y="450" width="1456" height="174" fill="{{ground}}"/>
  <g fill="{{light}}" opacity="0.8">
    <rect x="80" y="510" width="200" height="4"/><rect x="380" y="560" width="260" height="4"/>
    <rect x="1080" y="520" width="240" height="4"/><rect x="760" y="585" width="200" height="4"/>
  </g>
  <!-- Îlot -->
  <path d="M470 450 L1040 450 L1010 486 L500 486 Z" fill="{{pale}}"/>
  <rect x="470" y="446" width="570" height="8" fill="{{soft}}"/>

  <!-- Pieds du château d'eau, croisillons -->
  <g stroke="{{subject}}" stroke-width="8" stroke-linecap="round">
    <line x1="660" y1="300" x2="640" y2="446"/><line x1="796" y1="300" x2="816" y2="446"/>
    <line x1="728" y1="300" x2="728" y2="446"/>
  </g>
  <g stroke="{{subject}}" stroke-width="4">
    <line x1="656" y1="340" x2="800" y2="400"/><line x1="800" y1="340" x2="652" y2="400"/>
  </g>
  <!-- Cuve : corps, couvercle conique -->
  <rect x="610" y="120" width="236" height="190" rx="6" fill="{{shape}}"/>
  <path d="M600 124 L728 62 L856 124 Z" fill="{{subject}}"/>
  <rect x="600" y="300" width="256" height="12" fill="{{subject}}"/>
  <!-- Jauge verticale : rail, niveau, graduations -->
  <rect x="706" y="136" width="44" height="160" fill="{{light}}"/>
  <rect x="706" y="136" width="44" height="160" fill="none" stroke="{{subject}}" stroke-width="3"/>
  <rect x="709" y="214" width="38" height="79" fill="{{subject}}"/>
  <g fill="{{subject}}">
    <rect x="690" y="150" width="16" height="4"/><rect x="690" y="176" width="16" height="4"/><rect x="690" y="202" width="16" height="4"/>
    <rect x="690" y="228" width="16" height="4"/><rect x="690" y="254" width="16" height="4"/><rect x="690" y="280" width="16" height="4"/>
    <rect x="750" y="150" width="16" height="4"/><rect x="750" y="176" width="16" height="4"/><rect x="750" y="202" width="16" height="4"/>
    <rect x="750" y="228" width="16" height="4"/><rect x="750" y="254" width="16" height="4"/><rect x="750" y="280" width="16" height="4"/>
  </g>
  <!-- Échelle sur le côté de la cuve -->
  <g stroke="{{subject}}" stroke-width="3">
    <line x1="826" y1="130" x2="834" y2="446"/><line x1="846" y1="130" x2="854" y2="446"/>
    <line x1="827" y1="170" x2="847" y2="170"/><line x1="828" y1="220" x2="848" y2="220"/><line x1="829" y1="270" x2="849" y2="270"/>
    <line x1="830" y1="330" x2="850" y2="330"/><line x1="832" y1="390" x2="852" y2="390"/>
  </g>

  <!-- Quai : cartons rangés à gauche, une personne qui lit la jauge -->
  <use href="#crate" transform="translate(530 446)"/><use href="#crate" transform="translate(574 446)"/>
  <use href="#crate" transform="translate(552 420)"/>
  <use href="#man" transform="translate(640 486) scale(0.9)"/>
  <path d="M652 440 L690 410" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
  <!-- Cartons rangés à droite -->
  <use href="#crate" transform="translate(930 446)"/><use href="#crate" transform="translate(974 446)"/>
</svg>
