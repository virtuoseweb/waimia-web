<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Clés API dans vos automatisations » : un serrurier à genoux change la serrure d'une grande porte ; l'ancienne clé est restée au sol, sa caisse à outils ouverte à côté.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution creme-aere ; silhouettes en {{shadow}}. -->
  <defs><g id="kneel"><circle cx="5" cy="-68" r="7.5"/><path d="M-7 -58 Q3 -62 12 -57 L10 -24 L-10 -24 Z"/><rect x="-8" y="-27" width="32" height="11"/><rect x="15" y="-27" width="9" height="26"/><rect x="15" y="-3" width="14" height="3" rx="1.5"/><rect x="-11" y="-25" width="10" height="20"/><rect x="-32" y="-9" width="26" height="9"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="660" cy="506" rx="370" ry="22" fill="{{ground}}"/>
  <rect x="360" y="130" width="400" height="370" fill="{{pale}}"/>
  <rect x="470" y="180" width="180" height="10" fill="{{detail}}"/>
  <rect x="470" y="180" width="10" height="320" fill="{{detail}}"/><rect x="640" y="180" width="10" height="320" fill="{{detail}}"/>
  <rect x="480" y="190" width="160" height="310" fill="{{shape}}"/>
  <rect x="500" y="212" width="120" height="110" fill="{{pale}}"/><rect x="500" y="386" width="120" height="94" fill="{{pale}}"/>
  <rect x="584" y="364" width="28" height="8" rx="3" fill="{{subject}}"/>
  <rect x="608" y="360" width="18" height="36" rx="3" fill="{{subject}}"/>
  <circle cx="617" cy="372" r="3.5" fill="{{light}}"/><rect x="615.5" y="373" width="3" height="10" fill="{{light}}"/>
  <!-- serrurier -->
  <use href="#kneel" fill="{{shadow}}" transform="translate(704 500) scale(-2 2)"/>
  <path d="M688 390 L668 410 L646 394" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M644 392 L628 380" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
  <!-- ancienne clé au sol -->
  <circle cx="548" cy="492" r="8" fill="none" stroke="{{subject}}" stroke-width="4"/>
  <rect x="555" y="490" width="26" height="5" fill="{{subject}}"/><rect x="574" y="495" width="4" height="6" fill="{{subject}}"/>
  <!-- caisse à outils -->
  <rect x="770" y="462" width="96" height="38" fill="{{detail}}"/>
  <path d="M770 462 L784 444 L880 444 L866 462 Z" fill="{{shape}}"/>
  <rect x="792" y="426" width="7" height="30" fill="{{subject}}" transform="rotate(-14 796 446)"/>
  <rect x="822" y="436" width="26" height="8" fill="{{subject}}"/>

</svg>
