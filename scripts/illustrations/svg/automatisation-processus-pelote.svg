<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Automatisation des processus métiers : par où commencer » : une pelote géante emmêlée ; une personne en tire un seul fil, tendu, qu'elle enroule sur une bobine.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution creme-aere ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <defs><clipPath id="pelote"><circle cx="500" cy="334" r="158"/></clipPath></defs>
  <ellipse cx="700" cy="506" rx="420" ry="22" fill="{{ground}}"/>
  <ellipse cx="500" cy="500" rx="150" ry="8" fill="{{mid}}"/>
  <circle cx="500" cy="334" r="158" fill="{{shape}}"/>
  <g clip-path="url(#pelote)" fill="none" stroke="{{detail}}" stroke-width="7" stroke-linecap="round">
    <path d="M340 300 Q460 200 600 260 T680 380"/>
    <path d="M360 420 Q440 300 560 330 T660 250"/>
    <path d="M420 190 Q380 320 470 400 T620 470"/>
    <path d="M520 180 Q640 260 560 380 T380 460"/>
    <path d="M340 360 Q480 380 520 260 T640 200"/>
    <path d="M450 480 Q500 390 620 420"/>
  </g>
  <!-- boucles qui dépassent -->
  <path d="M370 452 Q330 500 380 502" fill="none" stroke="{{detail}}" stroke-width="6" stroke-linecap="round"/>
  <path d="M612 216 Q660 170 640 236" fill="none" stroke="{{detail}}" stroke-width="6" stroke-linecap="round"/>
  <!-- le seul fil tiré, tendu jusqu'à la main -->
  <path d="M652 352 L846 368" stroke="{{subject}}" stroke-width="4" stroke-linecap="round"/>
  <use href="#man" fill="{{shadow}}" transform="translate(900 500) scale(-2 2)"/>
  <path d="M884 346 L872 370 L856 372" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bobine tenue -->
  <rect x="834" y="350" width="22" height="40" fill="{{subject}}"/>
  <rect x="828" y="346" width="34" height="7" fill="{{detail}}"/><rect x="828" y="388" width="34" height="7" fill="{{detail}}"/>
  <!-- bobines déjà pleines, au sol -->
  <g><rect x="986" y="452" width="30" height="40" fill="{{subject}}"/><rect x="980" y="446" width="42" height="8" fill="{{detail}}"/><rect x="980" y="490" width="42" height="8" fill="{{detail}}"/></g>
  <g><rect x="1036" y="452" width="30" height="40" fill="{{subject}}"/><rect x="1030" y="446" width="42" height="8" fill="{{detail}}"/><rect x="1030" y="490" width="42" height="8" fill="{{detail}}"/></g>

</svg>
