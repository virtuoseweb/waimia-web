<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Câbler son CRM en 10 jours » : une allée de dix dalles mène à une petite maison ; sept sont posées, une personne à genoux pose la huitième, les deux dernières restent à faire.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="kneel"><circle cx="5" cy="-68" r="7.5"/><path d="M-7 -58 Q3 -62 12 -57 L10 -24 L-10 -24 Z"/><rect x="-8" y="-27" width="32" height="11"/><rect x="15" y="-27" width="9" height="26"/><rect x="15" y="-3" width="14" height="3" rx="1.5"/><rect x="-11" y="-25" width="10" height="20"/><rect x="-32" y="-9" width="26" height="9"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="870" cy="458" rx="430" ry="68" fill="{{ground}}"/>
  <ellipse cx="1162" cy="446" rx="70" ry="6" fill="{{shape}}"/>
  <polygon points="538 507 582 507 605 481 561 481" fill="{{subject}}"/>
  <polygon points="595 501 637 501 659 476 617 476" fill="{{subject}}"/>
  <polygon points="651 495 691 495 713 471 673 471" fill="{{subject}}"/>
  <polygon points="708 489 746 489 766 466 728 466" fill="{{subject}}"/>
  <polygon points="764 483 800 483 820 461 784 461" fill="{{subject}}"/>
  <polygon points="821 476 855 476 873 456 839 456" fill="{{subject}}"/>
  <polygon points="877 470 909 470 927 451 895 451" fill="{{subject}}"/>
  <polygon points="934 464 964 464 980 446 950 446" fill="{{soft}}"/>
  <polygon points="990 458 1018 458 1034 441 1006 441" fill="{{soft}}"/>
  <polygon points="1047 452 1073 452 1087 436 1061 436" fill="{{soft}}"/>
  <!-- maison au bout de l'allée -->
  <rect x="1110" y="352" width="104" height="92" fill="{{soft}}"/>
  <path d="M1094 356 L1162 296 L1230 356 Z" fill="{{deep}}"/>
  <rect x="1148" y="396" width="28" height="48" fill="{{deep}}"/>
  <rect x="1186" y="372" width="18" height="18" fill="{{light}}"/>
  <!-- pile de dalles à poser -->
  <g fill="{{subject}}"><rect x="858" y="420" width="50" height="10"/><rect x="860" y="408" width="50" height="10"/><rect x="856" y="396" width="50" height="10"/></g>
  <!-- la personne à genoux, derrière l'allée, pose la huitième -->
  <use href="#kneel" fill="{{shadow}}" transform="translate(966 432) scale(1.9)"/>
  <path d="M981 326 L994 352 L1004 376" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="986 392 1022 392 1032 380 996 380" fill="{{subject}}"/>

</svg>
