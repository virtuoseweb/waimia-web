<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · câbler son CRM : un grand poteau de lignes, des câbles tendus vers une rangée de dix petites maisons (un module par jour) ; une silhouette est sur une échelle contre le poteau. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{shadow}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{shadow}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{shadow}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{shadow}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{shadow}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{shadow}}"/>
    </g>
    <g id="house">
      <rect x="-30" y="-44" width="60" height="44" fill="{{subject}}"/>
      <path d="M-38 -44 L0 -76 L38 -44 Z" fill="{{shadow}}"/>
      <rect x="-9" y="-26" width="18" height="26" fill="{{light}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1130" cy="300" r="190" fill="{{shape}}"/>
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>

  <!-- Câbles : de la traverse du poteau vers chaque maison -->
  <g fill="none" stroke="{{shadow}}" stroke-width="2.5">
    <path d="M300 148 Q520 180 620 470"/>
    <path d="M300 148 Q560 200 720 470"/>
    <path d="M300 148 Q640 210 820 470"/>
    <path d="M300 148 Q720 220 920 470"/>
    <path d="M300 148 Q800 230 1020 470"/>
    <path d="M300 156 Q880 250 1120 470"/>
    <path d="M300 156 Q940 270 1220 470"/>
    <path d="M300 156 Q1000 290 1320 470"/>
  </g>
  <!-- Poteau + traverse + isolateurs -->
  <rect x="285" y="120" width="30" height="410" fill="{{subject}}"/>
  <rect x="215" y="140" width="170" height="14" fill="{{subject}}"/>
  <rect x="235" y="176" width="130" height="10" fill="{{subject}}"/>
  <g fill="{{light}}">
    <rect x="224" y="124" width="10" height="16"/><rect x="366" y="124" width="10" height="16"/><rect x="246" y="160" width="10" height="16"/><rect x="344" y="160" width="10" height="16"/>
  </g>
  <!-- Rangée de maisons -->
  <use href="#house" transform="translate(620 520) scale(0.8)"/>
  <use href="#house" transform="translate(720 520) scale(0.8)"/>
  <use href="#house" transform="translate(820 520) scale(0.8)"/>
  <use href="#house" transform="translate(920 520) scale(0.8)"/>
  <use href="#house" transform="translate(1020 520) scale(0.8)"/>
  <use href="#house" transform="translate(1120 520) scale(0.8)"/>
  <use href="#house" transform="translate(1220 520) scale(0.8)"/>
  <use href="#house" transform="translate(1320 520) scale(0.8)"/>
  <!-- Échelle et silhouette -->
  <g stroke="{{shadow}}" stroke-width="5" fill="none">
    <path d="M345 530 L318 220 M392 530 L350 220"/>
    <path d="M352 480 L398 480 M349 430 L395 430 M346 380 L392 380 M343 330 L389 330 M340 280 L386 280"/>
  </g>
  <use href="#man" transform="translate(440 530) scale(1.05)"/>
</svg>
