    <g id="board"><rect x="-62" y="-150" width="124" height="80" fill="{{detail}}"/><rect x="-62" y="-150" width="124" height="80" fill="none" stroke="{{shadow}}" stroke-width="3"/><rect x="-50" y="-138" width="60" height="8" fill="{{soft}}"/><rect x="-50" y="-118" width="34" height="36" fill="{{soft}}"/><rect x="-8" y="-104" width="14" height="22" fill="{{mid}}"/><rect x="12" y="-116" width="14" height="34" fill="{{mid}}"/><rect x="32" y="-96" width="14" height="14" fill="{{mid}}"/><path d="M-12 -70 L-16 -84 M12 -70 L16 -84" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/><path d="M-9 -78 L-14 -70 M9 -78 L14 -70" stroke="{{subject}}" stroke-width="6" stroke-linecap="round"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1180" cy="200" r="150" fill="{{shape}}"/>
  <rect y="480" width="1456" height="144" fill="{{ground}}"/>
  <rect y="476" width="1456" height="6" fill="{{deep}}"/>
