<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « ce que les assistants répondent sur vous » : au bord d'un plateau, une personne lance un appel vers une immense paroi ; l'écho revient vers elle (seul élément en rôle detail, bleu en touche-bleue). Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man"><circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/><path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/><rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/><rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/><rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- grande paroi -->
  <path d="M900 624 L912 236 Q920 150 1010 138 L1456 120 L1456 624 Z" fill="{{shape}}"/>
  <path d="M900 624 L912 236 Q920 150 1010 138 L1032 138 Q946 160 940 250 L932 624 Z" fill="{{pale}}"/>
  <!-- fond de vallée -->
  <rect x="700" y="588" width="240" height="36" fill="{{deep}}"/>
  <!-- plateau au premier plan -->
  <path d="M0 410 L700 410 L716 444 L706 624 L0 624 Z" fill="{{ground}}"/>
  <path d="M700 410 L716 444 L706 624 L690 624 L700 444 Z" fill="{{deep}}"/>
  <g fill="{{soft}}"><rect x="70" y="470" width="200" height="3"/><rect x="330" y="520" width="170" height="3"/><rect x="150" y="575" width="230" height="3"/></g>
  <!-- la personne, mains en porte-voix -->
  <use href="#man" transform="translate(640 410) scale(1.6)"/>
  <g stroke="{{subject}}" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M652 290 L666 270 L680 262"/>
    <path d="M630 292 L650 282 L666 278 L680 282"/>
  </g>
  <!-- l'appel qui part -->
  <g stroke="{{light}}" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M709.7 243.2 A40 40 0 0 1 709.7 296.8"/>
    <path d="M726.1 228.5 A62 62 0 0 1 726.1 311.5"/>
  </g>
  <!-- l'écho qui revient de la paroi -->
  <g stroke="{{detail}}" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M863.5 245.4 A40 40 0 0 0 863.5 294.6"/>
    <path d="M838.3 225.7 A72 72 0 0 0 838.3 314.3"/>
    <path d="M813.0 206.0 A104 104 0 0 0 813.0 334.0"/>
    <path d="M787.8 186.3 A136 136 0 0 0 787.8 353.7"/>
  </g>
</svg>
