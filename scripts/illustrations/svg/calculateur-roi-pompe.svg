<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Calculateur ROI IA » : amorcer la pompe. Un homme actionne le levier d'une
       pompe à bras ; à ses pieds, le petit seau qu'il a versé pour l'amorcer ; le bec remplit
       un long abreuvoir. Ce que l'on met d'abord, ce que l'on récupère ensuite.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 560 et 1200. Rôles : shape = l'eau, subject = la pompe ; silhouette en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Sol local -->
  <ellipse cx="880" cy="506" rx="400" ry="22" fill="{{ground}}"/>
  <ellipse cx="1010" cy="502" rx="210" ry="8" fill="{{shape}}"/>
  <ellipse cx="600" cy="502" rx="38" ry="6" fill="{{shape}}"/>

  <!-- Abreuvoir en bois sur pieds, plein à ras bord -->
  <g fill="{{deep}}">
    <rect x="840" y="470" width="14" height="32"/>
    <rect x="1170" y="470" width="14" height="32"/>
    <path d="M820 420 L1204 420 L1190 474 L834 474 Z"/>
  </g>
  <rect x="826" y="418" width="372" height="12" fill="{{shape}}"/>
  <g fill="{{shape}}">
    <ellipse cx="1214" cy="440" rx="5" ry="8"/>
    <ellipse cx="1222" cy="472" rx="4" ry="7"/>
  </g>
  <!-- Le petit seau d'amorçage, couché au pied de la pompe -->
  <g transform="rotate(-18 688 486)">
    <path d="M664 466 L712 466 L706 502 L670 502 Z" fill="{{deep}}"/>
    <path d="M664 466 Q688 440 712 466" fill="none" stroke="{{deep}}" stroke-width="4"/>
  </g>
  <ellipse cx="716" cy="500" rx="22" ry="4" fill="{{shape}}"/>

  <!-- La pompe : corps, chapeau, bec ; le jet tombe dans l'abreuvoir -->
  <rect x="852" y="322" width="13" height="100" fill="{{shape}}"/>
  <rect x="740" y="268" width="46" height="234" rx="4" fill="{{subject}}"/>
  <rect x="728" y="252" width="70" height="20" rx="4" fill="{{subject}}"/>
  <circle cx="763" cy="244" r="9" fill="{{subject}}"/>
  <rect x="726" y="486" width="74" height="16" rx="3" fill="{{subject}}"/>
  <rect x="784" y="292" width="82" height="18" fill="{{subject}}"/>
  <rect x="850" y="292" width="18" height="32" fill="{{subject}}"/>
  <!-- Levier, tiré par l'homme -->
  <path d="M752 262 L646 318" stroke="{{subject}}" stroke-width="11" stroke-linecap="round"/>
  <circle cx="752" cy="262" r="7" fill="{{deep}}"/>

  <!-- L'homme, de profil vers la pompe, les deux mains sur le levier -->
  <g transform="translate(600 500) scale(2.1)">
    <g fill="{{shadow}}">
      <rect x="-9" y="-44" width="8" height="42"/>
      <rect x="1" y="-44" width="8" height="42"/>
      <rect x="-10" y="-3" width="10" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="12" height="3" rx="1.5"/>
      <path d="M-12 -82 Q0 -86 12 -82 L14 -42 L-14 -42 Z"/>
      <circle cx="1" cy="-92" r="7.5"/>
    </g>
    <path d="M-2 -97 Q3 -102 9 -96 L8 -93 L-2 -94 Z" fill="{{shadow}}"/>
    <path d="M9 -78 L16 -72 L22 -86" fill="none" stroke="{{shadow}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
