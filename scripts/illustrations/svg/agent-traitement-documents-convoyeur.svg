<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « lire, contrôler, relire ce qui doute » : un tapis roulant de feuilles,
       un grand portique bleu que la plupart traversent, un embranchement vers un bureau où une
       personne relit les feuilles douteuses. Distribution prévue : forme-bleue (portique = {{shape}}). -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <!-- Feuille debout sur le tapis, base à y=0 -->
    <g id="sheet">
      <rect x="-14" y="-40" width="28" height="40" fill="{{detail}}"/>
      <rect x="-9" y="-33" width="18" height="2.4" fill="{{pale}}"/>
      <rect x="-9" y="-26" width="14" height="2.4" fill="{{pale}}"/>
      <rect x="-9" y="-19" width="18" height="2.4" fill="{{pale}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Sol -->
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect y="500" width="1456" height="3" fill="{{deep}}" opacity="0.55"/>

  <!-- Tapis principal : plateau, rouleaux, pieds -->
  <g fill="{{subject}}">
    <rect x="40" y="392" width="900" height="16" rx="8"/>
    <rect x="70" y="408" width="8" height="92"/><rect x="250" y="408" width="8" height="92"/>
    <rect x="430" y="408" width="8" height="92"/><rect x="610" y="408" width="8" height="92"/>
    <rect x="790" y="408" width="8" height="92"/><rect x="920" y="408" width="8" height="92"/>
  </g>
  <g fill="{{detail}}">
    <circle cx="56" cy="400" r="5"/><circle cx="924" cy="400" r="5"/>
  </g>

  <!-- Feuilles avant le portique -->
  <use href="#sheet" transform="translate(120 392)"/>
  <use href="#sheet" transform="translate(190 392) rotate(-4)"/>
  <use href="#sheet" transform="translate(262 392)"/>
  <use href="#sheet" transform="translate(330 392) rotate(5)"/>
  <use href="#sheet" transform="translate(402 392)"/>
  <!-- Feuilles après le portique -->
  <use href="#sheet" transform="translate(704 392)"/>
  <use href="#sheet" transform="translate(780 392)"/>

  <!-- Grand portique bleu qui enjambe le tapis, avec son rideau de lecture -->
  <g>
    <rect x="506" y="146" width="108" height="246" fill="{{pale}}" opacity="0.35"/>
    <path d="M470 392 L470 150 Q470 104 516 104 L604 104 Q650 104 650 150 L650 392 L614 392 L614 162 Q614 142 594 142 L526 142 Q506 142 506 162 L506 392 Z" fill="{{shape}}"/>
  </g>

  <!-- Embranchement : un second tapis part en biais vers le bureau de relecture -->
  <g>
    <path d="M752 408 L1040 432 L1040 446 L746 426 Z" fill="{{subject}}"/>
    <rect x="868" y="424" width="7" height="76" fill="{{subject}}"/>
    <rect x="960" y="432" width="7" height="68" fill="{{subject}}"/>
  </g>
  <use href="#sheet" transform="translate(830 418) rotate(6) scale(0.9)"/>
  <use href="#sheet" transform="translate(930 428) rotate(6) scale(0.9)"/>

  <!-- Bureau de relecture -->
  <g>
    <rect x="1030" y="438" width="190" height="12" fill="{{subject}}"/>
    <rect x="1042" y="450" width="9" height="50" fill="{{subject}}"/>
    <rect x="1198" y="450" width="9" height="50" fill="{{subject}}"/>
    <rect x="1070" y="418" width="28" height="20" fill="{{detail}}"/>
    <rect x="1108" y="424" width="28" height="14" fill="{{detail}}"/>
  </g>
  <use href="#man" transform="translate(1262 500) scale(1.02)"/>

  <!-- Petit témoin au loin -->
  <use href="#man" transform="translate(190 566) scale(0.42)"/>
</svg>
