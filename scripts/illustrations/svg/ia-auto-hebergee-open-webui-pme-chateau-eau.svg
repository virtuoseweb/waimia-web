<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « héberger soi-même, c'est aussi l'entretenir » : la nuit, une maison a son
       propre château d'eau ; une silhouette monte l'échelle pour l'entretenir ; au loin, sur
       l'horizon, le village et son réservoir commun. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
  </defs>

  <!-- Ciel de nuit et grande lune derrière le réservoir -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="860" cy="300" r="205" fill="{{shape}}"/>

  <!-- Sol -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>

  <!-- Au loin, à gauche : le village et son réservoir commun -->
  <g fill="{{detail}}">
    <rect x="150" y="448" width="40" height="22"/><path d="M146 448 L170 432 L194 448 Z"/>
    <rect x="200" y="452" width="30" height="18"/>
    <rect x="300" y="452" width="34" height="18"/><path d="M296 452 L317 438 L338 452 Z"/>
    <rect x="344" y="446" width="44" height="24"/>
    <path d="M246 470 L252 420 L264 420 L270 470 Z"/>
    <path d="M232 420 L284 420 L284 398 Q258 384 232 398 Z"/>
  </g>

  <!-- Le château d'eau privé : pieds écartés, contreventement, réservoir et toit conique -->
  <g fill="{{subject}}">
    <path d="M800 290 L818 290 L776 470 L756 470 Z"/>
    <path d="M942 290 L960 290 L1004 470 L984 470 Z"/>
    <path d="M846 290 L860 290 L852 470 L836 470 Z"/>
    <path d="M900 290 L914 290 L924 470 L908 470 Z"/>
    <path d="M790 352 L798 346 L978 412 L970 418 Z"/>
    <path d="M970 346 L978 352 L798 418 L790 412 Z"/>
    <rect x="770" y="410" width="222" height="9"/>
    <rect x="786" y="350" width="188" height="8"/>
    <path d="M778 170 L982 170 L982 280 Q880 304 778 280 Z"/>
    <path d="M768 172 L880 104 L992 172 Z"/>
    <rect x="874" y="88" width="12" height="20"/>
  </g>
  <!-- Bandes du réservoir -->
  <g fill="{{detail}}">
    <rect x="778" y="208" width="204" height="7"/>
    <rect x="778" y="246" width="204" height="7"/>
  </g>

  <!-- Échelle contre le pied droit et la silhouette qui monte -->
  <g fill="{{detail}}">
    <rect x="1008" y="270" width="6" height="200"/>
    <rect x="1040" y="270" width="6" height="200"/>
    <rect x="1008" y="300" width="38" height="5"/><rect x="1008" y="336" width="38" height="5"/>
    <rect x="1008" y="372" width="38" height="5"/><rect x="1008" y="408" width="38" height="5"/>
    <rect x="1008" y="444" width="38" height="5"/>
    <rect x="982" y="270" width="64" height="6"/>
  </g>
  <use href="#man" transform="translate(1027 410) scale(1.2)"/>

  <!-- Tuyau du château d'eau vers la maison -->
  <rect x="992" y="488" width="150" height="8" fill="{{subject}}"/>
  <rect x="1134" y="470" width="8" height="26" fill="{{subject}}"/>

  <!-- La maison -->
  <g>
    <rect x="1124" y="380" width="170" height="90" fill="{{subject}}"/>
    <path d="M1110 382 L1209 316 L1308 382 Z" fill="{{subject}}"/>
    <rect x="1150" y="408" width="30" height="30" fill="{{detail}}"/>
    <rect x="1236" y="408" width="30" height="30" fill="{{detail}}"/>
    <rect x="1196" y="420" width="26" height="50" fill="{{field}}"/>
  </g>

  <!-- Traits du sol -->
  <g fill="{{shadow}}">
    <rect x="80" y="520" width="200" height="3"/><rect x="380" y="570" width="220" height="3"/>
    <rect x="640" y="530" width="120" height="3"/><rect x="1180" y="560" width="190" height="3"/>
    <rect x="200" y="600" width="150" height="3"/>
  </g>
</svg>
