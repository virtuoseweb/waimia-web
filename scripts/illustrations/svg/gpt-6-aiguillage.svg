<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « changer de modèle = un aiguillage » : un grand disque, deux voies ferrées qui divergent depuis un levier géant ; un homme tient le levier, une femme compare deux feuilles. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="8" fill="{{subject}}"/>
      <path d="M-10 -82 Q0 -86 10 -82 L11 -48 L-11 -48 Z" fill="{{subject}}"/>
      <path d="M-3 -82 L0 -74 L3 -82 Z" fill="{{light}}"/>
      <rect x="-9" y="-49" width="7" height="47" fill="{{subject}}"/>
      <rect x="2" y="-49" width="7" height="47" fill="{{subject}}"/>
      <path d="M-11 -3 L-1 -3 L-1 0 L-11 0 Z M1 -3 L11 -3 L11 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="980" cy="250" r="210" fill="{{shape}}"/>
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <rect y="464" width="1456" height="8" fill="{{deep}}"/>
  <!-- voie commune à gauche -->
  <g fill="{{shadow}}">
    <rect x="0" y="540" width="560" height="7"/>
    <rect x="0" y="574" width="560" height="7"/>
  </g>
  <g fill="{{deep}}">
    <rect x="30" y="532" width="12" height="58"/><rect x="110" y="532" width="12" height="58"/><rect x="190" y="532" width="12" height="58"/><rect x="270" y="532" width="12" height="58"/><rect x="350" y="532" width="12" height="58"/><rect x="430" y="532" width="12" height="58"/><rect x="510" y="532" width="12" height="58"/>
  </g>
  <!-- branche haute vers le disque -->
  <path d="M560 540 Q760 520 1456 486 L1456 493 Q760 527 560 547 Z" fill="{{shadow}}"/>
  <path d="M560 574 Q780 556 1456 520 L1456 527 Q780 563 560 581 Z" fill="{{shadow}}"/>
  <!-- branche basse droite -->
  <path d="M560 540 Q800 548 1456 590 L1456 597 Q800 555 560 547 Z" fill="{{shadow}}"/>
  <path d="M560 574 Q780 584 1456 616 L1456 623 Q780 591 560 581 Z" fill="{{shadow}}"/>
  <!-- grand levier -->
  <rect x="520" y="500" width="70" height="30" fill="{{shadow}}"/>
  <rect x="548" y="250" width="14" height="260" fill="{{shadow}}" transform="rotate(18 555 505)"/>
  <circle cx="634" cy="262" r="20" fill="{{detail}}"/>
  <!-- homme qui pousse le levier -->
  <use href="#man" transform="translate(470 520) scale(1.1)"/>
  <path d="M478 432 L600 362" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
  <!-- signal : un panneau à deux disques -->
  <rect x="300" y="300" width="10" height="220" fill="{{shadow}}"/>
  <rect x="276" y="250" width="58" height="96" rx="10" fill="{{shadow}}"/>
  <circle cx="305" cy="275" r="15" fill="{{light}}"/>
  <circle cx="305" cy="320" r="15" fill="{{detail}}"/>
  <!-- femme qui compare deux feuilles -->
  <use href="#woman" transform="translate(180 520) scale(0.95)"/>
  <rect x="140" y="440" width="26" height="34" fill="{{light}}" transform="rotate(-8 153 457)"/>
  <rect x="196" y="440" width="26" height="34" fill="{{pale}}" transform="rotate(8 209 457)"/>
</svg>
