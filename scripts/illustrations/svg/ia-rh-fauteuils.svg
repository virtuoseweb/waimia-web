<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour les RH en PME » : l'entretien annuel. Deux personnes assises face à face dans
       deux fauteuils, une table basse entre elles avec une feuille et une plante, devant un
       grand disque.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <circle cx="880" cy="290" r="156" fill="{{shape}}"/>
  <ellipse cx="880" cy="506" rx="360" ry="22" fill="{{ground}}"/>
  <ellipse cx="740" cy="502" rx="70" ry="7" fill="{{soft}}"/>
  <ellipse cx="1020" cy="502" rx="70" ry="7" fill="{{soft}}"/>
  <!-- Fauteuil de gauche -->
  <rect x="672" y="336" width="30" height="144" rx="10" fill="{{pale}}"/>
  <rect x="672" y="450" width="104" height="30" rx="10" fill="{{pale}}"/>
  <rect x="680" y="478" width="10" height="22" fill="{{deep}}"/>
  <rect x="756" y="478" width="10" height="22" fill="{{deep}}"/>
  <!-- Fauteuil de droite -->
  <rect x="1058" y="336" width="30" height="144" rx="10" fill="{{pale}}"/>
  <rect x="984" y="450" width="104" height="30" rx="10" fill="{{pale}}"/>
  <rect x="994" y="478" width="10" height="22" fill="{{deep}}"/>
  <rect x="1070" y="478" width="10" height="22" fill="{{deep}}"/>
  <!-- Les deux personnes -->
  <use href="#sit" transform="translate(716 500) scale(2 2)"/>
  <use href="#sitw" transform="translate(1044 500) scale(-2 2)"/>
  <path d="M738 372 L766 396 L790 392" fill="none" stroke="{{shadow}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1022 372 L996 398 L978 404" fill="none" stroke="{{shadow}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Table basse, feuille et plante -->
  <ellipse cx="880" cy="430" rx="52" ry="9" fill="{{deep}}"/>
  <rect x="875" y="430" width="10" height="64" fill="{{deep}}"/>
  <ellipse cx="880" cy="498" rx="30" ry="5" fill="{{deep}}"/>
  <path d="M842 426 L874 418 L882 426 L850 434 Z" fill="{{light}}" stroke="{{mid}}" stroke-width="2"/>
  <path d="M898 424 L922 424 L918 404 L902 404 Z" fill="{{soft}}"/>
  <g fill="{{detail}}"><ellipse cx="904" cy="388" rx="7" ry="17" transform="rotate(-22 904 388)"/><ellipse cx="918" cy="384" rx="6" ry="15" transform="rotate(26 918 384)"/><ellipse cx="910" cy="378" rx="5" ry="15" transform="rotate(4 910 378)"/></g>
</svg>
