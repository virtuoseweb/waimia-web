<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « référencement local » : trois chemins convergent vers une épingle
       de carte plantée à l'horizon, devant un bourg de petites maisons ; des silhouettes y
       marchent. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <!-- Petite maison : corps, toit en détail -->
    <g id="house">
      <rect x="-22" y="-26" width="44" height="26" fill="{{subject}}"/>
      <path d="M-28 -26 L0 -52 L28 -26 Z" fill="{{detail}}"/>
      <rect x="-5" y="-16" width="10" height="16" fill="{{light}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="470"/></clipPath>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Grand disque derrière l'épingle -->
  <circle cx="728" cy="350" r="230" fill="{{shape}}" clip-path="url(#sky)"/>

  <!-- Sol -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>

  <!-- Le bourg : maisons sur l'horizon -->
  <use href="#house" transform="translate(90 470) scale(1.1)"/>
  <use href="#house" transform="translate(190 470) scale(0.8)"/>
  <use href="#house" transform="translate(300 470) scale(1)"/>
  <use href="#house" transform="translate(410 470) scale(0.7)"/>
  <use href="#house" transform="translate(1030 470) scale(0.75)"/>
  <use href="#house" transform="translate(1140 470) scale(1.05)"/>
  <use href="#house" transform="translate(1250 470) scale(0.85)"/>
  <use href="#house" transform="translate(1360 470) scale(1.1)"/>

  <!-- Trois chemins qui convergent vers le pied de l'épingle -->
  <path d="M120 624 L360 624 L742 470 L714 470 Z" fill="{{soft}}"/>
  <path d="M1096 624 L1336 624 L742 470 L714 470 Z" fill="{{soft}}"/>
  <path d="M628 624 L828 624 L736 470 L720 470 Z" fill="{{soft}}"/>

  <!-- Épingle de carte : goutte, trou clair -->
  <path d="M728 470 C690 410 626 372 626 292 C626 232 672 190 728 190 C784 190 830 232 830 292 C830 372 766 410 728 470 Z" fill="{{subject}}"/>
  <circle cx="728" cy="290" r="46" fill="{{detail}}"/>
  <circle cx="728" cy="290" r="22" fill="{{light}}"/>

  <!-- Marcheurs sur les chemins -->
  <use href="#man" transform="translate(300 600) scale(0.9)"/>
  <use href="#man" transform="translate(1130 596) scale(0.8)"/>
  <use href="#man" transform="translate(760 540) scale(0.55)"/>
</svg>
