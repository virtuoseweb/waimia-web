  <use href="#sheep" transform="translate(620 470)"/>
  <use href="#sheep" transform="translate(700 452)"/>
  <use href="#sheep" transform="translate(760 488)"/>
  <use href="#sheep" transform="translate(840 462)"/>
  <use href="#sheep" transform="translate(560 498)"/>
  <use href="#sheep" transform="translate(1120 492) scale(0.9)"/>
  <use href="#sheep" transform="translate(1220 486) scale(0.9)"/>
  <path d="M410 470 Q440 448 486 452 L510 444 L522 452 L512 464 L500 470 Q470 486 430 482 Z" fill="{{subject}}"/>
  <path d="M420 476 L398 500 L410 500 L432 480 Z M470 478 L486 500 L498 500 L484 476 Z M412 470 L384 456 L388 466 Z" fill="{{subject}}"/>
  <use href="#pointer" transform="translate(940 500) scale(1.25)"/>
