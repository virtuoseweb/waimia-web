      <path d="M-6 -44 L6 -44 L14 -2 L2 -2 Z" fill="{{subject}}"/>
      <rect x="-30" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="2" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="300" cy="120" rx="90" ry="26" fill="{{detail}}"/><ellipse cx="370" cy="104" rx="60" ry="22" fill="{{detail}}"/>
  <ellipse cx="1180" cy="90" rx="70" ry="20" fill="{{detail}}"/>
  <ellipse cx="720" cy="520" rx="620" ry="200" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <g fill="{{subject}}">
    <rect x="980" y="378" width="10" height="122"/><rect x="1300" y="378" width="10" height="122"/>
    <rect x="1090" y="378" width="10" height="122"/><rect x="1200" y="378" width="10" height="122"/>
    <rect x="980" y="398" width="330" height="8"/><rect x="980" y="440" width="330" height="8"/>
  </g>
  <g fill="{{detail}}">
    <rect x="910" y="398" width="70" height="8" transform="rotate(-35 980 402)"/>
    <rect x="910" y="440" width="70" height="8" transform="rotate(-35 980 444)"/>
  </g>
  <defs>
    <g id="sheep">
      <rect x="-16" y="-12" width="5" height="20" fill="{{subject}}"/><rect x="10" y="-12" width="5" height="20" fill="{{subject}}"/>
      <ellipse cx="0" cy="-22" rx="30" ry="19" fill="{{detail}}"/>
      <ellipse cx="30" cy="-28" rx="10" ry="8" fill="{{subject}}"/>
