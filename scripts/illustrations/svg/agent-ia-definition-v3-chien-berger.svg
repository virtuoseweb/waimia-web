<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · lot IMG1 · un chien de berger rassemble seul le troupeau vers l enclos, le berger attend à la barrière -->
  <defs>
    <g id="man">
