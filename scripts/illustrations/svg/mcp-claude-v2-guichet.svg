<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- duotone contre-jour · une grande armoire fermée ; devant, un guichet à fente ; une silhouette tend une seule feuille par la fente, une autre la reçoit derrière. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>

  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- faisceau de lampe, très doux, sur la fente -->
  <path d="M600 0 L700 0 L780 430 L520 430 Z" fill="{{deep}}"/>
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <!-- armoire fermée, massive -->
  <rect x="880" y="70" width="440" height="452" fill="{{shape}}"/>
  <rect x="868" y="58" width="464" height="16" fill="{{deep}}"/>
  <rect x="1098" y="86" width="4" height="420" fill="{{deep}}"/>
  <g fill="{{deep}}"><rect x="900" y="90" width="186" height="190"/><rect x="900" y="300" width="186" height="200"/><rect x="1114" y="90" width="186" height="190"/><rect x="1114" y="300" width="186" height="200"/></g>
  <rect x="1082" y="270" width="8" height="40" fill="{{detail}}"/><rect x="1110" y="270" width="8" height="40" fill="{{detail}}"/>
  <rect x="1088" y="282" width="24" height="16" fill="{{detail}}"/>
  <!-- cloison du guichet avec sa fente -->
  <rect x="610" y="150" width="76" height="266" fill="{{detail}}"/>
  <rect x="610" y="430" width="76" height="92" fill="{{detail}}"/>
  <rect x="604" y="416" width="88" height="14" fill="{{shadow}}"/>
  <!-- tablette de part et d'autre -->
  <rect x="590" y="430" width="116" height="8" fill="{{light}}"/>
  <!-- la feuille, une seule, qui passe par la fente -->
  <rect x="622" y="419" width="52" height="9" fill="{{light}}"/>
  <!-- visiteur à gauche, bras tendu -->
  <use href="#man" transform="translate(566 522) scale(1.5)"/>
  <path d="M576 410 L622 424" stroke="{{subject}}" stroke-width="8" stroke-linecap="round"/>
  <!-- employée derrière le guichet, reçoit -->
  <use href="#woman" transform="translate(736 522) scale(1.5)"/>
  <path d="M728 412 L674 424" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
</svg>
