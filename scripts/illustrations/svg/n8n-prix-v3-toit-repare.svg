<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · lot IMG1 · une petite maison ; une silhouette sur une échelle remplace des tuiles du toit, une autre lui tend une tuile -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
    <g id="reacher">
      <use href="#woman"/>
      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pusher">
      <circle cx="10" cy="-86" r="7.5" fill="{{subject}}"/>
      <path d="M-6 -78 Q4 -82 14 -76 L4 -42 L-18 -44 Z" fill="{{subject}}"/>
      <rect x="2" y="-74" width="34" height="6" rx="3" fill="{{subject}}" transform="rotate(8 2 -74)"/>
      <path d="M-18 -44 L-4 -44 L-14 -2 L-26 -2 Z" fill="{{subject}}"/>
      <path d="M-6 -44 L6 -44 L14 -2 L2 -2 Z" fill="{{subject}}"/>
      <rect x="-30" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="2" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="900" cy="280" r="220" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect x="560" y="330" width="320" height="170" fill="{{detail}}"/>
  <path d="M530 334 L720 190 L910 334 Z" fill="{{subject}}"/>
  <g fill="{{light}}"><rect x="760" y="270" width="40" height="22" transform="rotate(37 780 281)"/><rect x="640" y="380" width="56" height="60"/><rect x="760" y="390" width="60" height="110"/></g>
  <rect x="610" y="200" width="30" height="80" fill="{{subject}}"/>
  <g stroke="{{subject}}" stroke-width="8"><line x1="940" y1="500" x2="860" y2="250"/><line x1="985" y1="500" x2="905" y2="250"/></g>
  <g stroke="{{subject}}" stroke-width="5"><line x1="930" y1="468.75" x2="975" y2="468.75"/><line x1="920" y1="437.5" x2="965" y2="437.5"/><line x1="910" y1="406.25" x2="955" y2="406.25"/><line x1="900" y1="375" x2="945" y2="375"/><line x1="890" y1="343.75" x2="935" y2="343.75"/><line x1="880" y1="312.5" x2="925" y2="312.5"/><line x1="870" y1="281.25" x2="915" y2="281.25"/></g>
  <use href="#reacher" transform="translate(905 352) scale(1.2)"/>
  <use href="#man" transform="translate(1060 500) scale(1.3)"/>
  <rect x="1082" y="360" width="40" height="22" fill="{{detail}}" transform="rotate(-20 1102 371)"/>
  <rect x="1090" y="374" width="7" height="34" fill="{{subject}}" transform="rotate(30 1093 408)"/>
  <rect x="980" y="480" width="56" height="20" fill="{{subject}}"/>

</svg>
