<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « laisser entrer les robots du moteur » : une longue grille
       de fer barre l'horizon ; en son milieu, les deux battants sont ouverts devant un
       grand disque posé sur l'horizon ; deux visiteurs passent, la gardienne tient un
       battant. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-89" r="8.5" fill="{{subject}}"/>
      <path d="M-15 -73 Q-15 -80 -8 -81 L8 -81 Q15 -80 15 -73 L16 -40 L-16 -40 Z" fill="{{subject}}"/>
      <rect x="-11" y="-42" width="9" height="39" fill="{{subject}}"/>
      <rect x="2" y="-42" width="9" height="39" fill="{{subject}}"/>
      <rect x="-13" y="-4" width="12" height="4" fill="{{subject}}"/>
      <rect x="1" y="-4" width="12" height="4" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <circle cx="0" cy="-99" r="5.5" fill="{{subject}}"/>
      <path d="M-9 -81 Q0 -85 9 -81 L10 -52 L-10 -52 Z" fill="{{subject}}"/>
      <path d="M-11 -53 L11 -53 L9 -22 L-9 -22 Z" fill="{{subject}}"/>
      <rect x="-6.5" y="-23" width="4.5" height="20" fill="{{subject}}"/>
      <rect x="2" y="-23" width="4.5" height="20" fill="{{subject}}"/>
      <path d="M-8 -4 L-1 -4 L-1 0 L-8 0 Z M1 -4 L8 -4 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <!-- un barreau de grille, pointe en fer de lance -->
    <g id="bar">
      <rect x="-5" y="-176" width="10" height="176" fill="{{subject}}"/>
      <path d="M-9 -174 L0 -196 L9 -174 Z" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="500"/></clipPath>
  </defs>

  <!-- Grand ciel -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Nuage crème à gauche -->
  <path d="M150 150 q18 -36 64 -28 q22 -34 70 -16 q38 -20 68 14 q44 -2 52 36 q26 10 16 36 L132 192 q-8 -28 18 -42 Z" fill="{{detail}}"/>
  <!-- Grand disque posé sur l'horizon, au fond, dans l'axe du portail -->
  <circle cx="728" cy="500" r="190" fill="{{shape}}" clip-path="url(#sky)"/>

  <!-- Sol -->
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <!-- Allée claire qui passe le portail -->
  <path d="M676 500 L780 500 L900 624 L556 624 Z" fill="{{detail}}"/>

  <!-- Grille : deux lisses et des barreaux réguliers, de part et d'autre du portail -->
  <g fill="{{subject}}">
    <rect x="0" y="372" width="638" height="9"/>
    <rect x="0" y="470" width="638" height="9"/>
    <rect x="818" y="372" width="638" height="9"/>
    <rect x="818" y="470" width="638" height="9"/>
  </g>
  <g>
    <use href="#bar" x="20" y="500"/><use href="#bar" x="62" y="500"/><use href="#bar" x="104" y="500"/>
    <use href="#bar" x="146" y="500"/><use href="#bar" x="188" y="500"/><use href="#bar" x="230" y="500"/>
    <use href="#bar" x="272" y="500"/><use href="#bar" x="314" y="500"/><use href="#bar" x="356" y="500"/>
    <use href="#bar" x="398" y="500"/><use href="#bar" x="440" y="500"/><use href="#bar" x="482" y="500"/>
    <use href="#bar" x="524" y="500"/><use href="#bar" x="566" y="500"/><use href="#bar" x="608" y="500"/>
    <use href="#bar" x="848" y="500"/><use href="#bar" x="890" y="500"/><use href="#bar" x="932" y="500"/>
    <use href="#bar" x="974" y="500"/><use href="#bar" x="1016" y="500"/><use href="#bar" x="1058" y="500"/>
    <use href="#bar" x="1100" y="500"/><use href="#bar" x="1142" y="500"/><use href="#bar" x="1184" y="500"/>
    <use href="#bar" x="1226" y="500"/><use href="#bar" x="1268" y="500"/><use href="#bar" x="1310" y="500"/>
    <use href="#bar" x="1352" y="500"/><use href="#bar" x="1394" y="500"/><use href="#bar" x="1436" y="500"/>
  </g>
  <!-- Piliers du portail -->
  <g fill="{{subject}}">
    <rect x="626" y="292" width="26" height="208"/><rect x="622" y="284" width="34" height="10"/><circle cx="639" cy="272" r="13"/>
    <rect x="804" y="292" width="26" height="208"/><rect x="800" y="284" width="34" height="10"/><circle cx="817" cy="272" r="13"/>
  </g>
  <!-- Battants ouverts vers nous : cadre et barreaux en perspective -->
  <g fill="{{subject}}">
    <path d="M626 318 L548 300 L548 308 L626 326 Z"/>
    <path d="M626 486 L548 532 L548 540 L626 494 Z"/>
    <path d="M548 300 L558 302 L558 540 L548 540 Z"/>
    <path d="M574 306 L582 308 L582 525 L574 530 Z"/>
    <path d="M598 312 L606 314 L606 511 L598 516 Z"/>
    <path d="M830 318 L908 300 L908 308 L830 326 Z"/>
    <path d="M830 486 L908 532 L908 540 L830 494 Z"/>
    <path d="M898 302 L908 300 L908 540 L898 540 Z"/>
    <path d="M874 308 L882 306 L882 530 L874 525 Z"/>
    <path d="M850 314 L858 312 L858 516 L850 511 Z"/>
  </g>

  <!-- Deux visiteurs passent le portail, de dos -->
  <use href="#man" transform="translate(704 548) scale(1.45)"/>
  <use href="#man" transform="translate(758 556) scale(1.5)"/>
  <!-- sacoche du second visiteur -->
  <rect x="772" y="470" width="18" height="22" fill="{{subject}}"/>
  <!-- La gardienne, au premier plan, tient le battant droit -->
  <use href="#woman" transform="translate(960 612) scale(1.75)"/>
  <path d="M948 498 L912 520" stroke="{{subject}}" stroke-width="8" stroke-linecap="round"/>
</svg>
