<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · claude-skills · un skill s’installe comme un logiciel : une loupe géante au-dessus d’une caisse entrouverte, à contre-jour -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
    <g id="reacher">
      <use href="#woman"/>
      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
    <g id="seated">
      <circle cx="0" cy="-62" r="7" fill="{{subject}}"/>
      <path d="M-10 -53 Q0 -57 10 -53 L11 -20 L-11 -20 Z" fill="{{subject}}"/>
      <rect x="-11" y="-22" width="26" height="8" fill="{{subject}}"/>
      <rect x="9" y="-22" width="7" height="22" fill="{{subject}}"/>
      <rect x="-14" y="-16" width="4" height="16" fill="{{deep}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <rect y="510" width="1456" height="114" fill="{{ground}}"/>
  <rect x="640" y="400" width="240" height="110" fill="{{detail}}"/>
  <rect x="640" y="400" width="240" height="14" fill="{{deep}}"/>
  <rect x="700" y="414" width="8" height="96" fill="{{deep}}"/><rect x="812" y="414" width="8" height="96" fill="{{deep}}"/>
  <path d="M640 400 L606 330 L846 318 L880 400 Z" fill="{{deep}}"/>
  <rect x="676" y="370" width="20" height="40" fill="{{light}}"/><rect x="706" y="360" width="20" height="50" fill="{{light}}"/><rect x="740" y="372" width="20" height="38" fill="{{light}}"/><rect x="772" y="364" width="20" height="46" fill="{{light}}"/>
  <circle cx="780" cy="215" r="165" fill="{{shape}}" opacity="0.92"/>
  <circle cx="780" cy="215" r="165" fill="none" stroke="{{subject}}" stroke-width="20"/>
  <path d="M676 190 Q716 112 804 92" stroke="{{pale}}" stroke-width="10" fill="none"/>
  <line x1="630" y1="290" x2="368" y2="334" stroke="{{subject}}" stroke-width="26" stroke-linecap="round"/>
  <use href="#pointer" transform="translate(400 512) scale(1.7)"/>
  <circle cx="1240" cy="120" r="40" fill="{{mid}}"/>

</svg>
