<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « intérêt légitime : la mise en balance écrite » :
       une balance géante devant un grand disque ; sur un plateau une pile de feuilles,
       sur l'autre trois petites silhouettes ; au pied, un homme déroule une longue feuille
       qu'il annote. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="8" fill="{{subject}}"/>
      <path d="M-10 -82 Q0 -86 10 -82 L11 -48 L-11 -48 Z" fill="{{subject}}"/>
      <path d="M-3 -82 L0 -74 L3 -82 Z" fill="{{light}}"/>
      <rect x="-9" y="-49" width="7" height="47" fill="{{subject}}"/>
      <rect x="2" y="-49" width="7" height="47" fill="{{subject}}"/>
      <path d="M-11 -3 L-1 -3 L-1 0 L-11 0 Z M1 -3 L11 -3 L11 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
  </defs>

  <!-- Fond et grand disque -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="728" cy="300" r="250" fill="{{shape}}"/>

  <!-- Sol, horizon bas -->
  <rect y="540" width="1456" height="84" fill="{{ground}}"/>
  <rect y="534" width="1456" height="8" fill="{{deep}}"/>

  <!-- Pied de la balance -->
  <path d="M676 540 L780 540 L752 514 L704 514 Z" fill="{{shadow}}"/>
  <rect x="718" y="140" width="20" height="378" fill="{{shadow}}"/>
  <circle cx="728" cy="132" r="18" fill="{{shadow}}"/>
  <!-- Fléau horizontal -->
  <rect x="438" y="126" width="580" height="14" fill="{{shadow}}"/>
  <circle cx="446" cy="133" r="9" fill="{{shadow}}"/>
  <circle cx="1010" cy="133" r="9" fill="{{shadow}}"/>

  <!-- Plateau gauche : chaînes et pile de feuilles -->
  <g stroke="{{deep}}" stroke-width="3">
    <line x1="446" y1="140" x2="376" y2="330"/>
    <line x1="446" y1="140" x2="516" y2="330"/>
  </g>
  <path d="M360 330 L532 330 Q520 358 446 360 Q372 358 360 330 Z" fill="{{shadow}}"/>
  <g>
    <rect x="392" y="262" width="108" height="14" fill="{{light}}"/>
    <rect x="396" y="276" width="104" height="14" fill="{{pale}}"/>
    <rect x="390" y="290" width="110" height="14" fill="{{light}}"/>
    <rect x="394" y="304" width="104" height="14" fill="{{pale}}"/>
    <rect x="388" y="318" width="114" height="12" fill="{{light}}"/>
    <g fill="{{mid}}">
      <rect x="402" y="267" width="60" height="3"/><rect x="402" y="295" width="74" height="3"/><rect x="402" y="322" width="50" height="3"/>
    </g>
  </g>

  <!-- Plateau droit : trois petites silhouettes -->
  <g stroke="{{deep}}" stroke-width="3">
    <line x1="1010" y1="140" x2="940" y2="330"/>
    <line x1="1010" y1="140" x2="1080" y2="330"/>
  </g>
  <path d="M924 330 L1096 330 Q1084 358 1010 360 Q936 358 924 330 Z" fill="{{shadow}}"/>
  <use href="#man" transform="translate(972 330) scale(0.62)"/>
  <use href="#woman" transform="translate(1008 330) scale(0.66)"/>
  <use href="#man" transform="translate(1046 330) scale(0.58)"/>

  <!-- Au pied : un homme déroule une longue feuille sur le sol et l'annote -->
  <path d="M842 546 L1210 546 L1216 560 L848 560 Z" fill="{{light}}" stroke="{{deep}}" stroke-width="2"/>
  <path d="M1210 540 q18 -2 18 -14 q0 -12 -14 -12 q-10 0 -10 10 q0 8 8 8" fill="none" stroke="{{deep}}" stroke-width="5"/>
  <use href="#man" transform="translate(860 540) scale(0.9)"/>
  <path d="M866 468 L896 500" stroke="{{subject}}" stroke-width="6" stroke-linecap="round"/>
  <rect x="894" y="496" width="4" height="22" fill="{{subject}}" transform="rotate(-30 896 507)"/>

  <!-- Au loin, à gauche, une femme regarde la balance -->
  <use href="#woman" transform="translate(212 540) scale(0.8)"/>
</svg>
