<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · lot EXIST · « trois niveaux, de l’usage au développement » : trois énormes blocs en escalier, une personne au pied, une sur le premier bloc, une au sommet qui regarde l’horizon. Rôles remplacés par render-svg.mjs. -->
  <defs>
