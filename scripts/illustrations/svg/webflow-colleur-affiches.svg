<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « Webflow » : un colleur d'affiches pose, bloc par bloc, de grandes feuilles
       sur un panneau d'affichage. Le panneau (sujet bleu) est l'objet central ; les silhouettes en
       couleur de détail. Distribution prévue : objet-bleu. Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{detail}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{detail}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{detail}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{detail}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{detail}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{detail}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{detail}}"/>
    </g>
    <clipPath id="above"><rect width="1456" height="490"/></clipPath>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Grand disque derrière le panneau -->
  <circle cx="960" cy="285" r="240" fill="{{shape}}" clip-path="url(#above)"/>
  <!-- Sol -->
  <rect y="490" width="1456" height="134" fill="{{ground}}"/>
  <rect y="490" width="1456" height="3" fill="{{deep}}" opacity="0.5"/>

  <!-- Piquets du panneau -->
  <rect x="800" y="395" width="16" height="100" fill="{{detail}}"/>
  <rect x="1124" y="395" width="16" height="100" fill="{{detail}}"/>
  <rect x="780" y="405" width="56" height="8" fill="{{detail}}"/>
  <!-- Ombre portée du panneau -->
  <rect x="752" y="162" width="460" height="250" fill="{{deep}}" opacity="0.35"/>
  <!-- Cadre bleu et fond crème -->
  <rect x="740" y="150" width="460" height="250" fill="{{subject}}"/>
  <rect x="756" y="166" width="428" height="218" fill="{{light}}"/>
  <!-- Blocs de mise en page, collés les uns à côté des autres -->
  <rect x="772" y="180" width="396" height="24" fill="{{detail}}"/>
  <rect x="772" y="218" width="236" height="150" fill="{{subject}}"/>
  <circle cx="890" cy="292" r="42" fill="{{light}}"/>
  <rect x="1022" y="218" width="146" height="44" fill="{{soft}}"/>
  <rect x="1022" y="274" width="146" height="44" fill="{{pale}}"/>
  <rect x="1022" y="330" width="146" height="38" fill="{{soft}}"/>

  <!-- Grande feuille en cours de pose, qui déborde du panneau -->
  <g transform="translate(1128 196) rotate(9)">
    <rect x="-62" y="-70" width="124" height="140" fill="{{light}}"/>
    <rect x="-62" y="-70" width="124" height="140" fill="none" stroke="{{deep}}" stroke-width="2"/>
    <rect x="-46" y="-52" width="92" height="60" fill="{{subject}}"/>
    <rect x="-46" y="20" width="92" height="12" fill="{{soft}}"/>
    <rect x="-46" y="42" width="56" height="12" fill="{{pale}}"/>
  </g>

  <!-- Échelle contre le panneau -->
  <g stroke="{{detail}}" stroke-linecap="round">
    <line x1="1236" y1="490" x2="1204" y2="226" stroke-width="5"/>
    <line x1="1280" y1="490" x2="1236" y2="226" stroke-width="5"/>
    <g stroke-width="4">
      <line x1="1231" y1="450" x2="1275" y2="450"/>
      <line x1="1226" y1="410" x2="1270" y2="410"/>
      <line x1="1221" y1="370" x2="1264" y2="370"/>
      <line x1="1215" y1="330" x2="1257" y2="330"/>
      <line x1="1210" y1="290" x2="1250" y2="290"/>
      <line x1="1205" y1="250" x2="1243" y2="250"/>
    </g>
  </g>
  <!-- Colleur sur l'échelle, bras tendu vers la feuille -->
  <use href="#man" transform="translate(1232 330) scale(0.72)"/>
  <path d="M1226 272 L1174 234" stroke="{{detail}}" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Colleur au sol, rouleau sous le bras, seau et pinceau -->
  <use href="#man" transform="translate(640 490) scale(1.0)"/>
  <rect x="654" y="402" width="16" height="70" rx="3" fill="{{light}}" stroke="{{deep}}" stroke-width="2" transform="rotate(14 662 437)"/>
  <path d="M700 490 L708 458 L744 458 L752 490 Z" fill="{{detail}}"/>
  <path d="M728 458 L760 404" stroke="{{detail}}" stroke-width="5" stroke-linecap="round"/>
  <path d="M752 404 L770 398 L772 412 L756 416 Z" fill="{{detail}}"/>

  <!-- Rouleaux d'affiches debout, à gauche -->
  <g stroke="{{deep}}" stroke-width="2">
    <rect x="360" y="400" width="26" height="90" fill="{{light}}"/>
    <rect x="392" y="418" width="26" height="72" fill="{{pale}}"/>
    <rect x="424" y="392" width="26" height="98" fill="{{light}}"/>
  </g>
  <g fill="{{soft}}" stroke="{{deep}}" stroke-width="2">
    <ellipse cx="373" cy="400" rx="13" ry="4"/><ellipse cx="405" cy="418" rx="13" ry="4"/><ellipse cx="437" cy="392" rx="13" ry="4"/>
  </g>
  <!-- Silhouette lointaine -->
  <use href="#man" transform="translate(250 490) scale(0.42)"/>
</svg>
