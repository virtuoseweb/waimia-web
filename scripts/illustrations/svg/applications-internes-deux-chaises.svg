<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Application interne : développer ou acheter ? » : à gauche, une chaise à moitié assemblée sur l'établi ; à droite, un fauteuil tout prêt sur un présentoir ; une personne hésite entre les deux.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="880" cy="506" rx="400" ry="22" fill="{{ground}}"/>
  <!-- établi et chaise en cours -->
  <rect x="540" y="398" width="300" height="16" fill="{{deep}}"/>
  <rect x="556" y="414" width="12" height="86" fill="{{deep}}"/><rect x="812" y="414" width="12" height="86" fill="{{deep}}"/>
  <rect x="556" y="456" width="268" height="8" fill="{{mid}}"/>
  <rect x="604" y="330" width="100" height="14" fill="{{shadow}}"/>
  <rect x="686" y="250" width="14" height="94" fill="{{shadow}}"/>
  <rect x="608" y="344" width="12" height="54" fill="{{shadow}}"/>
  <rect x="724" y="388" width="70" height="10" fill="{{mid}}" transform="rotate(-6 760 393)"/>
  <rect x="724" y="378" width="84" height="10" fill="{{shadow}}" transform="rotate(3 766 383)"/>
  <!-- présentoir et fauteuil prêt (bleu) -->
  <rect x="1020" y="414" width="200" height="86" fill="{{soft}}"/>
  <rect x="1008" y="402" width="224" height="14" fill="{{mid}}"/>
  <g fill="{{subject}}">
    <rect x="1050" y="318" width="132" height="34" rx="8"/>
    <rect x="1156" y="196" width="34" height="156" rx="10"/>
    <rect x="1040" y="282" width="80" height="16" rx="6"/><rect x="1048" y="296" width="14" height="24"/>
    <rect x="1058" y="352" width="14" height="50"/><rect x="1166" y="352" width="14" height="50"/>
  </g>
  <!-- la personne entre les deux, main au menton -->
  <use href="#man" fill="{{shadow}}" transform="translate(918 500) scale(2)"/>
  <path d="M934 346 L944 360 L932 322" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
