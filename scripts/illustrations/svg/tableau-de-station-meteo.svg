<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Tableau de bord PME : les données qui comptent » : une petite station météo. L'abri
       à instruments (subject = bleu) sur ses pieds, un pluviomètre, et l'observateur qui relève
       quelques mesures dans son carnet.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <circle cx="960" cy="260" r="150" fill="{{shape}}"/>
  <ellipse cx="860" cy="506" rx="370" ry="22" fill="{{ground}}"/>
  <ellipse cx="960" cy="502" rx="100" ry="7" fill="{{soft}}"/>
  <!-- L'abri à instruments -->
  <rect x="900" y="380" width="12" height="120" fill="{{deep}}"/>
  <rect x="1008" y="380" width="12" height="120" fill="{{deep}}"/>
  <rect x="900" y="440" width="120" height="7" fill="{{deep}}"/>
  <rect x="880" y="240" width="160" height="142" fill="{{subject}}"/>
  <rect x="880" y="252" width="160" height="4" fill="{{detail}}"/><rect x="880" y="265" width="160" height="4" fill="{{detail}}"/><rect x="880" y="278" width="160" height="4" fill="{{detail}}"/><rect x="880" y="291" width="160" height="4" fill="{{detail}}"/><rect x="880" y="304" width="160" height="4" fill="{{detail}}"/><rect x="880" y="317" width="160" height="4" fill="{{detail}}"/><rect x="880" y="330" width="160" height="4" fill="{{detail}}"/><rect x="880" y="343" width="160" height="4" fill="{{detail}}"/><rect x="880" y="356" width="160" height="4" fill="{{detail}}"/><rect x="880" y="369" width="160" height="4" fill="{{detail}}"/><rect x="955" y="240" width="10" height="142" fill="{{deep}}"/>
  <path d="M866 242 L1054 242 L1040 214 L880 214 Z" fill="{{deep}}"/>
  <!-- Pluviomètre -->
  <rect x="1132" y="440" width="34" height="60" fill="{{soft}}"/>
  <path d="M1124 430 L1174 430 L1164 446 L1134 446 Z" fill="{{deep}}"/>
  <!-- L'observateur et son carnet -->
  <use href="#man" transform="translate(760 500) scale(2 2)"/>
  <path d="M776 344 L796 372 L808 366" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="800" y="342" width="30" height="38" fill="{{light}}" stroke="{{shadow}}" stroke-width="4" transform="rotate(-10 815 361)"/>
</svg>
