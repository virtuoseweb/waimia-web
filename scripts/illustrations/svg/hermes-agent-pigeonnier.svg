<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Hermes Agent, l'agent open source » : un pigeonnier ouvert sur pilotis.
       Un homme lâche un pigeon voyageur ; d'autres décrivent une boucle dans le ciel et l'un
       revient se poser sur la planche d'envol : l'agent part, rapporte, apprend le chemin.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 600 et 1140. Rôles : shape = le pigeonnier, subject = ouvertures et pigeons ;
       silhouette en {{shadow}}. -->
  <defs>
    <g id="vol"><ellipse cx="0" cy="0" rx="14" ry="6" fill="{{subject}}"/><circle cx="12" cy="-3" r="5" fill="{{subject}}"/><path d="M-12 -1 L-24 -6 L-22 4 Z" fill="{{subject}}"/><path d="M-4 -3 L6 -24 L10 -2 Z" fill="{{subject}}"/></g>
    <g id="pose"><ellipse cx="0" cy="0" rx="12" ry="8" fill="{{subject}}"/><circle cx="10" cy="-8" r="5" fill="{{subject}}"/><path d="M-10 0 L-22 6 L-12 6 Z" fill="{{subject}}"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="880" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="980" cy="502" rx="150" ry="8" fill="{{shape}}"/>
  <ellipse cx="640" cy="502" rx="36" ry="6" fill="{{shape}}"/>
  <!-- Pilotis et croisillons -->
  <g fill="{{deep}}">
    <rect x="886" y="360" width="12" height="142"/>
    <rect x="1066" y="360" width="12" height="142"/>
  </g>
  <path d="M892 380 L1072 480 M1072 380 L892 480" stroke="{{deep}}" stroke-width="6"/>
  <!-- Le pigeonnier -->
  <path d="M846 236 L982 160 L1118 236 Z" fill="{{subject}}"/>
  <rect x="862" y="236" width="240" height="124" fill="{{shape}}"/>
  <path d="M884 340 L884 306 Q900 288 916 306 L916 340 Z" fill="{{subject}}"/><path d="M940 340 L940 306 Q956 288 972 306 L972 340 Z" fill="{{subject}}"/><path d="M996 340 L996 306 Q1012 288 1028 306 L1028 340 Z" fill="{{subject}}"/><path d="M1052 340 L1052 306 Q1068 288 1084 306 L1084 340 Z" fill="{{subject}}"/>
  <rect x="848" y="340" width="268" height="10" fill="{{deep}}"/>
  <use href="#pose" transform="translate(1100 332) scale(0.9)"/>
  <use href="#pose" transform="translate(864 332) scale(-0.9 0.9)"/>
  <!-- Boucle de vol, pointillée -->
  <path d="M700 250 Q760 110 920 104 Q1080 100 1100 170" fill="none" stroke="{{soft}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <use href="#vol" transform="translate(760 170) rotate(-30)"/>
  <use href="#vol" transform="translate(900 108) rotate(-4) scale(0.9)"/>
  <use href="#vol" transform="translate(1066 132) rotate(26) scale(0.95)"/>
  <!-- L'homme lâche un pigeon, bras levés -->
  <g transform="translate(640 500) scale(2.1)">
    <g fill="{{shadow}}">
      <rect x="-9" y="-44" width="8" height="42"/>
      <rect x="1" y="-44" width="8" height="42"/>
      <rect x="-10" y="-3" width="10" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="12" height="3" rx="1.5"/>
      <path d="M-12 -82 Q0 -86 12 -82 L14 -42 L-14 -42 Z"/>
      <circle cx="1" cy="-92" r="7.5"/>
      <path d="M-6 -97 Q2 -103 9 -96 L8 -93 L-6 -94 Z"/>
    </g>
    <path d="M9 -80 L18 -96 L24 -114" fill="none" stroke="{{shadow}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <use href="#vol" transform="translate(700 252) rotate(-50) scale(0.9)"/>
</svg>
