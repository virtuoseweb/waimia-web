<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · lot IMG1 · une silhouette secoue un grand tamis sur un cadre ; dessous, trois tas de pierres triées par taille -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
    <g id="reacher">
      <use href="#woman"/>
      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pusher">
      <circle cx="10" cy="-86" r="7.5" fill="{{subject}}"/>
      <path d="M-6 -78 Q4 -82 14 -76 L4 -42 L-18 -44 Z" fill="{{subject}}"/>
      <rect x="2" y="-74" width="34" height="6" rx="3" fill="{{subject}}" transform="rotate(8 2 -74)"/>
      <path d="M-18 -44 L-4 -44 L-14 -2 L-26 -2 Z" fill="{{subject}}"/>
      <path d="M-6 -44 L6 -44 L14 -2 L2 -2 Z" fill="{{subject}}"/>
      <rect x="-30" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="2" y="-3" width="12" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="728" cy="250" r="210" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <g stroke="{{subject}}" stroke-width="9"><line x1="560" y1="300" x2="540" y2="500"/><line x1="900" y1="300" x2="920" y2="500"/></g>
  <path d="M520 296 L940 296 L920 330 L540 330 Z" fill="{{subject}}"/>
  <g stroke="{{detail}}" stroke-width="3"><line x1="560" y1="300" x2="560" y2="326"/><line x1="590" y1="300" x2="590" y2="326"/><line x1="620" y1="300" x2="620" y2="326"/><line x1="650" y1="300" x2="650" y2="326"/><line x1="680" y1="300" x2="680" y2="326"/><line x1="710" y1="300" x2="710" y2="326"/><line x1="740" y1="300" x2="740" y2="326"/><line x1="770" y1="300" x2="770" y2="326"/><line x1="800" y1="300" x2="800" y2="326"/><line x1="830" y1="300" x2="830" y2="326"/><line x1="860" y1="300" x2="860" y2="326"/><line x1="890" y1="300" x2="890" y2="326"/></g>
  <g fill="{{detail}}"><circle cx="640" cy="286" r="12"/><circle cx="700" cy="282" r="16"/><circle cx="780" cy="288" r="10"/><circle cx="830" cy="280" r="18"/></g>
  <g fill="{{subject}}">
    <circle cx="640" cy="370" r="5"/><circle cx="700" cy="400" r="4"/><circle cx="760" cy="440" r="5"/><circle cx="820" cy="380" r="4"/>
    <path d="M620 500 Q700 470 780 500 Z"/>
  </g>
  <path d="M260 500 Q300 440 340 450 Q380 420 420 460 Q450 470 460 500 Z" fill="{{subject}}"/>
  <g fill="{{detail}}"><circle cx="1040" cy="486" r="16"/><circle cx="1076" cy="490" r="12"/><circle cx="1058" cy="464" r="12"/><circle cx="1100" cy="488" r="9"/></g>
  <use href="#reacher" transform="translate(500 500) scale(1.3)"/>

</svg>
