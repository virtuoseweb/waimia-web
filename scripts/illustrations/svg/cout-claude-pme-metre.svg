<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · cout-integration-claude-pme · un mètre ruban géant déroulé le long de trois blocs de tailles différentes, deux silhouettes mesurent -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
    <g id="reacher">
      <use href="#woman"/>
      <rect x="-3" y="-120" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(40 0 -80)"/>
    </g>
    <g id="pointer">
      <use href="#man"/>
      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="860" cy="290" r="240" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect x="520" y="340" width="150" height="130" fill="{{subject}}"/>
  <rect x="690" y="270" width="190" height="200" fill="{{subject}}"/>
  <rect x="900" y="210" width="230" height="260" fill="{{subject}}"/>
  <rect x="540" y="360" width="110" height="10" fill="{{detail}}"/><rect x="710" y="290" width="150" height="10" fill="{{detail}}"/><rect x="920" y="230" width="190" height="10" fill="{{detail}}"/>
  <rect x="130" y="330" width="250" height="150" rx="40" fill="{{subject}}"/>
  <circle cx="255" cy="405" r="48" fill="{{detail}}"/><circle cx="255" cy="405" r="16" fill="{{subject}}"/>
  <rect x="360" y="468" width="960" height="26" fill="{{light}}"/>
  <path d="M400 468 v14 M440 468 v14 M480 468 v14 M520 468 v14 M560 468 v14 M600 468 v14 M640 468 v14 M680 468 v14 M720 468 v14 M760 468 v14 M800 468 v14 M840 468 v14 M880 468 v14 M920 468 v14 M960 468 v14 M1000 468 v14 M1040 468 v14 M1080 468 v14 M1120 468 v14 M1160 468 v14 M1200 468 v14 M1240 468 v14 M1280 468 v14" stroke="{{subject}}" stroke-width="3" fill="none"/>
  <path d="M400 468 v26 M600 468 v26 M800 468 v26 M1000 468 v26 M1200 468 v26" stroke="{{subject}}" stroke-width="5" fill="none"/>
  <rect x="1316" y="462" width="14" height="38" fill="{{subject}}"/>
  <use href="#reacher" transform="translate(1250 560) scale(1.15)"/>
  <use href="#pointer" transform="translate(470 560) scale(1.15)"/>

</svg>
