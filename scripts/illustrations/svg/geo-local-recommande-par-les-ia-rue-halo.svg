<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « être celui qu'on recommande près de chez soi » (GEO local) : une rue de
       petites boutiques sur l'horizon ; une seule, devant un grand soleil bas, porte un store
       et une porte de couleur ; un chemin clair y mène et de petites silhouettes y marchent.
       Rôles remplacés par render-svg.mjs (detail = l'élément à remarquer). -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="0" cy="-99" r="5" fill="{{subject}}"/>
      <path d="M-10 -80 Q0 -84 10 -80 L11 -56 L-11 -56 Z" fill="{{subject}}"/>
      <path d="M-12 -57 L12 -57 L10 -22 L-10 -22 Z" fill="{{subject}}"/>
      <rect x="-7" y="-23" width="5" height="21" fill="{{subject}}"/>
      <rect x="2" y="-23" width="5" height="21" fill="{{subject}}"/>
      <rect x="-9" y="-3" width="8" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1" y="-3" width="8" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="440"/></clipPath>
  </defs>

  <!-- Grand fond uni et soleil bas derrière la boutique recommandée -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="760" cy="440" r="235" fill="{{shape}}" clip-path="url(#sky)"/>

  <!-- Sol -->
  <rect y="440" width="1456" height="184" fill="{{ground}}"/>

  <!-- Rangée de boutiques sur l'horizon, toutes semblables -->
  <g fill="{{subject}}">
    <rect x="250" y="372" width="74" height="68"/><path d="M244 372 L287 340 L330 372 Z"/>
    <rect x="336" y="388" width="62" height="52"/>
    <rect x="410" y="360" width="80" height="80"/><path d="M404 360 L450 330 L496 360 Z"/>
    <rect x="502" y="380" width="66" height="60"/>
    <rect x="580" y="366" width="84" height="74"/>
    <rect x="852" y="370" width="78" height="70"/><path d="M846 370 L891 338 L936 370 Z"/>
    <rect x="942" y="386" width="64" height="54"/>
    <rect x="1018" y="362" width="82" height="78"/>
    <rect x="1112" y="378" width="70" height="62"/><path d="M1106 378 L1147 348 L1188 378 Z"/>
    <rect x="1194" y="392" width="58" height="48"/>
  </g>
  <!-- Fenêtres claires des boutiques voisines -->
  <g fill="{{soft}}">
    <rect x="272" y="400" width="14" height="16"/><rect x="430" y="388" width="16" height="18"/>
    <rect x="602" y="392" width="16" height="18"/><rect x="636" y="392" width="16" height="18"/>
    <rect x="874" y="398" width="14" height="16"/><rect x="1040" y="390" width="16" height="18"/>
    <rect x="1132" y="404" width="14" height="16"/>
  </g>

  <!-- La boutique recommandée : un peu plus haute, store, vitrine et porte de couleur -->
  <rect x="676" y="318" width="164" height="122" fill="{{subject}}"/>
  <path d="M668 318 L758 268 L848 318 Z" fill="{{subject}}"/>
  <path d="M664 352 L852 352 L862 392 L654 392 Z" fill="{{detail}}"/>
  <g fill="{{subject}}">
    <circle cx="676" cy="392" r="10"/><circle cx="706" cy="392" r="10"/><circle cx="736" cy="392" r="10"/>
    <circle cx="766" cy="392" r="10"/><circle cx="796" cy="392" r="10"/><circle cx="826" cy="392" r="10"/>
  </g>
  <rect x="690" y="404" width="70" height="30" fill="{{detail}}"/>
  <rect x="776" y="398" width="40" height="42" fill="{{detail}}"/>

  <!-- Chemin clair qui mène à la porte -->
  <path d="M780 440 L812 440 L1010 624 L640 624 Z" fill="{{light}}"/>

  <!-- Petites silhouettes, de dos, qui marchent vers la boutique -->
  <use href="#man" transform="translate(800 470) scale(0.62)"/>
  <use href="#woman" transform="translate(846 532) scale(0.95)"/>
  <use href="#man" transform="translate(780 612) scale(1.35)"/>

  <!-- Traits du sol -->
  <g fill="{{mid}}">
    <rect x="80" y="500" width="200" height="3"/><rect x="330" y="560" width="210" height="3"/>
    <rect x="1080" y="520" width="190" height="3"/><rect x="1150" y="590" width="170" height="3"/>
    <rect x="140" y="600" width="140" height="3"/>
  </g>
</svg>
