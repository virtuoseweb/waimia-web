      <rect x="-3" y="-118" width="6" height="40" rx="3" fill="{{subject}}" transform="rotate(-38 0 -78)"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="560" cy="250" r="250" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <circle cx="560" cy="190" r="82" fill="{{subject}}"/>
  <circle cx="560" cy="190" r="40" fill="{{shape}}"/>
  <rect x="548" y="260" width="24" height="230" fill="{{subject}}"/>
  <rect x="572" y="396" width="46" height="18" fill="{{subject}}"/><rect x="572" y="432" width="32" height="18" fill="{{subject}}"/>
  <rect x="500" y="486" width="120" height="16" fill="{{deep}}"/>
  <rect x="880" y="310" width="300" height="190" fill="{{subject}}"/>
  <path d="M858 310 L1030 200 L1202 310 Z" fill="{{subject}}"/>
  <rect x="1004" y="400" width="52" height="100" fill="{{detail}}"/>
  <rect x="916" y="350" width="56" height="44" fill="{{detail}}"/><rect x="1088" y="350" width="56" height="44" fill="{{detail}}"/>
  <rect x="1000" y="500" width="60" height="8" fill="{{deep}}"/>
  <use href="#pointer" transform="translate(400 512) scale(1.35)"/>
