<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « L'iconographie IA, un théâtre » : un castelet où une marionnette gesticule devant deux spectateurs assis ; à côté, une personne mesure calmement une caisse sur une table, règle en main.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution creme-aere ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="back"><circle cx="0" cy="-62" r="8"/><path d="M-14 -50 Q0 -56 14 -50 L15 -16 L-15 -16 Z"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="660" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <!-- castelet -->
  <rect x="340" y="226" width="240" height="274" fill="{{shape}}"/>
  <rect x="372" y="262" width="176" height="104" fill="{{subject}}"/>
  <path d="M372 262 L414 262 Q396 310 410 366 L372 366 Z" fill="{{detail}}"/>
  <path d="M548 262 L506 262 Q524 310 510 366 L548 366 Z" fill="{{detail}}"/>
  <rect x="328" y="200" width="264" height="28" fill="{{detail}}"/>
  <g fill="{{detail}}"><circle cx="350" cy="228" r="11"/><circle cx="394" cy="228" r="11"/><circle cx="438" cy="228" r="11"/><circle cx="482" cy="228" r="11"/><circle cx="526" cy="228" r="11"/><circle cx="570" cy="228" r="11"/></g>
  <rect x="356" y="366" width="208" height="10" fill="{{detail}}"/>
  <!-- marionnette, bras levés -->
  <circle cx="460" cy="300" r="13" fill="{{light}}"/>
  <path d="M440 366 L460 316 L480 366 Z" fill="{{light}}"/>
  <path d="M452 326 L430 296 M468 326 L490 296" stroke="{{light}}" stroke-width="6" stroke-linecap="round"/>
  <path d="M448 290 L460 270 L472 290 Z" fill="{{light}}"/>
  <!-- spectateurs assis, de dos -->
  <use href="#back" fill="{{shadow}}" transform="translate(420 498) scale(1.8)"/>
  <use href="#back" fill="{{shadow}}" transform="translate(500 498) scale(1.8)"/>
  <rect x="388" y="468" width="146" height="12" fill="{{subject}}"/>
  <rect x="396" y="480" width="8" height="20" fill="{{subject}}"/><rect x="518" y="480" width="8" height="20" fill="{{subject}}"/>
  <!-- la mesure : table, caisse, règle -->
  <rect x="730" y="400" width="200" height="14" fill="{{deep}}"/>
  <rect x="742" y="414" width="10" height="86" fill="{{deep}}"/><rect x="908" y="414" width="10" height="86" fill="{{deep}}"/>
  <rect x="770" y="330" width="96" height="70" fill="{{shape}}"/>
  <rect x="770" y="356" width="96" height="6" fill="{{detail}}"/>
  <rect x="764" y="318" width="160" height="8" fill="{{subject}}"/>
  <g fill="{{light}}"><rect x="790" y="318" width="3" height="5"/><rect x="820" y="318" width="3" height="5"/><rect x="850" y="318" width="3" height="5"/><rect x="880" y="318" width="3" height="5"/></g>
  <use href="#man" fill="{{shadow}}" transform="translate(966 500) scale(-2 2)"/>
  <path d="M950 346 L936 340 L920 324" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
