<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Saisie automatique des factures » : trois pièces épinglées sur un grand
       panneau lumineux, comme des radios sur un négatoscope. Deux sont nettes, la troisième,
       un scan de travers aux lignes effacées, est désignée du bout d'une baguette par une
       personne qui relit. Chaque pièce se lit autrement ; il reste à vérifier.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sujet entre x 300 et 1250. Rôles remplacés par render-svg.mjs (subject = le panneau,
       detail = traits des pièces) ; la silhouette reste en {{shadow}}. -->
  <defs>
    <g id="woman"><circle cx="0" cy="-90" r="7" fill="{{shadow}}"/><circle cx="-5" cy="-96" r="5" fill="{{shadow}}"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{shadow}}"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{shadow}}"/><rect x="-6" y="-25" width="4" height="23" fill="{{shadow}}"/><rect x="2" y="-25" width="4" height="23" fill="{{shadow}}"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z" fill="{{shadow}}"/></g>
    <!-- Une pièce nette : en-tête, lignes, total -->
    <g id="piece">
      <rect x="0" y="0" width="132" height="186" fill="{{light}}"/>
      <g fill="{{detail}}">
        <rect x="16" y="18" width="46" height="12"/>
        <rect x="16" y="56" width="100" height="7"/>
        <rect x="16" y="76" width="100" height="7"/>
        <rect x="16" y="96" width="100" height="7"/>
        <rect x="16" y="116" width="100" height="7"/>
        <rect x="72" y="150" width="44" height="12"/>
      </g>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Toute la scène décalée vers la gauche : elle tient dans le recadrage 16:9 centré des
       cartes (x 174 à 1282) et évite le chapô du hero (x < 150). -->
  <g transform="translate(-130 0)">

  <!-- Sol local, sans toucher les bords -->
  <ellipse cx="1020" cy="506" rx="390" ry="22" fill="{{ground}}"/>
  <ellipse cx="1050" cy="502" rx="300" ry="8" fill="{{shape}}"/>
  <ellipse cx="688" cy="502" rx="40" ry="6" fill="{{shape}}"/>

  <!-- Pieds du panneau -->
  <g fill="{{deep}}">
    <rect x="806" y="404" width="12" height="98"/>
    <rect x="1282" y="404" width="12" height="98"/>
    <rect x="786" y="496" width="52" height="7" rx="3"/>
    <rect x="1262" y="496" width="52" height="7" rx="3"/>
  </g>

  <!-- Le panneau lumineux : cadre et surface éclairée -->
  <rect x="752" y="140" width="596" height="272" rx="6" fill="{{deep}}"/>
  <rect x="764" y="152" width="572" height="248" fill="{{subject}}"/>

  <!-- Deux pièces nettes (facture électronique, PDF) -->
  <use href="#piece" transform="translate(992 184)"/>
  <use href="#piece" transform="translate(1172 184)"/>
  <!-- La troisième : un scan de travers, papier terne, lignes effacées par endroits -->
  <g transform="rotate(-5 878 277)">
    <rect x="812" y="184" width="132" height="186" fill="{{pale}}"/>
    <g fill="{{mid}}">
      <rect x="828" y="202" width="46" height="12"/>
      <rect x="828" y="240" width="62" height="7"/>
      <rect x="900" y="240" width="28" height="7"/>
      <rect x="828" y="260" width="100" height="7"/>
      <rect x="828" y="280" width="40" height="7"/>
      <rect x="828" y="300" width="100" height="7"/>
      <rect x="884" y="334" width="44" height="12"/>
    </g>
    <path d="M812 226 L944 214" stroke="{{soft}}" stroke-width="4"/>
  </g>
  <!-- Punaises -->
  <g fill="{{shadow}}">
    <circle cx="876" cy="182" r="5"/>
    <circle cx="1058" cy="180" r="5"/>
    <circle cx="1238" cy="180" r="5"/>
  </g>

  <!-- La personne qui relit, baguette pointée sur la ligne effacée du scan -->
  <use href="#woman" transform="translate(688 500) scale(2.1)"/>
  <path d="M697 330 L716 356 L736 352" fill="none" stroke="{{shadow}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M734 352 L868 286" stroke="{{shadow}}" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
