<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « l'IA rapproche, l'humain approuve » : deux grandes feuilles debout
       devant un disque de lumière, la facture posée sur le bon de commande ; leurs lignes se
       répondent d'une feuille à l'autre, sauf une, décalée, que marque un onglet. À l'écart,
       un double de la facture porte aussi un onglet. Une personne, de profil, montre l'écart.
       Distribution prévue : touche-bleue (onglets = {{detail}}). Focal dans x 580 → 1070. -->
  <defs>
    <!-- Silhouette de profil tournée vers la gauche, sans col (elle regarde les feuilles) -->
    <g id="man-left">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-6 -95 Q2 -101 8 -93 L8 -88 Q3 -93 -4 -92 Z" fill="{{subject}}"/>
      <path d="M-10 -80 Q0 -84 10 -80 L12 -42 L-12 -42 Z" fill="{{subject}}"/>
      <rect x="-10.5" y="-44" width="9" height="42" fill="{{subject}}"/>
      <rect x="1.5" y="-44" width="9" height="42" fill="{{subject}}"/>
      <rect x="-15" y="-3" width="13" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="-3" y="-3" width="13" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="man-point">
      <use href="#man-left"/>
      <!-- bras levé vers l'écart, écarté du corps -->
      <path d="M-6 -79 L-38 -112 L-33 -117 L-1 -86 Z" fill="{{subject}}"/>
      <circle cx="-37" cy="-115" r="3.6" fill="{{subject}}"/>
    </g>
  </defs>

  <!-- Grand fond uni -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Disque de lumière derrière les feuilles (le groupe est décalé de 60 vers la gauche
       pour que le double reste dans le cadrage cover du héros) -->
  <circle cx="740" cy="292" r="214" fill="{{shape}}"/>

  <!-- Sol -->
  <rect y="486" width="1456" height="138" fill="{{ground}}"/>
  <rect y="486" width="1456" height="3" fill="{{soft}}"/>

  <g transform="translate(-60 0)">
  <!-- Ombres portées des feuilles sur le sol -->
  <path d="M640 486 L850 486 L900 506 L690 506 Z" fill="{{soft}}"/>
  <path d="M720 486 L930 486 L988 510 L778 510 Z" fill="{{soft}}"/>

  <!-- Feuille du fond : le bon de commande -->
  <rect x="640" y="122" width="210" height="364" fill="{{pale}}"/>
  <g fill="{{soft}}">
    <rect x="664" y="196" width="56" height="7"/>
    <rect x="664" y="232" width="56" height="7"/>
    <rect x="664" y="268" width="56" height="7"/>
    <rect x="664" y="304" width="56" height="7"/>
    <rect x="664" y="340" width="56" height="7"/>
    <rect x="664" y="376" width="56" height="7"/>
    <rect x="664" y="412" width="56" height="7"/>
    <rect x="664" y="150" width="40" height="12"/>
  </g>

  <!-- Feuille de devant : la facture, posée sur le bon -->
  <rect x="712" y="160" width="8" height="326" fill="{{soft}}"/>
  <rect x="720" y="160" width="210" height="326" fill="{{light}}"/>
  <path d="M900 160 L930 160 L930 190 Z" fill="{{pale}}"/>
  <path d="M900 160 L930 190 L900 190 Z" fill="{{soft}}"/>
  <!-- Lignes alignées sur celles du bon -->
  <g fill="{{soft}}">
    <rect x="744" y="196" width="150" height="7"/>
    <rect x="744" y="232" width="128" height="7"/>
    <rect x="744" y="268" width="150" height="7"/>
    <rect x="744" y="340" width="140" height="7"/>
    <rect x="744" y="376" width="150" height="7"/>
    <rect x="744" y="412" width="112" height="7"/>
    <rect x="744" y="446" width="64" height="12"/>
  </g>
  <!-- La ligne décalée : l'écart -->
  <rect x="750" y="311" width="166" height="21" fill="{{detail}}"/>
  <rect x="758" y="318" width="150" height="7" fill="{{subject}}"/>
  <!-- Onglet sur l'écart -->
  <path d="M922 304 L980 304 L980 340 L922 340 Z" fill="{{detail}}"/>

  <!-- Le double, posé à l'écart, avec son onglet -->
  <g transform="translate(1066 486) rotate(7)">
    <rect x="-46" y="-150" width="92" height="150" fill="{{light}}"/>
    <g fill="{{soft}}">
      <rect x="-36" y="-126" width="64" height="4"/>
      <rect x="-36" y="-110" width="54" height="4"/>
      <rect x="-36" y="-94" width="64" height="4"/>
      <rect x="-36" y="-78" width="60" height="4"/>
      <rect x="-36" y="-62" width="64" height="4"/>
    </g>
    <rect x="8" y="-170" width="46" height="40" fill="{{detail}}"/>
  </g>

  <!-- La personne qui montre l'écart -->
  <use href="#man-point" transform="translate(1000 486) scale(1.12)"/>

  </g>

  <!-- Petit témoin au loin, à gauche -->
  <use href="#man-left" transform="translate(300 560) scale(0.46)"/>
</svg>
