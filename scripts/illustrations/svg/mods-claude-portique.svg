<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « inspecter un mod avant de le laisser entrer » : une haute porte fermée sous un disque ; devant, un portique ; une femme éclaire avec une lampe l’intérieur d’une caisse ouverte qu’un homme présente. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="8" fill="{{subject}}"/>
      <path d="M-10 -82 Q0 -86 10 -82 L11 -48 L-11 -48 Z" fill="{{subject}}"/>
      <path d="M-3 -82 L0 -74 L3 -82 Z" fill="{{light}}"/>
      <rect x="-9" y="-49" width="7" height="47" fill="{{subject}}"/>
      <rect x="2" y="-49" width="7" height="47" fill="{{subject}}"/>
      <path d="M-11 -3 L-1 -3 L-1 0 L-11 0 Z M1 -3 L11 -3 L11 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="728" cy="250" r="230" fill="{{shape}}"/>
  <rect y="530" width="1456" height="94" fill="{{ground}}"/>
  <rect y="524" width="1456" height="8" fill="{{deep}}"/>
  <!-- haute porte -->
  <rect x="628" y="120" width="200" height="408" fill="{{shadow}}"/>
  <rect x="644" y="136" width="80" height="392" fill="{{deep}}"/>
  <rect x="732" y="136" width="80" height="392" fill="{{deep}}"/>
  <circle cx="716" cy="340" r="7" fill="{{light}}"/><circle cx="740" cy="340" r="7" fill="{{light}}"/>
  <!-- portique -->
  <rect x="470" y="330" width="16" height="200" fill="{{shadow}}"/>
  <rect x="970" y="330" width="16" height="200" fill="{{shadow}}"/>
  <rect x="470" y="318" width="516" height="16" fill="{{shadow}}"/>
  <!-- caisse ouverte -->
  <rect x="380" y="470" width="110" height="60" fill="{{shadow}}"/>
  <path d="M380 470 L350 430 L460 430 L490 470 Z" fill="{{deep}}"/>
  <g fill="{{light}}"><rect x="396" y="456" width="18" height="18"/><rect x="420" y="450" width="18" height="24"/><rect x="446" y="458" width="18" height="16"/></g>
  <use href="#man" transform="translate(330 530) scale(1)"/>
  <!-- femme avec lampe et faisceau -->
  <path d="M540 410 L470 446 L470 480 Z" fill="{{light}}" opacity="0.9"/>
  <use href="#woman" transform="translate(560 530) scale(1)"/>
  <rect x="538" y="404" width="14" height="10" fill="{{detail}}"/>
  <!-- au loin, une petite file d'attente -->
  <use href="#man" transform="translate(150 530) scale(0.7)"/>
  <use href="#woman" transform="translate(185 530) scale(0.68)"/>
  <use href="#man" transform="translate(1200 530) scale(0.75)"/>
</svg>
