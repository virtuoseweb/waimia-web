<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Refonte de site et SEO » : un jardinier déplace un arbre sur un diable, motte emballée,
       depuis son ancien trou vers une nouvelle fosse déjà creusée : la plantation change de
       place sans perdre ses racines.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="840" cy="506" rx="390" ry="22" fill="{{ground}}"/>
  <ellipse cx="786" cy="502" rx="70" ry="7" fill="{{soft}}"/>
  <!-- Ancien emplacement -->
  <ellipse cx="510" cy="497" rx="38" ry="7" fill="{{deep}}"/>
  <path d="M548 500 Q566 478 588 500 Z" fill="{{soft}}"/>
  <!-- Nouvelle fosse, terre et bêche -->
  <ellipse cx="1076" cy="497" rx="62" ry="10" fill="{{deep}}"/>
  <path d="M1140 500 Q1176 452 1214 500 Z" fill="{{soft}}"/>
  <path d="M1160 492 L1196 378" fill="none" stroke="{{deep}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1150 476 L1172 482 L1166 504 L1146 498 Z" fill="{{deep}}"/>
  <!-- Le diable -->
  <path d="M690 352 L752 466" fill="none" stroke="{{deep}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="742" y="462" width="92" height="9" fill="{{deep}}"/>
  <circle cx="770" cy="480" r="20" fill="{{shadow}}"/>
  <circle cx="770" cy="480" r="6" fill="{{light}}"/>
  <!-- L'arbre : motte emballée, tronc, houppier -->
  <circle cx="790" cy="424" r="40" fill="{{deep}}"/>
  <path d="M754 410 Q790 430 826 410 M760 440 Q790 452 822 440" fill="none" stroke="{{detail}}" stroke-width="4"/>
  <rect x="782" y="290" width="16" height="100" fill="{{shadow}}"/>
  <g fill="{{shape}}"><circle cx="790" cy="222" r="86"/><circle cx="728" cy="272" r="56"/><circle cx="856" cy="268" r="60"/></g>
  <g fill="{{detail}}"><circle cx="760" cy="190" r="11"/><circle cx="822" cy="230" r="9"/><circle cx="742" cy="268" r="8"/><circle cx="870" cy="282" r="10"/></g>
  <!-- Le jardinier -->
  <use href="#man" transform="translate(640 500) scale(2 2)"/>
  <path d="M656 344 L676 360 L692 354" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
