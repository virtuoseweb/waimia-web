<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour organisme de formation » : une leçon de natation. La formatrice, planchette à la
       main, sur la margelle ; trois apprenants nagent chacun dans sa ligne, et la ligne d'eau du
       fond marque la limite (ground = bassin bleu).
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <!-- Grande forme : disque derrière la scène -->
  <circle cx="930" cy="276" r="150" fill="{{shape}}"/>
  <!-- Margelle et bassin -->
  <ellipse cx="860" cy="468" rx="368" ry="60" fill="{{pale}}"/>
  <ellipse cx="860" cy="468" rx="330" ry="44" fill="{{ground}}"/>
  <path d="M589.4 444 L1130.6 444" stroke="{{detail}}" stroke-width="6" stroke-dasharray="16 8"/>
  <path d="M537.4 472 L1182.6 472" stroke="{{detail}}" stroke-width="6" stroke-dasharray="16 8"/>
  <path d="M690.3 432 L1029.7 432" stroke="{{shadow}}" stroke-width="5"/>
  <g fill="{{soft}}"><ellipse cx="650" cy="432" rx="10" ry="6"/><ellipse cx="730" cy="432" rx="10" ry="6"/><ellipse cx="810" cy="432" rx="10" ry="6"/><ellipse cx="890" cy="432" rx="10" ry="6"/><ellipse cx="970" cy="432" rx="10" ry="6"/><ellipse cx="1050" cy="432" rx="10" ry="6"/></g>
  <circle cx="800" cy="460" r="10" fill="{{shadow}}"/><path d="M766 464 Q784 434 802 454" fill="none" stroke="{{shadow}}" stroke-width="6" stroke-linecap="round"/><ellipse cx="760" cy="466" rx="9" ry="3" fill="{{detail}}"/>
  <circle cx="960" cy="486" r="10" fill="{{shadow}}"/><path d="M926 490 Q944 460 962 480" fill="none" stroke="{{shadow}}" stroke-width="6" stroke-linecap="round"/><ellipse cx="920" cy="492" rx="9" ry="3" fill="{{detail}}"/>
  <circle cx="1080" cy="458" r="10" fill="{{shadow}}"/><path d="M1046 462 Q1064 432 1082 452" fill="none" stroke="{{shadow}}" stroke-width="6" stroke-linecap="round"/><ellipse cx="1040" cy="464" rx="9" ry="3" fill="{{detail}}"/>
  <!-- La formatrice sur la margelle -->
  <use href="#woman" transform="translate(500 470) scale(2.1 2.1)"/>
  <rect x="520" y="336" width="34" height="44" fill="{{light}}" stroke="{{shadow}}" stroke-width="4"/>
  <path d="M512 308 L530 340" fill="none" stroke="{{shadow}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
