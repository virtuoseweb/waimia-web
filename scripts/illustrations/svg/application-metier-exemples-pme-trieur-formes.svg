<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « une application faite pour un métier » : un grand panneau percé de trois
       ouvertures de formes différentes (rond, carré, triangle), chacune à sa hauteur. Une
       femme vient d'enfoncer le disque dans le rond ; un homme pousse un bloc carré dans le
       carré ; un troisième arrive avec le triangle. Chaque service a la pièce taillée pour
       son ouverture. Rôles remplacés par render-svg.mjs (shape = le panneau, detail = les
       pièces). -->

  <!-- Grand fond uni -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Sol -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <!-- Ombre portée du panneau sur le sol -->
  <path d="M640 470 L1250 470 L1300 502 L690 502 Z" fill="{{soft}}"/>

  <!-- Le panneau : face avant, dessus et flanc droit (épaisseur) -->
  <path d="M664 194 L1274 194 L1250 210 L640 210 Z" fill="{{pale}}"/>
  <path d="M1250 210 L1274 194 L1274 456 L1250 470 Z" fill="{{deep}}"/>
  <rect x="640" y="210" width="610" height="260" fill="{{shape}}"/>

  <!-- Ouverture ronde (haute, à gauche) : déjà remplie par son disque -->
  <circle cx="760" cy="300" r="48" fill="{{deep}}"/>
  <circle cx="762" cy="302" r="42" fill="{{detail}}"/>

  <!-- Ouverture carrée (basse, au centre) : profondeur sur les parois haut et gauche -->
  <rect x="904" y="320" width="92" height="92" fill="{{deep}}"/>
  <path d="M904 320 L996 320 L996 332 L916 332 L916 412 L904 412 Z" fill="{{shadow}}"/>

  <!-- Ouverture triangulaire (mi-hauteur, à droite) : encore vide -->
  <path d="M1140 262 L1194 356 L1086 356 Z" fill="{{deep}}"/>
  <path d="M1140 262 L1150 280 L1100 356 L1086 356 Z" fill="{{shadow}}"/>

  <!-- Le bloc carré, sorti à moitié de son ouverture : face, flanc gauche, dessous -->
  <path d="M894 332 L880 344 L880 436 L894 424 Z" fill="{{pale}}"/>
  <path d="M880 436 L894 424 L986 424 L972 436 Z" fill="{{soft}}"/>
  <rect x="894" y="332" width="92" height="92" fill="{{detail}}"/>

  <!-- La femme qui a posé le disque : bras levé, paume contre le bord du disque -->
  <g transform="translate(690 500) scale(1.5)">
    <g fill="{{subject}}">
      <circle cx="0" cy="-90" r="7"/>
      <circle cx="-1" cy="-99" r="5"/>
      <path d="M-10 -80 Q0 -84 10 -80 L11 -56 L-11 -56 Z"/>
      <path d="M-12 -57 L12 -57 L10 -22 L-10 -22 Z"/>
      <rect x="-7" y="-23" width="5" height="21"/>
      <rect x="2" y="-23" width="5" height="21"/>
      <rect x="-9" y="-3" width="8" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="8" height="3" rx="1.5"/>
      <circle cx="25" cy="-101" r="3.5"/>
    </g>
    <g fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 -78 L17 -91 L24 -100"/>
      <path d="M-8 -78 L-11 -58"/>
    </g>
  </g>

  <!-- L'homme qui pousse le bloc carré : de profil, les deux bras tendus vers le flanc -->
  <g transform="translate(850 505) scale(1.5)">
    <g fill="{{subject}}">
      <circle cx="0" cy="-90" r="7.5"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
      <path d="M-11 -44 L-1.5 -44 L-9 -2 L-18 -2 Z"/>
      <rect x="2" y="-44" width="9.5" height="42"/>
      <rect x="-21" y="-3" width="12" height="3" rx="1.5"/>
      <rect x="2" y="-3" width="13" height="3" rx="1.5"/>
    </g>
    <g fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 -78 L13 -78 L19 -74"/>
      <path d="M5 -72 L12 -66 L19 -62"/>
    </g>
  </g>

  <!-- L'homme qui arrive avec le triangle, tenu devant lui à la taille -->
  <path d="M618 446 L630 438 L578 348 L566 356 Z" fill="{{pale}}"/>
  <path d="M514 446 L618 446 L566 356 Z" fill="{{detail}}"/>
  <g transform="translate(496 522) scale(1.5)">
    <g fill="{{subject}}">
      <circle cx="1" cy="-90" r="7.5"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
      <path d="M-11 -44 L-1 -44 L-13 -2 L-22 -2 Z"/>
      <path d="M1 -44 L11 -44 L21 -2 L12 -2 Z"/>
      <rect x="-25" y="-3" width="12" height="3" rx="1.5"/>
      <rect x="12" y="-3" width="13" height="3" rx="1.5"/>
    </g>
    <g fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 -77 L14 -74 L30 -78"/>
      <path d="M4 -70 L13 -64 L25 -66"/>
    </g>
  </g>
</svg>
