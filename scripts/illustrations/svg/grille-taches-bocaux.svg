<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Grille des tâches à automatiser » : une étagère de bocaux remplis à des
       niveaux différents, comme les heures que prend chaque tâche. Une femme a retiré le
       plus plein de la rangée et le tient devant elle : c'est par lui qu'on commence.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 470 et 1180. Rôles : subject = le contenu des bocaux ; silhouette en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="830" cy="506" rx="400" ry="22" fill="{{ground}}"/>
  <ellipse cx="944" cy="502" rx="260" ry="8" fill="{{shape}}"/>
  <ellipse cx="560" cy="502" rx="36" ry="6" fill="{{shape}}"/>
  <!-- Étagère -->
  <g fill="{{deep}}">
    <rect x="704" y="298" width="480" height="12"/>
    <rect x="704" y="408" width="480" height="12"/>
    <rect x="712" y="190" width="11" height="312"/>
    <rect x="1166" y="190" width="11" height="312"/>
  </g>
  <rect x="730" y="226" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="734" y="275" width="44" height="19" rx="5" fill="{{subject}}"/><rect x="736" y="216" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="794" y="226" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="798" y="250" width="44" height="44" rx="5" fill="{{subject}}"/><rect x="800" y="216" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="858" y="226" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="862" y="282" width="44" height="12" rx="5" fill="{{subject}}"/><rect x="864" y="216" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="922" y="226" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="926" y="259" width="44" height="35" rx="5" fill="{{subject}}"/><rect x="928" y="216" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="1050" y="226" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="1054" y="269" width="44" height="25" rx="5" fill="{{subject}}"/><rect x="1056" y="216" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="1114" y="226" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="1118" y="255" width="44" height="39" rx="5" fill="{{subject}}"/><rect x="1120" y="216" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="730" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="734" y="372" width="44" height="32" rx="5" fill="{{subject}}"/><rect x="736" y="326" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="794" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="798" y="392" width="44" height="12" rx="5" fill="{{subject}}"/><rect x="800" y="326" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="858" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="862" y="353" width="44" height="51" rx="5" fill="{{subject}}"/><rect x="864" y="326" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="922" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="926" y="382" width="44" height="22" rx="5" fill="{{subject}}"/><rect x="928" y="326" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="986" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="990" y="366" width="44" height="38" rx="5" fill="{{subject}}"/><rect x="992" y="326" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="1050" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="1054" y="395" width="44" height="9" rx="5" fill="{{subject}}"/><rect x="1056" y="326" width="40" height="12" rx="2" fill="{{deep}}"/><rect x="1114" y="336" width="52" height="72" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="1118" y="376" width="44" height="28" rx="5" fill="{{subject}}"/><rect x="1120" y="326" width="40" height="12" rx="2" fill="{{deep}}"/>
  <!-- La femme tient devant elle le bocal le plus plein -->
  <g transform="translate(560 500) scale(2.1)">
    <g fill="{{shadow}}">
      <circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/>
      <rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/>
    </g>
    <path d="M6 -78 L14 -64 L22 -62" fill="none" stroke="{{shadow}}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="600" y="328" width="46" height="64" rx="9" fill="{{pale}}" stroke="{{soft}}" stroke-width="3"/><rect x="604" y="337" width="38" height="51" rx="5" fill="{{subject}}"/><rect x="606" y="318" width="34" height="12" rx="2" fill="{{deep}}"/>
</svg>
