<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « l'ancienne clé ne rentre pas dans la nouvelle porte » :
       une petite silhouette porte une clé géante sur l'épaule devant une haute porte
       sans serrure ; derrière elle, une vieille porte isolée garde sa serrure.
       Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
  </defs>

  <!-- Fond et sol -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1180" cy="150" r="58" fill="{{light}}" opacity="0.5"/>
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <rect y="470" width="1456" height="3" fill="{{deep}}" opacity="0.45"/>

  <!-- Vieille porte isolée, à gauche, avec sa serrure -->
  <rect x="250" y="300" width="96" height="170" fill="{{deep}}"/>
  <rect x="262" y="312" width="72" height="158" fill="{{soft}}"/>
  <circle cx="318" cy="396" r="6" fill="{{deep}}"/>
  <path d="M315 400 L321 400 L323 414 L313 414 Z" fill="{{deep}}"/>
  <path d="M250 470 L346 470 L370 482 L226 482 Z" fill="{{deep}}" opacity="0.25"/>

  <!-- Mur et grande porte neuve, sans serrure -->
  <rect x="640" y="120" width="420" height="350" fill="{{soft}}"/>
  <rect x="640" y="120" width="420" height="12" fill="{{deep}}" opacity="0.25"/>
  <rect x="720" y="150" width="260" height="320" fill="{{shape}}"/>
  <rect x="720" y="150" width="260" height="8" fill="{{deep}}" opacity="0.25"/>
  <rect x="742" y="176" width="216" height="120" fill="{{deep}}" opacity="0.12"/>
  <rect x="742" y="318" width="216" height="130" fill="{{deep}}" opacity="0.12"/>
  <!-- Plaque ronde à plusieurs broches, à la place de la serrure -->
  <circle cx="940" cy="312" r="16" fill="{{light}}"/>
  <g fill="{{deep}}">
    <circle cx="934" cy="306" r="2.5"/><circle cx="946" cy="306" r="2.5"/>
    <circle cx="934" cy="318" r="2.5"/><circle cx="946" cy="318" r="2.5"/>
  </g>
  <path d="M640 470 L1060 470 L1100 492 L600 492 Z" fill="{{deep}}" opacity="0.2"/>

  <!-- La silhouette et la clé géante posée sur l'épaule -->
  <use href="#man" transform="translate(560 470) scale(1.05)"/>
  <g transform="translate(0 10)">
  <g fill="{{detail}}">
    <rect x="470" y="380" width="170" height="11" transform="rotate(-8 555 385)"/>
    <circle cx="452" cy="398" r="30"/>
    <rect x="612" y="362" width="12" height="26" transform="rotate(-8 555 385)"/>
    <rect x="596" y="364" width="10" height="20" transform="rotate(-8 555 385)"/>
  </g>
  <circle cx="452" cy="398" r="13" fill="{{field}}"/>
  </g>
  <!-- Main qui tient la clé -->
  <rect x="548" y="393" width="12" height="7" rx="3" fill="{{subject}}"/>
</svg>
