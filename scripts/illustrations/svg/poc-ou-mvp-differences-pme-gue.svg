<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « tester avant de s'engager » (POC, prototype, MVP, pilote) : une rivière à
       passer à gué ; quatre pierres de plus en plus larges vont d'une rive à l'autre ; une
       silhouette, debout sur la deuxième, avance le pied vers la troisième ; une collègue
       attend sur la rive. Rôles remplacés par render-svg.mjs (ground = la rivière). -->
  <defs>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="0" cy="-99" r="5" fill="{{subject}}"/>
      <path d="M-10 -80 Q0 -84 10 -80 L11 -56 L-11 -56 Z" fill="{{subject}}"/>
      <path d="M-12 -57 L12 -57 L10 -22 L-10 -22 Z" fill="{{subject}}"/>
      <rect x="-7" y="-23" width="5" height="21" fill="{{subject}}"/>
      <rect x="2" y="-23" width="5" height="21" fill="{{subject}}"/>
      <rect x="-9" y="-3" width="8" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1" y="-3" width="8" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="452"/></clipPath>
  </defs>

  <!-- Grand fond uni et soleil bas au centre -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="728" cy="452" r="225" fill="{{shape}}" clip-path="url(#sky)"/>

  <!-- La rivière -->
  <rect y="452" width="1456" height="172" fill="{{ground}}"/>

  <!-- Rive de départ, à gauche, et rive d'arrivée, à droite -->
  <path d="M0 624 L0 414 Q110 404 210 430 Q262 446 290 482 L268 624 Z" fill="{{subject}}"/>
  <path d="M1456 624 L1456 402 Q1340 396 1250 424 Q1196 442 1166 482 L1190 624 Z" fill="{{subject}}"/>

  <!-- Quatre pierres de gué, irrégulières, de plus en plus larges -->
  <g fill="{{subject}}">
    <path d="M372 488 Q370 470 386 466 Q404 462 418 470 Q428 478 424 488 Z"/>
    <path d="M520 492 Q516 470 540 464 Q566 458 590 464 Q610 472 606 492 Z"/>
    <path d="M694 496 Q690 470 718 461 Q756 452 796 460 Q826 470 822 496 Z"/>
    <path d="M920 500 Q916 470 952 458 Q1004 446 1060 455 Q1100 466 1096 500 Z"/>
  </g>

  <!-- Reflets et remous clairs sous les pierres -->
  <g fill="{{detail}}">
    <rect x="364" y="500" width="68" height="4"/><rect x="380" y="512" width="36" height="3"/>
    <rect x="510" y="504" width="106" height="4"/><rect x="532" y="516" width="62" height="3"/>
    <rect x="684" y="508" width="148" height="4"/><rect x="712" y="520" width="92" height="3"/>
    <rect x="908" y="512" width="200" height="4"/><rect x="944" y="524" width="128" height="3"/>
    <rect x="160" y="560" width="120" height="3"/><rect x="420" y="580" width="200" height="3"/>
    <rect x="760" y="572" width="160" height="3"/><rect x="1020" y="596" width="180" height="3"/>
    <rect x="1260" y="560" width="110" height="3"/>
  </g>

  <!-- La silhouette sur la deuxième pierre : pied d'appui, pied tendu vers la troisième -->
  <g transform="translate(560 464) scale(1.6)" fill="{{subject}}">
    <circle cx="0" cy="-90" r="7.5"/>
    <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
    <rect x="-11.5" y="-44" width="9.5" height="42"/>
    <rect x="-13" y="-3" width="11.5" height="3" rx="1.5"/>
    <path d="M2 -44 L11.5 -44 L35 -12 L27 -7 Z"/>
    <rect x="26" y="-12" width="13" height="3" rx="1.5" transform="rotate(-20 32 -10)"/>
    <path d="M8 -81 L15 -77 L32 -57 L28 -51 L9 -66 Z"/>
    <circle cx="30" cy="-53" r="3.5"/>
    <path d="M-8 -81 L-15 -77 L-29 -58 L-25 -52 L-9 -66 Z"/>
    <circle cx="-27" cy="-54" r="3.5"/>
  </g>

  <!-- La collègue qui attend sur la rive de départ -->
  <use href="#woman" transform="translate(130 412) scale(1.2)"/>
</svg>
