<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- duotone terracotta-plein · un énorme robinet sort d'un mur ; une goutte tombe ; une rangée de seaux de tailles différentes ; une silhouette accroupie note le niveau. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>

    <g id="bucket">
      <path d="M-40 -80 L40 -80 L30 0 L-30 0 Z" fill="{{subject}}"/>
      <rect x="-44" y="-86" width="88" height="8" fill="{{subject}}"/>
      <path d="M-38 -84 Q0 -132 38 -84" fill="none" stroke="{{subject}}" stroke-width="3"/>
      <rect x="-33" y="-48" width="66" height="3" fill="{{detail}}"/>
    </g>
  
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <!-- mur -->
  <rect x="0" y="0" width="300" height="520" fill="{{shape}}"/>
  <g fill="{{pale}}">
    <rect x="0" y="80" width="300" height="4"/><rect x="0" y="180" width="300" height="4"/><rect x="0" y="280" width="300" height="4"/><rect x="0" y="380" width="300" height="4"/><rect x="0" y="480" width="300" height="4"/>
  </g>
  <rect x="300" y="0" width="16" height="520" fill="{{deep}}"/>
  <!-- robinet énorme -->
  <rect x="300" y="138" width="40" height="80" fill="{{subject}}"/>
  <rect x="316" y="158" width="290" height="44" fill="{{subject}}"/>
  <path d="M606 158 Q662 158 662 214 L662 252 L618 252 L618 214 Q618 202 606 202 Z" fill="{{subject}}"/>
  <rect x="610" y="252" width="60" height="14" fill="{{subject}}"/>
  <rect x="450" y="112" width="20" height="48" fill="{{subject}}"/>
  <rect x="400" y="98" width="120" height="18" rx="9" fill="{{subject}}"/>
  <rect x="330" y="166" width="260" height="6" fill="{{deep}}"/>
  <!-- goutte qui tombe -->
  <path d="M640 296 Q654 318 652 326 A12 12 0 1 1 628 326 Q626 318 640 296 Z" fill="{{detail}}"/>
  <!-- rangée de seaux de tailles différentes -->
  <use href="#bucket" transform="translate(640 520) scale(1.15)"/>
  <use href="#bucket" transform="translate(790 520) scale(0.8)"/>
  <use href="#bucket" transform="translate(910 520) scale(1.0)"/>
  <use href="#bucket" transform="translate(1030 520) scale(0.6)"/>
  <use href="#bucket" transform="translate(1150 520) scale(1.3)"/>
  <!-- silhouette accroupie, carnet en main, à côté du dernier seau -->
  <g transform="translate(1272 520) scale(1.3)" fill="{{subject}}">
    <circle cx="-4" cy="-68" r="7.5"/>
    <path d="M-12 -58 Q-2 -62 8 -58 L10 -28 L-12 -28 Z"/>
    <path d="M-12 -34 L-36 -34 L-36 -24 L-12 -24 Z"/>
    <rect x="-36" y="-30" width="9" height="28"/>
    <rect x="-40" y="-3" width="14" height="3"/>
    <path d="M-2 -30 L10 -30 L14 -6 L4 -6 Z"/>
    <rect x="4" y="-9" width="28" height="9"/>
  </g>
  <path d="M1264 458 L1238 468" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
  <rect x="1216" y="452" width="20" height="26" fill="{{detail}}" transform="rotate(-10 1226 465)"/>
</svg>
