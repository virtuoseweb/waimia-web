<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour agences de communication » : sur une longue tablette, trois toiles de formats différents portent le même visuel décliné ; une peintre, pinceau en main, ajuste la première.
