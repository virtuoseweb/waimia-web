  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="910" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <rect x="610" y="420" width="610" height="14" fill="{{deep}}"/>
  <rect x="628" y="434" width="10" height="66" fill="{{deep}}"/><rect x="1192" y="434" width="10" height="66" fill="{{deep}}"/>
  <rect x="642" y="226" width="124" height="194" fill="{{deep}}"/><rect x="650" y="234" width="108" height="178" fill="{{light}}"/><circle cx="704" cy="304" r="34" fill="{{subject}}"/><rect x="650" y="346" width="108" height="17" fill="{{mid}}"/>
  <rect x="802" y="264" width="156" height="156" fill="{{deep}}"/><rect x="810" y="272" width="140" height="140" fill="{{light}}"/><circle cx="880" cy="326" r="40" fill="{{subject}}"/><rect x="810" y="361" width="140" height="20" fill="{{mid}}"/>
  <rect x="994" y="306" width="210" height="114" fill="{{deep}}"/><rect x="1002" y="314" width="194" height="98" fill="{{light}}"/><circle cx="1099" cy="352" r="30" fill="{{subject}}"/><rect x="1002" y="377" width="194" height="15" fill="{{mid}}"/>
  <use href="#woman" fill="{{shadow}}" transform="translate(580 500) scale(2.05)"/>
  <path d="M592 342 L610 326 L628 310" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M628 310 L656 292" stroke="{{deep}}" stroke-width="5" stroke-linecap="round"/>

