  <g transform="translate(846 458) scale(1.25)"><rect x="-3" y="-79" width="6" height="38" rx="3" fill="{{subject}}" transform="rotate(10 0 -79)"/><rect x="-3" y="-79" width="6" height="38" rx="3" fill="{{subject}}" transform="rotate(-10 0 -79)"/><use href="#woman"/></g>

