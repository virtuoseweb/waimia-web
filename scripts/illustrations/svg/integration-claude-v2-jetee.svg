  <rect x="68" y="525.1" width="59.5" height="3" fill="{{detail}}"/><rect x="25.5" y="531.05" width="51" height="3" fill="{{detail}}"/><rect x="234" y="596.3" width="73.5" height="3" fill="{{detail}}"/><rect x="181.5" y="603.65" width="63" height="3" fill="{{detail}}"/><rect x="228" y="471.6" width="42" height="3" fill="{{detail}}"/><rect x="198" y="475.8" width="36" height="3" fill="{{detail}}"/><rect x="412" y="550.4" width="63" height="3" fill="{{detail}}"/><rect x="367" y="556.7" width="54" height="3" fill="{{detail}}"/><rect x="472" y="606.9" width="80.5" height="3" fill="{{detail}}"/><rect x="414.5" y="614.95" width="69" height="3" fill="{{detail}}"/><rect x="395.6" y="489.72" width="43.4" height="3" fill="{{detail}}"/><rect x="364.6" y="494.06" width="37.2" height="3" fill="{{detail}}"/>
