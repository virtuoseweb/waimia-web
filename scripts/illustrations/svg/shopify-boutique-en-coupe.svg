<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « Shopify » : une boutique en coupe. À gauche la salle de vente sous son
       auvent (un client, un comptoir), à droite la réserve et ses étagères ; un passe-plat laisse
       passer un carton de l'une à l'autre. Distribution prévue : creme-aere. Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="box">
      <rect x="-18" y="-24" width="36" height="24" fill="{{detail}}"/>
      <rect x="-18" y="-24" width="36" height="24" fill="none" stroke="{{subject}}" stroke-width="2"/>
      <rect x="-3" y="-24" width="6" height="24" fill="{{pale}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Sol -->
  <rect y="490" width="1456" height="134" fill="{{ground}}"/>
  <rect y="490" width="1456" height="3" fill="{{deep}}" opacity="0.6"/>

  <!-- Intérieur : salle de vente (gauche) et réserve (droite) -->
  <rect x="330" y="150" width="400" height="340" fill="{{shape}}"/>
  <rect x="730" y="150" width="410" height="340" fill="{{pale}}"/>
  <!-- Murs et toit -->
  <g fill="{{subject}}">
    <rect x="322" y="142" width="826" height="10"/>
    <rect x="322" y="142" width="10" height="352"/>
    <rect x="1138" y="142" width="10" height="352"/>
    <rect x="724" y="152" width="12" height="150"/>
    <rect x="724" y="344" width="12" height="146"/>
  </g>
  <!-- Auvent à bandes sur la salle de vente -->
  <g>
    <path d="M300 150 L760 150 L760 196 L300 196 Z" fill="{{subject}}"/>
    <g fill="{{light}}">
      <rect x="326" y="150" width="38" height="46"/><rect x="402" y="150" width="38" height="46"/>
      <rect x="478" y="150" width="38" height="46"/><rect x="554" y="150" width="38" height="46"/>
      <rect x="630" y="150" width="38" height="46"/><rect x="706" y="150" width="38" height="46"/>
    </g>
    <g fill="{{subject}}">
      <path d="M300 196 a19 19 0 0 0 38 0 Z"/><path d="M376 196 a19 19 0 0 0 38 0 Z"/>
      <path d="M452 196 a19 19 0 0 0 38 0 Z"/><path d="M528 196 a19 19 0 0 0 38 0 Z"/>
      <path d="M604 196 a19 19 0 0 0 38 0 Z"/><path d="M680 196 a19 19 0 0 0 38 0 Z"/>
    </g>
  </g>

  <!-- Salle de vente : étagère de présentation, comptoir -->
  <g fill="{{subject}}">
    <rect x="350" y="290" width="120" height="6"/><rect x="350" y="360" width="120" height="6"/>
    <rect x="350" y="290" width="6" height="200"/><rect x="464" y="290" width="6" height="200"/>
  </g>
  <use href="#box" transform="translate(385 290)"/><use href="#box" transform="translate(432 290)"/>
  <use href="#box" transform="translate(400 360)"/>
  <use href="#man" transform="translate(600 452) scale(1.05)"/>
  <rect x="540" y="400" width="170" height="90" fill="{{subject}}"/>
  <rect x="540" y="392" width="170" height="10" fill="{{detail}}"/>
  <!-- Caisse -->
  <rect x="650" y="366" width="46" height="26" fill="{{detail}}"/>
  <rect x="658" y="352" width="30" height="16" fill="{{light}}"/>
  <!-- Vendeur derrière le comptoir, client devant -->
  <use href="#man" transform="translate(500 490) scale(0.95)"/>

  <!-- Passe-plat entre les deux pièces, avec un carton en transit -->
  <rect x="716" y="302" width="28" height="42" fill="{{light}}"/>
  <use href="#box" transform="translate(730 336) scale(0.9)"/>

  <!-- Réserve : trois niveaux d'étagères chargés de cartons -->
  <g fill="{{subject}}">
    <rect x="770" y="250" width="330" height="6"/><rect x="770" y="340" width="330" height="6"/><rect x="770" y="430" width="330" height="6"/>
    <rect x="770" y="250" width="6" height="240"/><rect x="934" y="250" width="6" height="240"/><rect x="1094" y="250" width="6" height="240"/>
  </g>
  <g>
    <use href="#box" transform="translate(800 250)"/><use href="#box" transform="translate(850 250)"/><use href="#box" transform="translate(900 250) scale(0.8)"/>
    <use href="#box" transform="translate(970 250) scale(1.2)"/><use href="#box" transform="translate(1030 250)"/>
    <use href="#box" transform="translate(810 340) scale(1.3)"/><use href="#box" transform="translate(880 340)"/>
    <use href="#box" transform="translate(980 340)"/><use href="#box" transform="translate(1040 340) scale(1.2)"/>
    <use href="#box" transform="translate(830 430)"/><use href="#box" transform="translate(1000 430) scale(1.3)"/>
  </g>
  <!-- Réserviste avec un diable -->
  <use href="#man" transform="translate(1120 490) scale(0.88)"/>

  <!-- Lampadaire de rue, passant lointain -->
  <g fill="{{subject}}">
    <rect x="228" y="330" width="6" height="160"/><path d="M214 330 L248 330 L240 312 L222 312 Z"/>
  </g>
  <use href="#man" transform="translate(1260 490) scale(0.5)"/>
</svg>
