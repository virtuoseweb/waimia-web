<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « Analyser ses avis clients avec l'IA sans enfreindre le RGPD » :
       un homme sur une échelle verse des fiches d'avis dans un immense tamis sur trépied ;
       les badges nominatifs (portrait, nom) restent pris dans la grille, seules des bandes
       de texte claires passent et tombent dans une caisse qu'un second homme examine.
       Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="8" fill="{{subject}}"/>
      <path d="M-10 -82 Q0 -86 10 -82 L11 -48 L-11 -48 Z" fill="{{subject}}"/>
      <path d="M-3 -82 L0 -74 L3 -82 Z" fill="{{light}}"/>
      <rect x="-9" y="-49" width="7" height="47" fill="{{subject}}"/>
      <rect x="2" y="-49" width="7" height="47" fill="{{subject}}"/>
      <path d="M-11 -3 L-1 -3 L-1 0 L-11 0 Z M1 -3 L11 -3 L11 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="badge">
      <rect x="-20" y="-13" width="40" height="26" fill="{{shadow}}"/>
      <circle cx="-9" cy="-2" r="6" fill="{{soft}}"/>
      <path d="M-15 10 Q-9 2 -3 10 Z" fill="{{soft}}"/>
      <rect x="1" y="-5" width="14" height="4" fill="{{soft}}"/>
      <rect x="1" y="3" width="10" height="4" fill="{{soft}}"/>
    </g>
    <g id="card">
      <rect x="-26" y="-17" width="52" height="34" fill="{{light}}"/>
      <rect x="-20" y="-10" width="18" height="12" fill="{{shadow}}"/>
      <rect x="2" y="-9" width="18" height="3" fill="{{mid}}"/>
      <rect x="2" y="-2" width="14" height="3" fill="{{mid}}"/>
      <rect x="-20" y="6" width="40" height="3" fill="{{mid}}"/>
    </g>
    <g id="strip">
      <rect x="-14" y="-3" width="28" height="6" fill="{{light}}"/>
    </g>
  </defs>

  <!-- Fond -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1130" cy="190" r="150" fill="{{soft}}"/>

  <!-- Sol, horizon bas -->
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <rect y="514" width="1456" height="8" fill="{{deep}}"/>

  <!-- Trépied du tamis -->
  <path d="M560 300 L470 518" stroke="{{shadow}}" stroke-width="12"/>
  <path d="M900 300 L990 518" stroke="{{shadow}}" stroke-width="12"/>
  <path d="M730 320 L730 330" stroke="{{shadow}}" stroke-width="12"/>

  <!-- Le grand tamis : cuve, grille, cerclage -->
  <path d="M520 230 L940 230 L900 320 L560 320 Z" fill="{{deep}}"/>
  <ellipse cx="730" cy="320" rx="170" ry="22" fill="{{shape}}"/>
  <g stroke="{{deep}}" stroke-width="3">
    <path d="M590 312 L590 328 M620 305 L620 335 M650 301 L650 339 M680 299 L680 341 M710 298 L710 342 M740 298 L740 342 M770 299 L770 341 M800 301 L800 339 M830 305 L830 335 M860 312 L860 328"/>
    <path d="M568 316 L892 316 M575 326 L885 326"/>
  </g>
  <ellipse cx="730" cy="230" rx="210" ry="30" fill="{{shape}}"/>
  <ellipse cx="730" cy="232" rx="188" ry="22" fill="{{deep}}"/>
  <!-- Badges nominatifs restés dans le tamis -->
  <use href="#badge" transform="translate(660 232) rotate(-8)"/>
  <use href="#badge" transform="translate(760 236) rotate(6)"/>
  <use href="#badge" transform="translate(840 230) rotate(-4)"/>

  <!-- Fiches qui tombent de la main de l'homme sur l'échelle -->
  <use href="#card" transform="translate(600 120) rotate(-14)"/>
  <use href="#card" transform="translate(660 160) rotate(10)"/>
  <use href="#card" transform="translate(720 110) rotate(-4) scale(0.9)"/>
  <use href="#card" transform="translate(700 196) rotate(22) scale(0.85)"/>

  <!-- Échelle et homme qui verse -->
  <path d="M430 518 L500 150 M470 518 L540 150" stroke="{{shadow}}" stroke-width="6"/>
  <g stroke="{{shadow}}" stroke-width="5">
    <path d="M440 466 L480 466 M450 414 L490 414 M460 362 L500 362 M470 310 L510 310 M480 258 L520 258 M490 206 L530 206"/>
  </g>
  <use href="#man" transform="translate(512 206) scale(1.05)"/>
  <path d="M520 118 L560 100" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>

  <!-- Bandes de texte qui passent au travers de la grille -->
  <use href="#strip" transform="translate(690 368) rotate(8)"/>
  <use href="#strip" transform="translate(760 392) rotate(-10)"/>
  <use href="#strip" transform="translate(720 420) rotate(4)"/>
  <use href="#strip" transform="translate(780 446) rotate(12)"/>
  <use href="#strip" transform="translate(700 462) rotate(-6)"/>

  <!-- Caisse qui reçoit le texte -->
  <path d="M650 480 L820 480 L810 518 L660 518 Z" fill="{{shadow}}"/>
  <rect x="640" y="472" width="190" height="10" fill="{{deep}}"/>
  <rect x="676" y="486" width="20" height="4" fill="{{light}}"/>
  <rect x="726" y="492" width="24" height="4" fill="{{light}}"/>

  <!-- Second homme, penché sur la caisse -->
  <use href="#man" transform="translate(900 514) scale(1.15)"/>
  <path d="M890 422 L850 450" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
  <!-- Ombre au sol -->
  <path d="M470 524 L990 524 L1040 548 L520 548 Z" fill="{{deep}}" opacity="0.35"/>
</svg>
