       apprend et se souvient. À droite, un mât à haut-parleurs tournés en tous sens :
       l'assistant présent sur tous les canaux.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 620 et 1220. Rôles : subject = livres, pavillons ; silhouette en {{shadow}}. -->
