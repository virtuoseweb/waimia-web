<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Landing page qui convertit » : un petit avion à hélice (subject = bleu) descend vers une
       piste ; au bout, le placier lui montre l'endroit où se poser.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="860" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <!-- Piste -->
  <path d="M546 494 L1176 494 L1204 516 L518 516 Z" fill="{{shape}}"/>
  <rect x="572" y="503" width="32" height="5" fill="{{light}}"/><rect x="634" y="503" width="32" height="5" fill="{{light}}"/><rect x="696" y="503" width="32" height="5" fill="{{light}}"/><rect x="758" y="503" width="32" height="5" fill="{{light}}"/><rect x="820" y="503" width="32" height="5" fill="{{light}}"/><rect x="882" y="503" width="32" height="5" fill="{{light}}"/><rect x="944" y="503" width="32" height="5" fill="{{light}}"/><rect x="1006" y="503" width="32" height="5" fill="{{light}}"/><rect x="1068" y="503" width="32" height="5" fill="{{light}}"/><rect x="1130" y="503" width="32" height="5" fill="{{light}}"/>
  <!-- L'avion en approche -->
  <g transform="translate(700 268) rotate(9)">
    <path d="M-104 -2 L-126 -58 L-98 -58 L-64 -16 Z" fill="{{subject}}"/>
    <ellipse cx="-98" cy="4" rx="32" ry="6" fill="{{deep}}"/>
    <path d="M-112 0 Q-100 -22 -40 -24 L80 -18 Q118 -12 122 0 Q118 14 80 16 L-60 18 Q-106 16 -112 0 Z" fill="{{subject}}"/>
    <g fill="{{light}}"><rect x="-26" y="-12" width="14" height="9" rx="3"/><rect x="-4" y="-12" width="14" height="9" rx="3"/><rect x="18" y="-12" width="14" height="9" rx="3"/><rect x="58" y="-14" width="22" height="11" rx="3"/></g>
    <path d="M-24 6 L46 6 L18 52 L-30 52 Z" fill="{{subject}}" stroke="{{light}}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 16 L26 34" fill="none" stroke="{{detail}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="38" r="8" fill="{{detail}}"/>
    <circle cx="124" cy="0" r="8" fill="{{detail}}"/>
    <ellipse cx="130" cy="0" rx="5" ry="36" fill="{{pale}}"/>
  </g>
  <!-- Le placier, palettes en main -->
  <use href="#man" transform="translate(1130 500) scale(-2 2)"/>
  <path d="M1114 344 L1084 344 L1056 342" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1056 342 L1046 342" fill="none" stroke="{{detail}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1034" cy="342" r="15" fill="{{detail}}"/>
  <path d="M1140 344 L1152 312 L1160 282" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1166" cy="262" r="15" fill="{{detail}}"/>
</svg>
