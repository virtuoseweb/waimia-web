<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « Claude Ship : relire, corriger, approuver une pull request » :
       un tapis roulant porte des feuilles sous un tampon géant suspendu à un portique ;
       au bout du tapis, un homme garde la main sur le levier d'une barrière.
       Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="8" fill="{{subject}}"/>
      <path d="M-10 -82 Q0 -86 10 -82 L11 -48 L-11 -48 Z" fill="{{subject}}"/>
      <path d="M-3 -82 L0 -74 L3 -82 Z" fill="{{light}}"/>
      <rect x="-9" y="-49" width="7" height="47" fill="{{subject}}"/>
      <rect x="2" y="-49" width="7" height="47" fill="{{subject}}"/>
      <path d="M-11 -3 L-1 -3 L-1 0 L-11 0 Z M1 -3 L11 -3 L11 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="sheet">
      <path d="M-34 0 L30 0 L38 -10 L-26 -10 Z" fill="{{light}}"/>
      <path d="M-20 -6 L16 -6" stroke="{{soft}}" stroke-width="2"/>
    </g>
  </defs>

  <!-- Fond -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Disque pâle derrière le tampon : le point focal -->
  <circle cx="610" cy="250" r="190" fill="{{soft}}"/>

  <!-- Sol, horizon bas -->
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <rect y="514" width="1456" height="8" fill="{{deep}}"/>

  <!-- Portique du tampon -->
  <rect x="440" y="96" width="22" height="418" fill="{{deep}}"/>
  <rect x="760" y="96" width="22" height="418" fill="{{deep}}"/>
  <rect x="424" y="80" width="374" height="24" fill="{{shadow}}"/>

  <!-- Le tampon géant : manche, col, bloc -->
  <rect x="600" y="104" width="22" height="70" fill="{{shadow}}"/>
  <ellipse cx="611" cy="194" rx="52" ry="30" fill="{{shadow}}"/>
  <rect x="590" y="210" width="42" height="66" fill="{{shadow}}"/>
  <rect x="506" y="270" width="210" height="62" fill="{{shadow}}"/>
  <rect x="506" y="330" width="210" height="16" fill="{{detail}}"/>

  <!-- Tapis roulant -->
  <rect x="120" y="420" width="1010" height="26" fill="{{shadow}}"/>
  <circle cx="134" cy="433" r="13" fill="{{deep}}"/>
  <circle cx="1116" cy="433" r="13" fill="{{deep}}"/>
  <g fill="{{deep}}">
    <rect x="200" y="446" width="12" height="68"/><rect x="520" y="446" width="12" height="68"/>
    <rect x="840" y="446" width="12" height="68"/><rect x="1060" y="446" width="12" height="68"/>
  </g>

  <!-- Feuilles qui avancent sur le tapis -->
  <use href="#sheet" transform="translate(230 420)"/>
  <use href="#sheet" transform="translate(360 420)"/>
  <use href="#sheet" transform="translate(611 420)"/>
  <use href="#sheet" transform="translate(880 420)"/>
  <!-- Marque du tampon sur la feuille déjà passée -->
  <rect x="868" y="413" width="22" height="4" fill="{{detail}}"/>

  <!-- Barrière au bout du tapis -->
  <rect x="1180" y="300" width="18" height="214" fill="{{shadow}}"/>
  <rect x="1060" y="300" width="138" height="14" fill="{{detail}}"/>
  <!-- Levier -->
  <rect x="1222" y="440" width="34" height="74" fill="{{deep}}"/>
  <path d="M1239 444 L1272 380" stroke="{{shadow}}" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1272" cy="380" r="9" fill="{{detail}}"/>

  <!-- L'homme, main sur le levier -->
  <use href="#man" transform="translate(1310 514) scale(1.15)"/>
  <path d="M1300 430 L1276 386" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
</svg>
