<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Guide d'achat Claude pour PME » : trois nichoirs sur leurs piquets, un trou,
       trois trous, huit trous ; un homme lève les yeux pour choisir celui qui convient à la
       taille de sa colonie. La bonne offre se choisit à l'effectif.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 470 et 1220, nichoirs à des hauteurs décalées. Rôles : subject = toits, trous,
       oiseaux ; shape = caisses ; silhouette en {{shadow}}. -->
  <defs><g id="b"><ellipse cx="0" cy="0" rx="11" ry="6" fill="{{subject}}"/><circle cx="9" cy="-4" r="4.5" fill="{{subject}}"/><path d="M-9 -2 L-20 -7 L-18 3 Z" fill="{{subject}}"/><path d="M14 -4 L19 -3 L14 -1 Z" fill="{{deep}}"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="860" cy="506" rx="410" ry="22" fill="{{ground}}"/>
  <ellipse cx="650" cy="502" rx="40" ry="6" fill="{{shape}}"/>
  <ellipse cx="880" cy="502" rx="56" ry="7" fill="{{shape}}"/>
  <ellipse cx="1112" cy="502" rx="80" ry="8" fill="{{shape}}"/>
  <ellipse cx="510" cy="502" rx="36" ry="6" fill="{{shape}}"/>
  <rect x="644.0" y="392" width="12" height="110" fill="{{deep}}"/><rect x="619.0" y="318" width="62" height="74" fill="{{shape}}"/><path d="M605.0 322 L650 291.96 L695.0 322 Z" fill="{{subject}}"/><circle cx="650" cy="348" r="11" fill="{{subject}}"/><rect x="874.0" y="344" width="12" height="158" fill="{{deep}}"/><rect x="818.0" y="232" width="124" height="112" fill="{{shape}}"/><path d="M804.0 236 L880 179.92000000000002 L956.0 236 Z" fill="{{subject}}"/><circle cx="844" cy="304" r="12" fill="{{subject}}"/><circle cx="880" cy="304" r="12" fill="{{subject}}"/><circle cx="916" cy="304" r="12" fill="{{subject}}"/><rect x="1106.0" y="382" width="12" height="120" fill="{{deep}}"/><rect x="1024.0" y="176" width="176" height="206" fill="{{shape}}"/><path d="M1010.0 180 L1112 102.08 L1214.0 180 Z" fill="{{subject}}"/><circle cx="1055" cy="232" r="13" fill="{{subject}}"/><circle cx="1093" cy="232" r="13" fill="{{subject}}"/><circle cx="1131" cy="232" r="13" fill="{{subject}}"/><circle cx="1169" cy="232" r="13" fill="{{subject}}"/><circle cx="1055" cy="288" r="13" fill="{{subject}}"/><circle cx="1093" cy="288" r="13" fill="{{subject}}"/><circle cx="1131" cy="288" r="13" fill="{{subject}}"/><circle cx="1169" cy="288" r="13" fill="{{subject}}"/>
  <!-- Une deuxième rangée de trous sur le grand nichoir est sous le toit ; un oiseau sur le perchoir du moyen -->
  <use href="#b" transform="translate(880 172) scale(-1 1)"/>
  <use href="#b" transform="translate(1010 150) rotate(-10)"/>
  <use href="#b" transform="translate(760 196) scale(0.85) rotate(8)"/>
  <!-- L'homme lève les yeux, livret à la main -->
  <g transform="translate(510 500) scale(2.1)">
    <g fill="{{shadow}}">
      <rect x="-9" y="-44" width="8" height="42"/>
      <rect x="1" y="-44" width="8" height="42"/>
      <rect x="-10" y="-3" width="10" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="12" height="3" rx="1.5"/>
      <path d="M-12 -82 Q0 -86 12 -82 L14 -42 L-14 -42 Z"/>
      <circle cx="2" cy="-93" r="7.5"/>
      <path d="M-5 -99 Q3 -104 10 -97 L9 -94 L-5 -95 Z"/>
    </g>
    <path d="M9 -78 L14 -64 L20 -62" fill="none" stroke="{{shadow}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="-70" width="12" height="16" fill="{{shape}}"/>
    <rect x="23.5" y="-70" width="1.2" height="16" fill="{{deep}}"/>
  </g>
</svg>
