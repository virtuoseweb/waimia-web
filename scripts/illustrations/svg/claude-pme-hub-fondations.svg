  <g stroke="{{detail}}" stroke-width="3"><line x1="645" y1="96" x2="645" y2="300"/></g>
  <path d="M637 300 L645 290 L653 300 L645 316 Z" fill="{{detail}}"/>
  <rect x="290" y="398" width="60" height="12" fill="{{detail}}"/>
  <use href="#man" transform="translate(668 470) scale(1.05)"/>
  <use href="#woman" transform="translate(762 470) scale(1)"/>
  <rect x="674" y="412" width="84" height="36" fill="{{shape}}"/>
  <rect x="674" y="412" width="84" height="7" fill="{{pale}}"/>
  <use href="#man" transform="translate(1180 560) scale(0.8)"/>
</svg>
