<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Cowork sur un autre poste : ça marche, avec des prérequis » : une caravane
       années 60 s'installe sur un nouvel emplacement. Un homme descend la béquille avant à la
       manivelle, des cales tiennent la roue, une femme branche le câble sur une borne. La
       fenêtre est d'un seul tenant, sans croisillon. Rôles remplacés par render-svg.mjs
       (shape = la caravane, detail = fenêtre et liseré). -->
  <defs>
    <clipPath id="body">
      <path d="M722 446 L722 336 Q722 270 806 266 L1036 266 Q1122 270 1126 352 L1126 426 Q1126 446 1106 446 Z"/>
    </clipPath>
  </defs>

  <!-- Grand ciel uni -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Nuage, en haut à droite -->
  <g fill="{{detail}}">
    <circle cx="1196" cy="128" r="34"/>
    <circle cx="1240" cy="110" r="44"/>
    <circle cx="1290" cy="124" r="36"/>
    <rect x="1170" y="124" width="150" height="38" rx="19"/>
  </g>

  <!-- Sol -->
  <rect y="462" width="1456" height="162" fill="{{ground}}"/>

  <!-- Ombre de la caravane sur le sol -->
  <rect x="700" y="474" width="440" height="10" rx="5" fill="{{soft}}"/>

  <!-- Timon et béquille avant -->
  <path d="M724 420 L724 432 L644 442 L644 432 Z" fill="{{subject}}"/>
  <rect x="632" y="428" width="18" height="16" rx="5" fill="{{subject}}"/>
  <rect x="652" y="420" width="8" height="54" fill="{{subject}}"/>
  <circle cx="656" cy="476" r="7" fill="{{subject}}"/>
  <!-- Manivelle sur la béquille -->
  <path d="M656 422 L656 408 L634 408" fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- La caravane : carrosserie arrondie -->
  <path d="M722 446 L722 336 Q722 270 806 266 L1036 266 Q1122 270 1126 352 L1126 426 Q1126 446 1106 446 Z" fill="{{shape}}"/>
  <g clip-path="url(#body)">
    <!-- Liseré horizontal -->
    <rect x="700" y="376" width="460" height="12" fill="{{detail}}"/>
    <!-- Passage de roue -->
    <circle cx="900" cy="448" r="38" fill="{{deep}}"/>
  </g>
  <!-- Fenêtre d'un seul tenant -->
  <rect x="764" y="300" width="148" height="50" rx="22" fill="{{detail}}"/>
  <!-- Porte -->
  <rect x="972" y="298" width="52" height="138" rx="8" fill="{{deep}}"/>
  <circle cx="1012" cy="370" r="4" fill="{{detail}}"/>
  <!-- Châssis et béquille arrière -->
  <rect x="726" y="442" width="388" height="8" fill="{{subject}}"/>
  <rect x="1094" y="446" width="8" height="30" fill="{{subject}}"/>
  <rect x="1088" y="474" width="20" height="5" rx="2" fill="{{subject}}"/>

  <!-- Roue et cales -->
  <circle cx="900" cy="448" r="30" fill="{{subject}}"/>
  <circle cx="900" cy="448" r="10" fill="{{detail}}"/>
  <path d="M846 479 L877 479 L873 463 Z" fill="{{deep}}"/>
  <path d="M954 479 L923 479 L927 463 Z" fill="{{deep}}"/>

  <!-- Câble : de l'arrière de la caravane à la borne -->
  <path d="M1126 404 Q1210 492 1296 428" fill="none" stroke="{{subject}}" stroke-width="6" stroke-linecap="round"/>
  <!-- Borne électrique -->
  <rect x="1280" y="392" width="34" height="90" rx="4" fill="{{mid}}"/>
  <rect x="1276" y="384" width="42" height="12" rx="4" fill="{{subject}}"/>
  <rect x="1290" y="420" width="14" height="16" rx="3" fill="{{subject}}"/>

  <!-- L'homme à la manivelle, de profil -->
  <g transform="translate(600 500) scale(1.5)">
    <g fill="{{subject}}">
      <circle cx="0" cy="-90" r="7.5"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
      <rect x="-11.5" y="-44" width="9.5" height="42"/>
      <rect x="2" y="-44" width="9.5" height="42"/>
      <rect x="-13" y="-3" width="12" height="3" rx="1.5"/>
      <rect x="2" y="-3" width="13" height="3" rx="1.5"/>
    </g>
    <g fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 -77 L15 -66 L22 -61"/>
      <path d="M-8 -78 L-12 -56"/>
    </g>
  </g>

  <!-- La femme qui branche le câble, tournée vers la borne -->
  <g transform="translate(1346 498) scale(1.5)">
    <g fill="{{subject}}">
      <circle cx="0" cy="-90" r="7"/>
      <circle cx="1" cy="-99" r="5"/>
      <path d="M-10 -80 Q0 -84 10 -80 L11 -56 L-11 -56 Z"/>
      <path d="M-12 -57 L12 -57 L10 -22 L-10 -22 Z"/>
      <rect x="-7" y="-23" width="5" height="21"/>
      <rect x="2" y="-23" width="5" height="21"/>
      <rect x="-9" y="-3" width="8" height="3" rx="1.5"/>
      <rect x="1" y="-3" width="8" height="3" rx="1.5"/>
    </g>
    <g fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-7 -78 L-17 -62 L-28 -49"/>
      <path d="M8 -78 L11 -58"/>
    </g>
  </g>
</svg>
