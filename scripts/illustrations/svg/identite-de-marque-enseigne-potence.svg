<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « l’enseigne qu’on accroche » (création d’identité de marque) : sur une façade de boutique neuve, une silhouette sur une échelle suspend une enseigne ronde à une potence. Distribution dégradé aube. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="360" cy="500" r="230" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <!-- façade -->
  <rect x="800" y="230" width="460" height="270" fill="{{subject}}"/>
  <rect x="784" y="214" width="492" height="24" fill="{{subject}}"/>
  <rect x="784" y="238" width="492" height="6" fill="{{deep}}"/>
  <rect x="880" y="360" width="64" height="140" fill="{{light}}"/>
  <rect x="990" y="326" width="200" height="114" fill="{{light}}"/>
  <rect x="1086" y="326" width="6" height="114" fill="{{subject}}"/>
  <rect x="990" y="380" width="200" height="6" fill="{{subject}}"/>
  <rect x="860" y="262" width="340" height="34" fill="{{deep}}"/>
  <!-- potence -->
  <path d="M800 330 L612 330" stroke="{{subject}}" stroke-width="9" stroke-linecap="round"/>
  <path d="M800 372 Q700 372 640 332" fill="none" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
  <circle cx="800" cy="330" r="9" fill="{{subject}}"/>
  <!-- chaînes + enseigne -->
  <path d="M629 332 L629 388 M715 332 L715 388" stroke="{{subject}}" stroke-width="4"/>
  <circle cx="672" cy="448" r="74" fill="{{detail}}"/>
  <circle cx="672" cy="448" r="74" fill="none" stroke="{{subject}}" stroke-width="8"/>
  <path d="M672 398 L714 448 L672 498 L630 448 Z" fill="{{subject}}"/>
  <circle cx="672" cy="448" r="15" fill="{{detail}}"/>
  <!-- échelle + silhouette qui accroche -->
  <g stroke="{{subject}}" stroke-width="7" stroke-linecap="round">
    <path d="M530 500 L598 290"/><path d="M572 500 L640 290"/>
  </g>
  <g stroke="{{subject}}" stroke-width="5">
    <path d="M541 462 L583 462"/><path d="M552 424 L594 424"/><path d="M563 386 L605 386"/><path d="M574 348 L616 348"/><path d="M586 310 L628 310"/>
  </g>
  <use href="#man" transform="translate(606 336) scale(0.95)"/>
  <!-- deux passants -->
  <use href="#woman" transform="translate(440 500) scale(1.3)"/>
  <use href="#man" transform="translate(1330 500) scale(1.2)"/>
</svg>
