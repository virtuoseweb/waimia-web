<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- duotone contre-jour · un enclos à palissade basse et portail ; trois silhouettes portant des feuilles à l'intérieur ; une silhouette seule avec sa feuille à l'extérieur. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
<clipPath id="sky"><rect width="1456" height="470"/></clipPath>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="620" cy="470" r="250" fill="{{shape}}" clip-path="url(#sky)"/>
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <!-- palissade arrière, plus basse et plus courte (perspective) -->
  <g fill="{{detail}}">
    <rect x="330" y="478" width="580" height="4"/>
    <rect x="330" y="470" width="4" height="22"/><rect x="380" y="470" width="4" height="22"/><rect x="430" y="470" width="4" height="22"/><rect x="480" y="470" width="4" height="22"/><rect x="530" y="470" width="4" height="22"/><rect x="580" y="470" width="4" height="22"/><rect x="630" y="470" width="4" height="22"/><rect x="680" y="470" width="4" height="22"/><rect x="730" y="470" width="4" height="22"/><rect x="780" y="470" width="4" height="22"/><rect x="830" y="470" width="4" height="22"/><rect x="880" y="470" width="4" height="22"/><rect x="906" y="470" width="4" height="22"/>
  </g>
  <!-- côtés -->
  <path d="M330 488 L240 590 L248 590 L334 488 Z" fill="{{detail}}"/>
  <path d="M910 488 L1000 590 L1008 590 L906 488 Z" fill="{{detail}}"/>
  <!-- trois silhouettes à l'intérieur, avec leurs feuilles -->
  <use href="#man" transform="translate(470 572) scale(1.05)"/>
  <rect x="478" y="484" width="20" height="26" fill="{{pale}}" transform="rotate(-6 488 497)"/>
  <use href="#woman" transform="translate(630 540) scale(0.92)"/>
  <rect x="636" y="466" width="18" height="24" fill="{{pale}}" transform="rotate(5 645 478)"/>
  <use href="#man" transform="translate(760 576) scale(1.08)"/>
  <rect x="736" y="488" width="20" height="26" fill="{{pale}}" transform="rotate(-4 746 501)"/>
  <!-- palissade avant, basse, avec un portail fermé -->
  <g fill="{{subject}}">
    <rect x="240" y="562" width="300" height="5"/><rect x="240" y="580" width="300" height="5"/>
    <rect x="660" y="562" width="348" height="5"/><rect x="660" y="580" width="348" height="5"/>
    <rect x="240" y="546" width="7" height="50"/><rect x="280" y="546" width="7" height="50"/><rect x="320" y="546" width="7" height="50"/><rect x="360" y="546" width="7" height="50"/><rect x="400" y="546" width="7" height="50"/><rect x="440" y="546" width="7" height="50"/><rect x="480" y="546" width="7" height="50"/><rect x="533" y="540" width="9" height="58"/>
    <rect x="658" y="540" width="9" height="58"/><rect x="700" y="546" width="7" height="50"/><rect x="740" y="546" width="7" height="50"/><rect x="780" y="546" width="7" height="50"/><rect x="820" y="546" width="7" height="50"/><rect x="860" y="546" width="7" height="50"/><rect x="900" y="546" width="7" height="50"/><rect x="940" y="546" width="7" height="50"/><rect x="980" y="546" width="7" height="50"/><rect x="1001" y="546" width="7" height="50"/>
  </g>
  <!-- portail fermé : barreaux + écharpe -->
  <g fill="{{detail}}">
    <rect x="544" y="552" width="112" height="5"/><rect x="544" y="586" width="112" height="5"/>
    <rect x="560" y="552" width="5" height="39"/><rect x="584" y="552" width="5" height="39"/><rect x="610" y="552" width="5" height="39"/><rect x="634" y="552" width="5" height="39"/>
  </g>
  <path d="M546 590 L654 554" stroke="{{detail}}" stroke-width="5"/>
  <!-- silhouette seule dehors, avec sa propre feuille -->
  <use href="#man" transform="translate(1210 600) scale(1.15)"/>
  <rect x="1186" y="500" width="22" height="28" fill="{{pale}}" transform="rotate(8 1197 514)"/>
  <ellipse cx="1210" cy="601" rx="22" ry="3" fill="{{shadow}}"/>
</svg>
