<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « Expertise du CSE sur un projet d'IA » : une grande machine fermée,
       posée sur le sol ; une experte, montée sur un escabeau, tient devant elle une loupe géante ;
       cinq petites silhouettes (les élus) regardent depuis la gauche ; à droite, un grand sablier
       (les délais de la consultation). Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="8" fill="{{subject}}"/>
      <path d="M-10 -82 Q0 -86 10 -82 L11 -48 L-11 -48 Z" fill="{{subject}}"/>
      <path d="M-3 -82 L0 -74 L3 -82 Z" fill="{{ground}}"/>
      <rect x="-9" y="-49" width="7" height="47" fill="{{subject}}"/>
      <rect x="2" y="-49" width="7" height="47" fill="{{subject}}"/>
      <path d="M-11 -3 L-1 -3 L-1 0 L-11 0 Z M1 -3 L11 -3 L11 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
  </defs>

  <!-- Fond -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Sol, horizon bas -->
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <rect y="514" width="1456" height="8" fill="{{deep}}"/>

  <!-- La grande machine fermée -->
  <rect x="610" y="150" width="430" height="370" fill="{{shape}}"/>
  <rect x="610" y="150" width="430" height="26" fill="{{shadow}}"/>
  <rect x="650" y="220" width="350" height="12" fill="{{deep}}"/>
  <rect x="650" y="252" width="260" height="12" fill="{{deep}}"/>
  <rect x="650" y="284" width="310" height="12" fill="{{deep}}"/>
  <rect x="650" y="410" width="90" height="110" fill="{{shadow}}"/>
  <rect x="900" y="410" width="90" height="110" fill="{{shadow}}"/>
  <circle cx="955" cy="350" r="16" fill="{{pale}}"/>
  <circle cx="905" cy="350" r="16" fill="{{pale}}"/>

  <!-- Escabeau -->
  <path d="M520 520 L556 360 L566 360 L534 520 Z" fill="{{subject}}"/>
  <path d="M600 520 L566 360 L576 360 L612 520 Z" fill="{{subject}}"/>
  <rect x="530" y="470" width="66" height="8" fill="{{subject}}"/>
  <rect x="540" y="420" width="50" height="8" fill="{{subject}}"/>
  <rect x="548" y="370" width="36" height="10" fill="{{subject}}"/>

  <!-- L'experte sur l'escabeau tient la loupe -->
  <use href="#woman" transform="translate(566 370) scale(1.3)"/>
  <path d="M574 268 L640 290" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>
  <!-- Loupe géante -->
  <rect x="636" y="282" width="70" height="20" transform="rotate(20 636 282)" fill="{{subject}}"/>
  <circle cx="770" cy="330" r="96" fill="{{subject}}"/>
  <circle cx="770" cy="330" r="80" fill="{{detail}}"/>
  <path d="M728 288 Q745 272 770 270" stroke="{{light}}" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Les élus, à gauche, regardent -->
  <use href="#man" transform="translate(150 520)"/>
  <use href="#woman" transform="translate(196 520)"/>
  <use href="#man" transform="translate(242 520)"/>
  <use href="#man" transform="translate(288 520)"/>
  <use href="#woman" transform="translate(334 520)"/>

  <!-- Grand sablier à droite -->
  <rect x="1180" y="200" width="150" height="16" fill="{{subject}}"/>
  <rect x="1180" y="504" width="150" height="16" fill="{{subject}}"/>
  <rect x="1186" y="216" width="8" height="288" fill="{{subject}}"/>
  <rect x="1316" y="216" width="8" height="288" fill="{{subject}}"/>
  <path d="M1200 216 L1310 216 L1262 356 L1248 356 Z" fill="{{light}}"/>
  <path d="M1248 368 L1262 368 L1310 504 L1200 504 Z" fill="{{light}}"/>
  <path d="M1228 250 L1282 250 L1258 340 L1252 340 Z" fill="{{shape}}"/>
  <rect x="1253" y="340" width="4" height="120" fill="{{shape}}"/>
  <path d="M1218 504 L1255 450 L1292 504 Z" fill="{{shape}}"/>
</svg>
