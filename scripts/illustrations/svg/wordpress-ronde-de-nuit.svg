<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « maintenance WordPress » : un veilleur fait sa ronde le soir devant une
       rangée de maisons éclairées, une seule fenêtre est éteinte. Distribution prévue : contre-jour.
       Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <!-- Maison : corps (forme), toit (sol), fenêtre allumée -->
    <g id="house">
      <rect x="-34" y="-100" width="68" height="100" fill="{{shape}}"/>
      <path d="M-40 -100 L0 -132 L40 -100 Z" fill="{{shape}}"/>
      <rect x="-12" y="-76" width="24" height="30" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="470"/></clipPath>
  </defs>

  <!-- Nuit -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Lune : disque entamé par le ciel -->
  <circle cx="1170" cy="215" r="105" fill="{{shape}}" clip-path="url(#sky)"/>
  <circle cx="1210" cy="190" r="88" fill="{{field}}" clip-path="url(#sky)"/>
  <!-- Étoiles -->
  <g fill="{{detail}}">
    <rect x="160" y="150" width="6" height="6"/><rect x="330" y="105" width="5" height="5"/><rect x="520" y="180" width="6" height="6"/>
    <rect x="690" y="118" width="5" height="5"/><rect x="880" y="160" width="6" height="6"/><rect x="1010" y="100" width="5" height="5"/>
    <rect x="1330" y="150" width="6" height="6"/><rect x="90" y="240" width="5" height="5"/>
  </g>
  <!-- Rue -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>

  <!-- Rangée de maisons, toutes différentes en hauteur ; une seule fenêtre éteinte -->
  <use href="#house" transform="translate(470 470) scale(0.85)"/>
  <use href="#house" transform="translate(560 470) scale(1.1)"/>
  <use href="#house" transform="translate(668 470) scale(0.95)"/>
  <use href="#house" transform="translate(770 470) scale(1.2)"/>
  <use href="#house" transform="translate(884 470) scale(0.8)"/>
  <use href="#house" transform="translate(972 470) scale(1.05)"/>
  <use href="#house" transform="translate(1072 470) scale(0.9)"/>
  <use href="#house" transform="translate(1164 470) scale(1.15)"/>
  <!-- La fenêtre éteinte (maison 5) : on la recouvre de la couleur du fond -->
  <rect x="873.5" y="408.5" width="21" height="25.5" fill="{{shape}}"/>

  <!-- Le veilleur avec sa lanterne, de profil, tourné vers la rangée -->
  <use href="#man" transform="translate(300 548) scale(1.15)"/>
  <rect x="338" y="458" width="14" height="20" fill="{{detail}}"/>
  <path d="M345 458 L345 440" stroke="{{subject}}" stroke-width="3"/>
  <path d="M352 468 L452 424 L452 500 Z" fill="{{detail}}" opacity="0.55"/>
  <path d="M322 500 L340 468" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
  <!-- Reflet au sol -->
  <rect x="200" y="590" width="260" height="4" fill="{{shape}}"/>
  <rect x="640" y="560" width="400" height="4" fill="{{shape}}"/>
</svg>
