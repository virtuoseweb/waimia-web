  <path d="M1102 430 Q1102 470 1180 480" stroke="{{detail}}" stroke-width="14" fill="none"/>
  <rect x="1180" y="440" width="100" height="70" fill="{{deep}}"/><rect x="1180" y="440" width="100" height="10" fill="{{light}}"/>
