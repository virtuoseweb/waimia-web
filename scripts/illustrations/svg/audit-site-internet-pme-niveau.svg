<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « auditer avant de décider d'une refonte » : une maison simple sous
       un grand soleil bas ; une silhouette, de dos sur une échelle, pose un niveau à bulle
       contre la façade, près d'une fissure ; au pied, une collègue regarde. Aucun chantier
       engagé : on vérifie avant de décider.
       Sujet tenu dans la bande centrale (cadrage cover du héros). Rôles remplacés par
       render-svg.mjs. -->
  <defs>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="0" cy="-99" r="5" fill="{{subject}}"/>
      <path d="M-10 -80 Q0 -84 10 -80 L11 -56 L-11 -56 Z" fill="{{subject}}"/>
      <path d="M-12 -57 L12 -57 L10 -22 L-10 -22 Z" fill="{{subject}}"/>
      <rect x="-7" y="-23" width="5" height="21" fill="{{subject}}"/>
      <rect x="2" y="-23" width="5" height="21" fill="{{subject}}"/>
      <rect x="-9" y="-3" width="8" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1" y="-3" width="8" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <clipPath id="sky"><rect width="1456" height="470"/></clipPath>
  </defs>

  <!-- Grand fond uni et soleil qui se lève derrière le toit -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="780" cy="236" r="206" fill="{{shape}}"/>

  <!-- Sol : bande basse, horizon franc -->
  <rect y="470" width="1456" height="154" fill="{{ground}}"/>
  <rect y="470" width="1456" height="3" fill="{{deep}}" opacity="0.6"/>
  <g fill="{{soft}}">
    <rect x="90" y="540" width="180" height="3"/><rect x="1150" y="560" width="200" height="3"/>
    <rect x="640" y="592" width="240" height="3"/><rect x="330" y="602" width="120" height="3"/>
  </g>

  <!-- Maison : toit, cheminée, façade crème -->
  <rect x="902" y="150" width="34" height="74" fill="{{shadow}}"/>
  <path d="M536 256 L780 132 L1024 256 Z" fill="{{shadow}}"/>
  <rect x="566" y="256" width="428" height="214" fill="{{light}}"/>
  <rect x="566" y="256" width="428" height="8" fill="{{soft}}"/>
  <!-- Ombre portée de la façade sur le sol -->
  <path d="M994 470 L1060 486 L590 486 L566 470 Z" fill="{{soft}}"/>

  <!-- Fenêtres et porte, en quinconce (pas de grille régulière) -->
  <g fill="{{subject}}">
    <rect x="604" y="290" width="50" height="58"/>
    <rect x="712" y="290" width="50" height="58"/>
    <rect x="604" y="392" width="50" height="50"/>
    <rect x="700" y="384" width="56" height="86"/>
    <rect x="930" y="300" width="40" height="52"/>
  </g>
  <g fill="{{pale}}">
    <rect x="600" y="348" width="58" height="5"/><rect x="708" y="348" width="58" height="5"/>
    <rect x="600" y="442" width="58" height="5"/><rect x="926" y="352" width="48" height="5"/>
  </g>
  <circle cx="746" cy="430" r="3" fill="{{light}}"/>

  <!-- Fissure fine sur la façade, là où l'on vérifie -->
  <path d="M812 334 L800 352 L806 370 L790 392 L794 412 L780 436" fill="none" stroke="{{deep}}" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Échelle posée contre la façade (ton clair : la silhouette se détache) -->
  <g fill="{{soft}}">
    <path d="M864 470 L872 470 L880 262 L874 262 Z"/>
    <path d="M904 470 L912 470 L904 262 L898 262 Z"/>
    <rect x="868" y="444" width="40" height="5"/><rect x="869" y="418" width="38" height="5"/>
    <rect x="870" y="392" width="36" height="5"/><rect x="871" y="366" width="34" height="5"/>
    <rect x="872" y="340" width="32" height="5"/><rect x="873" y="314" width="30" height="5"/>
    <rect x="874" y="288" width="28" height="5"/>
  </g>

  <!-- La silhouette sur l'échelle, de dos : pieds sur un barreau, bras gauche tendu qui
       plaque un niveau à bulle contre le mur, près de la fissure -->
  <g transform="translate(889 392) scale(1.15)" fill="{{subject}}">
    <circle cx="0" cy="-90" r="7.5"/>
    <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z"/>
    <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
    <rect x="-11.5" y="-44" width="9.5" height="42"/>
    <rect x="2" y="-44" width="9.5" height="42"/>
    <rect x="-13" y="-3" width="11.5" height="3" rx="1.5"/>
    <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5"/>
    <!-- bras gauche, tendu vers le mur -->
    <path d="M-8 -80 L-12 -74 L-46 -66 L-46 -73 Z"/>
    <circle cx="-48" cy="-69.5" r="4"/>
    <!-- bras droit, main sur le montant -->
    <path d="M8 -80 L13 -76 L15 -52 L10 -52 L8 -70 Z"/>
  </g>
  <!-- Le niveau à bulle tenu à plat contre la façade -->
  <rect x="780" y="302" width="76" height="11" fill="{{shape}}"/>
  <rect x="809" y="304.5" width="18" height="6" fill="{{light}}"/>
  <circle cx="818" cy="307.5" r="2" fill="{{shape}}"/>

  <!-- La collègue au pied de la maison, qui regarde -->
  <use href="#woman" transform="translate(1024 500) scale(1.3)"/>

</svg>
