<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Images publicitaires générées par IA : quand les signaler » : sur une cimaise, un grand tableau de paysage et, à côté, un cartel vierge qu'une visiteuse se penche pour lire.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="woman"><circle cx="1" cy="-90" r="7"/><circle cx="-5" cy="-95" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="900" cy="506" rx="390" ry="22" fill="{{ground}}"/>
  <!-- cimaise -->
  <rect x="560" y="112" width="640" height="388" fill="{{pale}}"/>
  <rect x="560" y="490" width="640" height="10" fill="{{soft}}"/>
  <!-- tableau : cadre, ciel, soleil, collines -->
  <rect x="616" y="160" width="360" height="250" fill="{{deep}}"/>
  <rect x="632" y="176" width="328" height="218" fill="{{light}}"/>
  <circle cx="860" cy="250" r="44" fill="{{soft}}"/>
  <path d="M632 394 L632 318 Q720 270 800 320 Q880 286 960 330 L960 394 Z" fill="{{mid}}"/>
  <path d="M632 394 L632 360 Q760 330 960 372 L960 394 Z" fill="{{shadow}}"/>
  <!-- le cartel, vierge, bleu -->
  <rect x="1012" y="292" width="132" height="86" rx="3" fill="{{subject}}"/>
  <rect x="1012" y="372" width="132" height="6" fill="{{detail}}"/>
  <!-- visiteuse penchée vers le cartel, mains dans le dos -->
  <g transform="translate(1172 500) scale(-2.05 2.05)">
    <g transform="rotate(-10 0 -52)"><use href="#woman" fill="{{shadow}}"/></g>
  </g>
  <!-- second visiteur qui regarde le tableau -->
  <use href="#man" fill="{{shadow}}" transform="translate(508 500) scale(2)"/>

</svg>
