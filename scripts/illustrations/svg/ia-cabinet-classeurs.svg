<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour cabinet comptable » : une rangée de classeurs sur un meuble bas, avec un vide ;
       la comptable y remet le classeur manquant (les pièces manquantes, la revue de balance).
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="870" cy="506" rx="370" ry="22" fill="{{ground}}"/>
  <ellipse cx="880" cy="502" rx="330" ry="7" fill="{{soft}}"/>
  <!-- Meuble bas -->
  <rect x="560" y="380" width="640" height="120" fill="{{shape}}"/>
  <rect x="556" y="378" width="648" height="10" fill="{{deep}}"/>
  <rect x="580" y="402" width="290" height="78" fill="{{pale}}"/>
  <rect x="890" y="402" width="290" height="78" fill="{{pale}}"/>
  <rect x="860" y="432" width="6" height="20" rx="3" fill="{{deep}}"/>
  <rect x="894" y="432" width="6" height="20" rx="3" fill="{{deep}}"/>
  <!-- Classeurs, l'emplacement 2 vide -->
  <rect x="580" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="589" y="252" width="26" height="34" fill="{{light}}"/><rect x="580" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="680" y="242" width="44" height="138" rx="3" fill="{{subject}}"/><rect x="689" y="264" width="26" height="34" fill="{{light}}"/><rect x="680" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="730" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="739" y="252" width="26" height="34" fill="{{light}}"/><rect x="730" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="780" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="789" y="252" width="26" height="34" fill="{{light}}"/><rect x="780" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="830" y="242" width="44" height="138" rx="3" fill="{{subject}}"/><rect x="839" y="264" width="26" height="34" fill="{{light}}"/><rect x="830" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="880" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="889" y="252" width="26" height="34" fill="{{light}}"/><rect x="880" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="930" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="939" y="252" width="26" height="34" fill="{{light}}"/><rect x="930" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="980" y="242" width="44" height="138" rx="3" fill="{{subject}}"/><rect x="989" y="264" width="26" height="34" fill="{{light}}"/><rect x="980" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="1030" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="1039" y="252" width="26" height="34" fill="{{light}}"/><rect x="1030" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="1080" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="1089" y="252" width="26" height="34" fill="{{light}}"/><rect x="1080" y="364" width="44" height="6" fill="{{detail}}"/>
  <rect x="1130" y="242" width="44" height="138" rx="3" fill="{{subject}}"/><rect x="1139" y="264" width="26" height="34" fill="{{light}}"/><rect x="1130" y="364" width="44" height="6" fill="{{detail}}"/>
  <!-- Le classeur remis, encore incliné -->
  <g transform="rotate(-14 652 380)"><rect x="630" y="230" width="44" height="150" rx="3" fill="{{subject}}"/><rect x="639" y="252" width="26" height="34" fill="{{light}}"/><rect x="630" y="364" width="44" height="6" fill="{{detail}}"/></g>
  <!-- La comptable -->
  <use href="#woman" transform="translate(520 500) scale(2.1 2.1)"/>
  <path d="M532 336 L570 320 L614 304" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
