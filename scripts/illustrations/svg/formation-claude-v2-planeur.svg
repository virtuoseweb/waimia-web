<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- tritone ciel-bleu · tester avant la production : une tour d'essai, un planeur en papier lancé dans le ciel, des jalons au sol et une observatrice qui note l'atterrissage. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>

  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <path d="M960 150 q18 -34 62 -28 q20 -34 66 -18 q36 -20 66 12 q42 -4 52 34 q26 8 18 34 L942 184 q-8 -26 18 -34 Z" fill="{{detail}}"/>
  <!-- sol -->
  <rect y="440" width="1456" height="184" fill="{{ground}}"/>
  <rect y="436" width="1456" height="6" fill="{{soft}}"/>
  <g fill="{{soft}}"><rect x="0" y="500" width="1456" height="3"/><rect x="0" y="560" width="1456" height="3"/></g>
  <!-- tour d'essai, fine et haute -->
  <g>
    <path d="M154 440 L176 160 L196 160 L218 440 Z" fill="{{shape}}"/>
    <g stroke="{{deep}}" stroke-width="5" fill="none">
      <path d="M168 280 L204 330 M204 280 L168 330"/>
      <path d="M163 360 L210 420 M210 360 L163 420"/>
      
      <path d="M172 200 L200 250 M200 200 L172 250"/>
    </g>
    <rect x="140" y="150" width="96" height="12" fill="{{shadow}}"/>
    <rect x="144" y="126" width="3" height="24" fill="{{shadow}}"/><rect x="229" y="126" width="3" height="24" fill="{{shadow}}"/>
    <rect x="144" y="126" width="88" height="3" fill="{{shadow}}"/>
  </g>
  <!-- lanceur au sommet, bras tendu -->
  <use href="#man" transform="translate(192 150) scale(0.9)"/>
  <path d="M196 80 L222 66" stroke="{{subject}}" stroke-width="6" stroke-linecap="round"/>
  <!-- trajectoire en pointillés -->
  <path d="M230 64 C 420 20, 640 110, 760 190 C 900 280, 1060 370, 1170 450" fill="none" stroke="{{detail}}" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <!-- planeur en papier -->
  <g transform="translate(700 150) rotate(18) scale(1.6)">
    <path d="M-46 -8 L46 0 L-38 16 Z" fill="{{light}}"/>
    <path d="M-46 -8 L46 0 L-30 4 Z" fill="{{pale}}"/>
    <path d="M-30 4 L46 0 L-34 12 Z" fill="{{soft}}"/>
  </g>
  <!-- jalons à distances régulières -->
  <g fill="{{subject}}">
    <rect x="300" y="420" width="5" height="26"/><rect x="420" y="420" width="5" height="26"/><rect x="540" y="420" width="5" height="26"/>
    <rect x="660" y="420" width="5" height="26"/><rect x="780" y="420" width="5" height="26"/><rect x="900" y="420" width="5" height="26"/>
    <rect x="1020" y="420" width="5" height="26"/><rect x="1140" y="420" width="5" height="26"/><rect x="1260" y="420" width="5" height="26"/>
  </g>
  <g fill="{{detail}}"><path d="M305 420 L322 426 L305 432 Z"/><path d="M425 420 L442 426 L425 432 Z"/><path d="M545 420 L562 426 L545 432 Z"/><path d="M665 420 L682 426 L665 432 Z"/><path d="M785 420 L802 426 L785 432 Z"/><path d="M905 420 L922 426 L905 432 Z"/><path d="M1025 420 L1042 426 L1025 432 Z"/><path d="M1145 420 L1162 426 L1145 432 Z"/><path d="M1265 420 L1282 426 L1265 432 Z"/></g>
  <!-- point d'atterrissage marqué -->
  <ellipse cx="1172" cy="452" rx="22" ry="5" fill="{{soft}}"/>
  <!-- observatrice qui note -->
  <use href="#woman" transform="translate(1222 470) scale(1.05)"/>
  <path d="M1216 392 L1204 412" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
  <rect x="1190" y="404" width="18" height="24" fill="{{light}}" transform="rotate(-12 1199 416)"/>
</svg>
