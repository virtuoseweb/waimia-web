<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Donner accès à un agent IA » : une gardienne remet une seule clé à un visiteur ; derrière un cordon tendu entre deux potelets, un grand vase sur son socle, auquel on ne touche pas.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution objet-bleu ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="woman"><circle cx="1" cy="-90" r="7"/><circle cx="-5" cy="-95" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="900" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="990" cy="501" rx="110" ry="7" fill="{{shape}}"/>
  <ellipse cx="655" cy="502" rx="90" ry="6" fill="{{shape}}"/>
  <!-- socle -->
  <rect x="904" y="330" width="172" height="18" fill="{{mid}}"/>
  <rect x="918" y="348" width="144" height="152" fill="{{soft}}"/>
  <rect x="910" y="490" width="160" height="10" fill="{{mid}}"/>
  <!-- grand vase (bleu) -->
  <defs><clipPath id="vase"><path d="M950 132 L1030 132 L1020 150 Q1016 178 1068 206 Q1094 246 1074 290 Q1056 320 1032 330 L948 330 Q924 320 906 290 Q886 246 912 206 Q964 178 960 150 Z"/></clipPath></defs>
  <path d="M950 132 L1030 132 L1020 150 Q1016 178 1068 206 Q1094 246 1074 290 Q1056 320 1032 330 L948 330 Q924 320 906 290 Q886 246 912 206 Q964 178 960 150 Z" fill="{{subject}}"/>
  <g clip-path="url(#vase)"><rect x="880" y="236" width="220" height="12" fill="{{light}}"/><rect x="880" y="258" width="220" height="5" fill="{{light}}"/></g>
  <ellipse cx="990" cy="132" rx="44" ry="7" fill="{{shadow}}"/>
  <!-- potelets et cordon -->
  <g fill="{{shadow}}">
    <rect x="796" y="404" width="9" height="92"/><circle cx="800" cy="402" r="9"/><ellipse cx="800" cy="497" rx="22" ry="6"/>
    <rect x="1176" y="404" width="9" height="92"/><circle cx="1180" cy="402" r="9"/><ellipse cx="1180" cy="497" rx="22" ry="6"/>
  </g>
  <path d="M806 410 Q990 468 1174 410" fill="none" stroke="{{deep}}" stroke-width="8" stroke-linecap="round"/>
  <!-- la gardienne remet une clé au visiteur -->
  <use href="#woman" fill="{{shadow}}" transform="translate(600 500) scale(2)"/>
  <path d="M612 344 L628 376 L646 378" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#man" fill="{{shadow}}" transform="translate(712 500) scale(-2 2)"/>
  <path d="M696 346 L682 376 L666 378" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="654" cy="392" r="8" fill="none" stroke="{{deep}}" stroke-width="4"/>
  <rect x="652" y="399" width="5" height="30" fill="{{deep}}"/>
  <rect x="657" y="418" width="9" height="4" fill="{{deep}}"/><rect x="657" y="425" width="6" height="4" fill="{{deep}}"/>

</svg>
