<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Claude Team, ChatGPT Business ou Mistral Vibe Team » : trois voitures de train de tailles différentes sur une voie ; sur le quai, une équipe de trois personnes compare avant de monter.
       Hero de billet (multiply sur fond paper) : fond crème, aucun aplat ne touche les bords,
       sol en ellipse, sujet entre x 300 et 1250. Distribution creme-aere ; silhouettes en {{shadow}}. -->
  <defs><g id="man"><circle cx="1" cy="-90" r="7.5"/><path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/><rect x="-11.5" y="-44" width="9.5" height="42"/><rect x="2" y="-44" width="9.5" height="42"/><rect x="-12" y="-3" width="11" height="3" rx="1.5"/><rect x="2" y="-3" width="13" height="3" rx="1.5"/></g><g id="woman"><circle cx="1" cy="-90" r="7"/><circle cx="-5" cy="-95" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g></defs>
  <rect width="1456" height="624" fill="{{field}}"/>

  <ellipse cx="660" cy="506" rx="400" ry="22" fill="{{ground}}"/>
  <g fill="{{shape}}"><rect x="320" y="478" width="22" height="10"/><rect x="380" y="478" width="22" height="10"/><rect x="440" y="478" width="22" height="10"/><rect x="500" y="478" width="22" height="10"/><rect x="560" y="478" width="22" height="10"/><rect x="620" y="478" width="22" height="10"/><rect x="680" y="478" width="22" height="10"/><rect x="740" y="478" width="22" height="10"/></g>
  <rect x="310" y="470" width="470" height="8" fill="{{detail}}"/>
  <!-- petite voiture -->
  <rect x="320" y="384" width="104" height="72" rx="8" fill="{{subject}}"/>
  <rect x="352" y="400" width="36" height="26" fill="{{light}}"/>
  <circle cx="344" cy="462" r="11" fill="{{detail}}"/><circle cx="400" cy="462" r="11" fill="{{detail}}"/>
  <!-- moyenne -->
  <rect x="440" y="352" width="140" height="104" rx="8" fill="{{deep}}"/>
  <rect x="458" y="372" width="40" height="32" fill="{{light}}"/><rect x="520" y="372" width="40" height="32" fill="{{light}}"/>
  <circle cx="470" cy="462" r="11" fill="{{detail}}"/><circle cx="550" cy="462" r="11" fill="{{detail}}"/>
  <!-- grande -->
  <rect x="598" y="300" width="186" height="156" rx="10" fill="{{detail}}"/>
  <rect x="598" y="292" width="186" height="14" rx="6" fill="{{subject}}"/>
  <rect x="616" y="326" width="42" height="36" fill="{{light}}"/><rect x="670" y="326" width="42" height="36" fill="{{light}}"/><rect x="724" y="326" width="42" height="36" fill="{{light}}"/>
  <circle cx="630" cy="462" r="11" fill="{{subject}}"/><circle cx="752" cy="462" r="11" fill="{{subject}}"/>
  <!-- quai et équipe -->
  <rect x="820" y="440" width="230" height="60" fill="{{shape}}"/>
  <rect x="814" y="434" width="242" height="10" fill="{{detail}}"/>
  <use href="#man" fill="{{shadow}}" transform="translate(880 434) scale(-1.85 1.85)"/>
  <use href="#woman" fill="{{shadow}}" transform="translate(940 434) scale(-1.85 1.85)"/>
  <use href="#man" fill="{{shadow}}" transform="translate(1002 434) scale(-1.85 1.85)"/>
  <path d="M866 291 L852 314 L836 310" fill="none" stroke="{{shadow}}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
