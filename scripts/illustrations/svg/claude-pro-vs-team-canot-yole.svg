<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Claude Pro ou Team » : au ponton, un canot pour une personne et une yole à
       quatre places avec un barreur. Une personne rame seule ; une équipe rame ensemble, avec
       quelqu'un qui tient la barre. Rôles remplacés par render-svg.mjs
       (ground = l'eau, shape = la yole, detail = reflets et avirons). -->

  <!-- Ciel -->
  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Soleil et nuage -->
  <circle cx="1180" cy="150" r="58" fill="{{pale}}"/>
  <g fill="{{soft}}">
    <circle cx="300" cy="130" r="30"/>
    <circle cx="340" cy="114" r="40"/>
    <circle cx="386" cy="128" r="32"/>
    <rect x="276" y="128" width="136" height="34" rx="17"/>
  </g>

  <!-- Rive lointaine -->
  <path d="M0 330 Q240 300 520 318 T1040 312 T1456 322 L1456 352 L0 352 Z" fill="{{deep}}"/>

  <!-- Eau -->
  <rect y="350" width="1456" height="274" fill="{{ground}}"/>
  <g fill="{{detail}}">
    <rect x="120" y="410" width="90" height="5" rx="2.5"/>
    <rect x="1180" y="560" width="120" height="5" rx="2.5"/>
    <rect x="980" y="400" width="70" height="5" rx="2.5"/>
    <rect x="300" y="580" width="110" height="5" rx="2.5"/>
  </g>

  <!-- Ponton, à gauche -->
  <rect x="0" y="420" width="250" height="18" fill="{{deep}}"/>
  <rect x="40" y="436" width="12" height="70" fill="{{deep}}"/>
  <rect x="190" y="436" width="12" height="70" fill="{{deep}}"/>

  <!-- Le canot, un seul rameur -->
  <path d="M290 470 L470 470 Q458 498 430 500 L322 500 Q298 498 290 470 Z" fill="{{mid}}"/>
  <g transform="translate(380 474) scale(1.3)">
    <g fill="{{subject}}">
      <circle cx="0" cy="-40" r="7"/>
      <path d="M-10 -30 Q0 -34 10 -30 L11 0 L-11 0 Z"/>
    </g>
  </g>
  <path d="M332 444 L452 512" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>

  <!-- La yole : quatre rameurs et un barreur -->
  <path d="M620 470 L1310 470 Q1292 506 1240 510 L690 510 Q640 506 620 470 Z" fill="{{shape}}"/>
  <rect x="640" y="466" width="660" height="6" fill="{{detail}}"/>
  <!-- Avirons -->
  <g stroke="{{subject}}" stroke-width="5" stroke-linecap="round">
    <path d="M740 440 L700 540"/>
    <path d="M860 440 L820 540"/>
    <path d="M980 440 L940 540"/>
    <path d="M1100 440 L1060 540"/>
  </g>
  <!-- Rameurs -->
  <g fill="{{subject}}">
    <circle cx="760" cy="420" r="9"/>
    <path d="M747 432 Q760 427 773 432 L775 470 L745 470 Z"/>
    <circle cx="880" cy="420" r="9"/>
    <path d="M867 432 Q880 427 893 432 L895 470 L865 470 Z"/>
    <circle cx="1000" cy="420" r="9"/>
    <path d="M987 432 Q1000 427 1013 432 L1015 470 L985 470 Z"/>
    <circle cx="1120" cy="420" r="9"/>
    <path d="M1107 432 Q1120 427 1133 432 L1135 470 L1105 470 Z"/>
    <!-- Barreur, tourné vers l'équipe, avec la barre -->
    <circle cx="1240" cy="416" r="9"/>
    <path d="M1226 428 Q1240 423 1254 428 L1256 470 L1224 470 Z"/>
  </g>
  <path d="M1258 446 L1296 446 L1296 476" fill="none" stroke="{{subject}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
