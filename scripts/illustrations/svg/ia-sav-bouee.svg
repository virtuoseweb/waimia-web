<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour le SAV en PME » : au comptoir du service après-vente, la conseillère tend une
       bouée (detail = bleu) par-dessus le comptoir à un client contrarié, un petit nuage de
       pluie au-dessus de la tête ; derrière elle, l'étagère des réponses.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="870" cy="506" rx="370" ry="22" fill="{{ground}}"/>
  <!-- Étagère des réponses -->
  <rect x="982" y="180" width="30" height="70" fill="{{mid}}"/><rect x="1014" y="192" width="22" height="58" fill="{{mid}}"/><rect x="1038" y="174" width="34" height="76" fill="{{mid}}"/><rect x="1074" y="188" width="24" height="62" fill="{{mid}}"/><rect x="1100" y="180" width="28" height="70" fill="{{mid}}"/>
  <rect x="1132" y="196" width="22" height="56" fill="{{mid}}" transform="rotate(14 1132 252)"/>
  <rect x="966" y="250" width="216" height="9" fill="{{deep}}"/>
  <!-- La conseillère derrière le comptoir -->
  <use href="#woman" transform="translate(1010 500) scale(-2.1 2.1)"/>
  <!-- Comptoir -->
  <rect x="566" y="398" width="608" height="102" fill="{{shape}}"/>
  <rect x="586" y="418" width="276" height="66" fill="{{pale}}"/>
  <rect x="878" y="418" width="276" height="66" fill="{{pale}}"/>
  <rect x="556" y="388" width="628" height="13" fill="{{deep}}"/>
  <!-- Le client et son nuage -->
  <use href="#man" transform="translate(680 500) scale(2 2)"/>
  <g fill="{{mid}}"><circle cx="660" cy="236" r="20"/><circle cx="686" cy="226" r="26"/><circle cx="712" cy="238" r="18"/><rect x="640" y="236" width="90" height="20" rx="10"/></g>
  <g stroke="{{mid}}" stroke-width="4" stroke-linecap="round"><path d="M656 266 L650 280"/><path d="M680 266 L674 280"/><path d="M704 266 L698 280"/></g>
  <!-- La bouée tendue entre eux -->
  <circle cx="850" cy="322" r="46" fill="none" stroke="{{detail}}" stroke-width="34"/>
  <circle cx="850" cy="322" r="46" fill="none" stroke="{{light}}" stroke-width="34" stroke-dasharray="22 50.26" stroke-dashoffset="11"/>
  <circle cx="850" cy="322" r="64" fill="none" stroke="{{deep}}" stroke-width="3"/>
  <circle cx="850" cy="322" r="28" fill="none" stroke="{{deep}}" stroke-width="3"/>
  <path d="M998 336 L952 330 L914 324" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M696 344 L748 332 L786 324" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
