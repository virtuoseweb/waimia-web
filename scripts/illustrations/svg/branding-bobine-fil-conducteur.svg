<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · « un fil conducteur » (module Agence de branding) : une personne déroule une bobine ; le fil traverse une maison, une camionnette, une boutique et un clocher. Rôles remplacés par render-svg.mjs. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
    </g>
  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1090" cy="330" r="200" fill="{{shape}}"/>
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect y="496" width="1456" height="6" fill="{{mid}}"/>
  <!-- maison -->
  <g fill="{{mid}}">
    <rect x="330" y="380" width="190" height="120"/>
    <path d="M308 382 L425 296 L542 382 Z"/>
    <rect x="474" y="316" width="24" height="52"/>
  </g>
  <rect x="408" y="430" width="36" height="70" fill="{{light}}"/>
  <rect x="352" y="412" width="40" height="38" fill="{{light}}"/>
  <rect x="462" y="412" width="40" height="38" fill="{{light}}"/>
  <!-- camionnette -->
  <g fill="{{mid}}">
    <rect x="640" y="420" width="150" height="80" rx="6"/>
    <path d="M790 440 L838 440 L866 470 L866 500 L790 500 Z"/>
  </g>
  <path d="M800 450 L832 450 L852 472 L800 472 Z" fill="{{light}}"/>
  <circle cx="694" cy="482" r="22" fill="{{subject}}"/><circle cx="694" cy="482" r="8" fill="{{light}}"/>
  <circle cx="824" cy="482" r="22" fill="{{subject}}"/><circle cx="824" cy="482" r="8" fill="{{light}}"/>
  <!-- boutique à auvent rayé -->
  <rect x="960" y="392" width="200" height="108" fill="{{mid}}"/>
  <rect x="992" y="430" width="52" height="70" fill="{{light}}"/>
  <rect x="1066" y="420" width="72" height="50" fill="{{light}}"/>
  <g>
    <rect x="948" y="372" width="224" height="28" fill="{{subject}}"/>
    <rect x="972" y="372" width="28" height="28" fill="{{light}}"/><rect x="1028" y="372" width="28" height="28" fill="{{light}}"/>
    <rect x="1084" y="372" width="28" height="28" fill="{{light}}"/><rect x="1140" y="372" width="28" height="28" fill="{{light}}"/>
  </g>
  <!-- clocher -->
  <rect x="1272" y="270" width="40" height="230" fill="{{mid}}"/>
  <path d="M1262 272 L1292 206 L1322 272 Z" fill="{{mid}}"/>
  <rect x="1284" y="300" width="16" height="30" fill="{{light}}"/>
  <!-- bobine -->
  <rect x="104" y="448" width="42" height="48" fill="{{subject}}"/>
  <rect x="94" y="440" width="62" height="9" fill="{{subject}}"/><rect x="94" y="495" width="62" height="9" fill="{{subject}}"/>
  <use href="#man" transform="translate(262 500) scale(1.15)"/>
  <!-- le fil -->
  <path d="M146 462 C240 330 320 238 428 238 C548 238 600 392 716 404 C830 416 900 330 1056 348 C1190 364 1230 222 1292 214" fill="none" stroke="{{subject}}" stroke-width="11" stroke-linecap="round"/>
  <g fill="{{subject}}">
    <circle cx="428" cy="240" r="13"/><circle cx="716" cy="405" r="13"/><circle cx="1056" cy="349" r="13"/><circle cx="1292" cy="214" r="13"/>
  </g>
  <g fill="{{light}}">
    <circle cx="428" cy="240" r="5"/><circle cx="716" cy="405" r="5"/><circle cx="1056" cy="349" r="5"/><circle cx="1292" cy="214" r="5"/>
  </g>
</svg>
