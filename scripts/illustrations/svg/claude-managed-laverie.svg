<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Claude Managed Agents » : une laverie automatique. Trois machines tournent
       dans un local qui n'est pas le vôtre, payées au temps de marche ; une femme apporte son
       panier à la machine ouverte. On loue la machine, on garde son linge.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 580 et 1170. Rôles : subject = les hublots ; silhouette en {{shadow}}. -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <ellipse cx="880" cy="506" rx="380" ry="22" fill="{{ground}}"/>
  <ellipse cx="936" cy="502" rx="250" ry="8" fill="{{shape}}"/>
  <ellipse cx="620" cy="502" rx="36" ry="6" fill="{{shape}}"/>
  <!-- Étagère au-dessus des machines, une pendule sans chiffres -->
  <rect x="700" y="240" width="472" height="10" fill="{{deep}}"/>
  <circle cx="1092" cy="204" r="30" fill="{{pale}}" stroke="{{deep}}" stroke-width="6"/>
  <path d="M1092 204 L1092 184 M1092 204 L1106 212" stroke="{{shadow}}" stroke-width="4" stroke-linecap="round"/>
  <rect x="760" y="218" width="40" height="22" fill="{{pale}}" stroke="{{deep}}" stroke-width="3"/>
  <rect x="710" y="330" width="140" height="170" rx="6" fill="{{shape}}"/><rect x="710" y="330" width="140" height="30" rx="6" fill="{{deep}}"/><circle cx="822" cy="345" r="7" fill="{{shape}}"/><rect x="726" y="341" width="34" height="8" rx="2" fill="{{pale}}"/><circle cx="780" cy="428" r="44" fill="{{deep}}"/><circle cx="780" cy="428" r="34" fill="{{shadow}}"/><ellipse cx="714" cy="428" rx="16" ry="50" fill="{{deep}}"/><ellipse cx="714" cy="428" rx="10" ry="40" fill="{{subject}}"/><rect x="866" y="330" width="140" height="170" rx="6" fill="{{shape}}"/><rect x="866" y="330" width="140" height="30" rx="6" fill="{{deep}}"/><circle cx="978" cy="345" r="7" fill="{{shape}}"/><rect x="882" y="341" width="34" height="8" rx="2" fill="{{pale}}"/><circle cx="936" cy="428" r="50" fill="{{deep}}"/><circle cx="936" cy="428" r="40" fill="{{subject}}"/><path d="M898 440 Q916 426 936 438 Q956 450 974 436 A40 40 0 0 1 898 440 Z" fill="{{soft}}"/><rect x="1022" y="330" width="140" height="170" rx="6" fill="{{shape}}"/><rect x="1022" y="330" width="140" height="30" rx="6" fill="{{deep}}"/><circle cx="1134" cy="345" r="7" fill="{{shape}}"/><rect x="1038" y="341" width="34" height="8" rx="2" fill="{{pale}}"/><circle cx="1092" cy="428" r="50" fill="{{deep}}"/><circle cx="1092" cy="428" r="40" fill="{{subject}}"/><path d="M1054 440 Q1072 426 1092 438 Q1112 450 1130 436 A40 40 0 0 1 1054 440 Z" fill="{{soft}}"/>
  <!-- La femme porte son panier de linge vers la machine ouverte -->
  <g transform="translate(620 500) scale(2.1)">
    <g fill="{{shadow}}">
      <circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/>
      <rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/>
    </g>
    <path d="M6 -78 L12 -62 L20 -58" fill="none" stroke="{{shadow}}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 -62 L34 -62 L31 -46 L15 -46 Z" fill="{{pale}}" stroke="{{deep}}" stroke-width="1.6"/>
    <path d="M15 -62 Q20 -68 24 -63 Q28 -69 32 -62 Z" fill="{{soft}}"/>
  </g>
</svg>
