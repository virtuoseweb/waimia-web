<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- tritone ciel-bleu · deux portes identiques seules sur une plaine ; une silhouette entre les deux réfléchit ; derrière l'une, un chemin mène à des bâtiments au loin. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>

  </defs>
  <rect width="1456" height="624" fill="{{field}}"/>
  <path d="M170 150 q0 -26 30 -28 q10 -34 50 -28 q22 -28 60 -10 q36 -6 44 30 q24 4 22 36 Z" fill="{{detail}}"/>
  <path d="M1110 118 q0 -22 26 -24 q8 -28 42 -24 q18 -24 50 -8 q30 -4 36 24 q20 4 18 32 Z" fill="{{detail}}"/>
  <!-- plaine, horizon bas -->
  <rect y="460" width="1456" height="164" fill="{{ground}}"/>
  <rect y="456" width="1456" height="5" fill="{{soft}}"/>
  <!-- bâtiments simples au loin, à droite -->
  <g fill="{{subject}}">
    <rect x="1190" y="428" width="34" height="32"/><path d="M1186 430 L1207 412 L1228 430 Z"/>
    <rect x="1232" y="418" width="26" height="42"/>
    <rect x="1264" y="436" width="40" height="24"/><path d="M1260 438 L1284 422 L1308 438 Z"/>
  </g>
  <!-- chemin qui part de derrière la porte de droite -->
  <path d="M918 572 L1000 572 L1250 461 L1232 461 Z" fill="{{light}}"/>
  <!-- ombres portées des portes -->
  <path d="M470 572 L590 572 L470 596 L350 596 Z" fill="{{soft}}"/>
  <path d="M900 572 L1020 572 L900 596 L780 596 Z" fill="{{soft}}"/>
  <!-- porte gauche -->
  <rect x="466" y="282" width="128" height="292" fill="{{shape}}"/>
  <rect x="482" y="298" width="96" height="276" fill="{{shadow}}"/>
  <rect x="490" y="310" width="80" height="110" fill="{{deep}}"/>
  <rect x="490" y="432" width="80" height="128" fill="{{deep}}"/>
  <circle cx="566" cy="440" r="5" fill="{{light}}"/>
  <!-- porte droite -->
  <rect x="896" y="282" width="128" height="292" fill="{{shape}}"/>
  <rect x="912" y="298" width="96" height="276" fill="{{shadow}}"/>
  <rect x="920" y="310" width="80" height="110" fill="{{deep}}"/>
  <rect x="920" y="432" width="80" height="128" fill="{{deep}}"/>
  <circle cx="996" cy="440" r="5" fill="{{light}}"/>
  <!-- silhouette de dos, au milieu, main au menton -->
  <use href="#man" transform="translate(745 588) scale(1.25)"/>
  <ellipse cx="745" cy="589" rx="20" ry="3" fill="{{soft}}"/>
</svg>
