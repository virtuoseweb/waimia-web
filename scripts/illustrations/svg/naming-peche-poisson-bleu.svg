  <g fill="{{subject}}"><rect x="60" y="388" width="14" height="110"/><rect x="200" y="388" width="14" height="110"/><rect x="340" y="388" width="14" height="110"/><rect x="470" y="388" width="14" height="110"/></g>
  <!-- pêcheur -->
  <use href="#man" transform="translate(420 372) scale(1.5)"/>
  <path d="M432 262 L640 70" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
