<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B · forme-bleue · « ce que lit l'assistant d'achat » : une étiquette
       géante flotte comme un cerf-volant, retenue par sa ficelle à un petit colis posé sur la
       plaine ; une silhouette la lit et la désigne du bras, une autre arrive avec un panier. Sur
       l'étiquette, des barres et une rangée de points (fiche produit, avis), aucune lettre. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z"/>
      <rect x="-11.5" y="-44" width="9.5" height="42"/>
      <rect x="2" y="-44" width="9.5" height="42"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7"/>
      <circle cx="-4" cy="-96" r="5"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/>
      <rect x="-6" y="-25" width="4" height="23"/>
      <rect x="2" y="-25" width="4" height="23"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z"/>
    </g>
  </defs>

  <!-- Fond uni, sol pâle -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <rect y="486" width="1456" height="138" fill="{{ground}}"/>

  <!-- Ficelle : du colis au trou de l'étiquette -->
  <path d="M560 470 Q560 330 700 250 Q740 228 752 214" fill="none" stroke="{{shadow}}" stroke-width="4" stroke-linecap="round"/>

  <!-- Étiquette géante, inclinée -->
  <g transform="translate(740 70) rotate(8)">
    <path d="M0 110 L78 0 L470 0 L470 250 L78 250 Z" fill="{{shape}}"/>
    <circle cx="66" cy="125" r="22" fill="{{detail}}"/>
    <circle cx="66" cy="125" r="12" fill="{{field}}"/>
    <!-- Fiche produit : trois barres claires -->
    <g fill="{{detail}}">
      <rect x="140" y="52" width="260" height="20"/>
      <rect x="140" y="96" width="190" height="14"/>
      <rect x="140" y="128" width="224" height="14"/>
    </g>
    <!-- Avis : rangée de cinq points, quatre pleins -->
    <g fill="{{subject}}">
      <circle cx="152" cy="190" r="12"/><circle cx="188" cy="190" r="12"/>
      <circle cx="224" cy="190" r="12"/><circle cx="260" cy="190" r="12"/>
    </g>
    <circle cx="296" cy="190" r="10" fill="none" stroke="{{subject}}" stroke-width="4"/>
  </g>

  <!-- Petit colis ficelé, posé au sol -->
  <g>
    <rect x="520" y="468" width="80" height="56" fill="{{deep}}"/>
    <rect x="520" y="468" width="80" height="10" fill="{{shadow}}"/>
    <rect x="556" y="468" width="8" height="56" fill="{{light}}"/>
    <rect x="520" y="492" width="80" height="6" fill="{{light}}"/>
  </g>

  <!-- Le lecteur : tourné vers l'étiquette, il la désigne du bras -->
  <use href="#man" fill="{{subject}}" transform="translate(660 548) scale(1.5)"/>
  <path d="M674 432 L706 398" stroke="{{subject}}" stroke-width="7" stroke-linecap="round"/>

  <!-- L'acheteuse arrive par la gauche avec un panier -->
  <use href="#woman" fill="{{subject}}" transform="translate(330 552) scale(1.5)"/>
  <path d="M342 434 L354 470" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>
  <path d="M338 470 L376 470 L370 496 L344 496 Z" fill="{{subject}}"/>
  <path d="M342 470 Q357 448 372 470" fill="none" stroke="{{subject}}" stroke-width="3"/>
</svg>
