<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · moteur B (Claude dessine) · « un même modèle, deux entrées » (Fable et Mythos) :
       une grande tour en gradins ; à gauche une large arche ouverte où entrent des silhouettes,
       à droite une petite porte close derrière une barrière levée à la demande, des visiteurs
       attendent. Rôles remplacés par render-svg.mjs. Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-92" r="7" fill="{{subject}}"/>
      <path d="M-7 -95 Q0 -104 7 -95 L7 -97 Q0 -108 -7 -97 Z" fill="{{subject}}"/>
      <path d="M-9 -83 L9 -83 L8 -34 L-8 -34 Z" fill="{{subject}}"/>
      <path d="M-2.5 -83 L0 -76 L2.5 -83 Z" fill="{{light}}"/>
      <rect x="-6" y="-35" width="5" height="35" fill="{{subject}}"/>
      <rect x="1" y="-35" width="5" height="35" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
    <g id="folder">
      <rect x="0" y="-62" width="18" height="24" fill="{{light}}"/>
      <rect x="0" y="-62" width="18" height="24" fill="none" stroke="{{subject}}" stroke-width="2"/>
    </g>
  </defs>

  <!-- Grand fond uni et grand disque pâle à droite -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1180" cy="300" r="135" fill="{{soft}}"/>

  <!-- Sol : bande basse, horizon franc -->
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>
  <rect y="514" width="1456" height="8" fill="{{deep}}"/>

  <!-- La tour : trois gradins, la grande forme -->
  <rect x="300" y="380" width="520" height="140" fill="{{shape}}"/>
  <rect x="370" y="250" width="380" height="132" fill="{{shape}}"/>
  <rect x="450" y="120" width="220" height="132" fill="{{shape}}"/>
  <rect x="440" y="108" width="240" height="14" fill="{{shadow}}"/>
  <rect x="360" y="238" width="400" height="14" fill="{{shadow}}"/>
  <rect x="290" y="368" width="540" height="14" fill="{{shadow}}"/>
  <!-- Fenêtres des gradins -->
  <g fill="{{detail}}">
    <rect x="490" y="156" width="26" height="40"/><rect x="547" y="156" width="26" height="40"/><rect x="604" y="156" width="26" height="40"/>
    <rect x="410" y="286" width="26" height="40"/><rect x="467" y="286" width="26" height="40"/><rect x="524" y="286" width="26" height="40"/><rect x="581" y="286" width="26" height="40"/><rect x="638" y="286" width="26" height="40"/><rect x="695" y="286" width="26" height="40"/>
  </g>

  <!-- Entrée de gauche : large arche ouverte, intérieur clair -->
  <path d="M338 520 V452 A52 52 0 0 1 442 452 V520 Z" fill="{{light}}"/>
  <path d="M338 520 V452 A52 52 0 0 1 442 452 V520 Z" fill="none" stroke="{{shadow}}" stroke-width="5"/>
  <path d="M372 520 V470 A18 18 0 0 1 408 470 V520 Z" fill="{{pale}}"/>

  <!-- Visiteurs qui entrent, un file sans attente -->
  <use href="#man" transform="translate(100 520) scale(0.95)"/>
  <use href="#man" transform="translate(165 520) scale(1)"/>
  <use href="#man" transform="translate(228 520) scale(0.97)"/>
  <use href="#man" transform="translate(288 520) scale(0.92)"/>

  <!-- Entrée de droite : petite porte close, au flanc de la tour -->
  <path d="M708 520 V466 A22 22 0 0 1 752 466 V520 Z" fill="{{shadow}}"/>
  <circle cx="742" cy="494" r="3" fill="{{light}}"/>

  <!-- Guérite et barrière baissée -->
  <rect x="790" y="452" width="62" height="68" fill="{{soft}}"/>
  <rect x="782" y="444" width="78" height="10" fill="{{shadow}}"/>
  <rect x="802" y="466" width="26" height="22" fill="{{light}}"/>
  <rect x="896" y="462" width="14" height="58" fill="{{shadow}}"/>
  <g>
    <rect x="910" y="468" width="126" height="9" fill="{{light}}"/>
    <rect x="928" y="468" width="22" height="9" fill="{{shadow}}"/>
    <rect x="972" y="468" width="22" height="9" fill="{{shadow}}"/>
    <rect x="1016" y="468" width="20" height="9" fill="{{shadow}}"/>
    <rect x="1036" y="464" width="10" height="56" fill="{{shadow}}"/>
  </g>
  <!-- Le gardien, côté guérite -->
  <use href="#man" transform="translate(872 520) scale(0.98)"/>

  <!-- Ceux qui attendent à l'extérieur, un dossier à la main -->
  <use href="#man" transform="translate(1100 520) scale(0.96)"/>
  <use href="#folder" transform="translate(1074 520) scale(1)"/>
  <use href="#man" transform="translate(1160 520) scale(0.9)"/>
  <use href="#man" transform="translate(1215 520) scale(0.84)"/>
</svg>
