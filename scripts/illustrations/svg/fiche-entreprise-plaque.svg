<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · Claude dessine · « revendiquer sa fiche » : sur un grand mur couvert de plaques
       anonymes, une petite silhouette en haut d'une échelle fixe SA plaque, la seule en couleur
       ({{subject}}), pendant qu'une collègue tient l'échelle. Aucun texte. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{shadow}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{shadow}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{shadow}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{shadow}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{shadow}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{shadow}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{shadow}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{shadow}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{shadow}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{shadow}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{shadow}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{shadow}}"/>
    </g>
    <g id="plate">
      <rect x="-34" y="-20" width="68" height="40" fill="{{detail}}"/>
      <rect x="-34" y="16" width="68" height="4" fill="{{deep}}" opacity="0.25"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <!-- Disque de soleil, à gauche -->
  <circle cx="230" cy="250" r="120" fill="{{ground}}"/>
  <!-- Sol -->
  <rect y="520" width="1456" height="104" fill="{{ground}}"/>

  <!-- Le grand mur -->
  <rect x="470" y="70" width="760" height="452" fill="{{shape}}"/>
  <rect x="470" y="70" width="760" height="14" fill="{{deep}}" opacity="0.3"/>

  <!-- Plaques anonymes, en rangées -->
  <g>
    <use href="#plate" transform="translate(540 140)"/><use href="#plate" transform="translate(640 140)"/>
    <use href="#plate" transform="translate(740 140)"/>
    <use href="#plate" transform="translate(1040 140)"/>
    <use href="#plate" transform="translate(1140 140)"/>
    <use href="#plate" transform="translate(540 220)"/><use href="#plate" transform="translate(640 220)"/>
    <use href="#plate" transform="translate(740 220)"/>
    <use href="#plate" transform="translate(1040 220)"/>
    <use href="#plate" transform="translate(1140 220)"/>
    <use href="#plate" transform="translate(540 300)"/><use href="#plate" transform="translate(640 300)"/>
    <use href="#plate" transform="translate(740 300)"/><use href="#plate" transform="translate(840 300)"/>
    <use href="#plate" transform="translate(940 300)"/><use href="#plate" transform="translate(1040 300)"/>
    <use href="#plate" transform="translate(1140 300)"/>
    <use href="#plate" transform="translate(540 380)"/><use href="#plate" transform="translate(640 380)"/>
    <use href="#plate" transform="translate(740 380)"/><use href="#plate" transform="translate(840 380)"/>
    <use href="#plate" transform="translate(940 380)"/><use href="#plate" transform="translate(1040 380)"/>
    <use href="#plate" transform="translate(1140 380)"/>
  </g>

  <!-- SA plaque, la seule en couleur, un peu plus grande -->
  <rect x="790" y="160" width="170" height="104" fill="{{subject}}"/>
  <rect x="790" y="260" width="170" height="4" fill="{{shadow}}" opacity="0.3"/>
  <circle cx="802" cy="172" r="4" fill="{{shadow}}"/>
  <circle cx="948" cy="172" r="4" fill="{{shadow}}"/>

  <!-- Ombre au pied du mur -->
  <rect x="470" y="518" width="760" height="8" fill="{{deep}}" opacity="0.35"/>

  <!-- Échelle appuyée au mur -->
  <g stroke="{{shadow}}" stroke-width="7" stroke-linecap="round">
    <line x1="760" y1="520" x2="806" y2="268"/>
    <line x1="816" y1="520" x2="856" y2="268"/>
  </g>
  <g stroke="{{shadow}}" stroke-width="5">
    <line x1="764" y1="490" x2="818" y2="490"/>
    <line x1="770" y1="450" x2="823" y2="450"/>
    <line x1="777" y1="410" x2="828" y2="410"/>
    <line x1="784" y1="370" x2="833" y2="370"/>
    <line x1="791" y1="330" x2="838" y2="330"/>
    <line x1="798" y1="292" x2="843" y2="292"/>
  </g>

  <!-- La silhouette en haut de l'échelle, bras levé vers sa plaque -->
  <use href="#man" transform="translate(826 372) scale(1.05)"/>
  <line x1="836" y1="290" x2="850" y2="262" stroke="{{shadow}}" stroke-width="7" stroke-linecap="round"/>

  <!-- La collègue qui tient l'échelle -->
  <use href="#woman" transform="translate(738 522) scale(1.05)"/>
  <line x1="746" y1="458" x2="764" y2="470" stroke="{{shadow}}" stroke-width="6" stroke-linecap="round"/>

  <!-- Passant au loin, à droite -->
  <use href="#man" transform="translate(1330 522) scale(0.8)"/>
</svg>
