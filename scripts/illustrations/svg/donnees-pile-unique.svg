<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · fallback Claude · « des données éparpillées qui convergent en une pile unique ».
       Rôles de couleur remplacés par render-svg.mjs (paper / ink). -->
  <defs>
    <!-- Silhouette homme années 60, pieds à y=0, hauteur 100. -->
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <path d="M-2.5 -80 L0 -72 L2.5 -80 Z" fill="{{light}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
    </g>
    <!-- Feuille de papier volante. -->
    <g id="sheet">
      <rect x="-22" y="-15" width="44" height="30" fill="{{light}}"/>
      <rect x="-22" y="-15" width="44" height="30" fill="none" stroke="{{deep}}" stroke-width="1.2"/>
      <rect x="-16" y="-8" width="24" height="2.2" fill="{{pale}}"/>
      <rect x="-16" y="-2" width="30" height="2.2" fill="{{pale}}"/>
      <rect x="-16" y="4" width="18" height="2.2" fill="{{pale}}"/>
    </g>
    <clipPath id="above-ground"><rect width="1456" height="500"/></clipPath>
  </defs>

  <!-- Ciel uni + grand disque derrière la pile -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="1030" cy="390" r="235" fill="{{shape}}" clip-path="url(#above-ground)"/>

  <!-- Sol : bande claire, horizon net -->
  <rect y="500" width="1456" height="124" fill="{{ground}}"/>
  <rect y="500" width="1456" height="3" fill="{{deep}}" opacity="0.55"/>

  <!-- Feuilles éparpillées qui convergent vers le sommet de la pile (courbe ascendante) -->
  <g>
    <use href="#sheet" transform="translate(120 470) rotate(-18) scale(0.7)"/>
    <use href="#sheet" transform="translate(205 418) rotate(24) scale(0.75)"/>
    <use href="#sheet" transform="translate(282 452) rotate(-40) scale(0.65)"/>
    <use href="#sheet" transform="translate(330 360) rotate(12) scale(0.8)"/>
    <use href="#sheet" transform="translate(410 405) rotate(-28) scale(0.72)"/>
    <use href="#sheet" transform="translate(458 300) rotate(35) scale(0.85)"/>
    <use href="#sheet" transform="translate(540 338) rotate(-12) scale(0.8)"/>
    <use href="#sheet" transform="translate(590 250) rotate(20) scale(0.9)"/>
    <use href="#sheet" transform="translate(668 282) rotate(-30) scale(0.85)"/>
    <use href="#sheet" transform="translate(720 205) rotate(8) scale(0.95)"/>
    <use href="#sheet" transform="translate(795 232) rotate(-16) scale(0.95)"/>
    <use href="#sheet" transform="translate(850 170) rotate(14) scale(1)"/>
    <use href="#sheet" transform="translate(905 190) rotate(-6) scale(1)"/>
  </g>
  <!-- Traînées de vent, fines -->
  <g fill="none" stroke="{{detail}}" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 430 Q300 330 560 290 T930 165"/>
    <path d="M150 500 Q380 400 620 340 T960 210"/>
  </g>

  <!-- La pile unique : feuilles empilées, tranche lignée -->
  <g>
    <rect x="955" y="215" width="150" height="285" fill="{{light}}"/>
    <g fill="{{pale}}">
      <rect x="955" y="226" width="150" height="2"/><rect x="955" y="240" width="150" height="2"/>
      <rect x="955" y="254" width="150" height="2"/><rect x="955" y="268" width="150" height="2"/>
      <rect x="955" y="282" width="150" height="2"/><rect x="955" y="296" width="150" height="2"/>
      <rect x="955" y="310" width="150" height="2"/><rect x="955" y="324" width="150" height="2"/>
      <rect x="955" y="338" width="150" height="2"/><rect x="955" y="352" width="150" height="2"/>
      <rect x="955" y="366" width="150" height="2"/><rect x="955" y="380" width="150" height="2"/>
      <rect x="955" y="394" width="150" height="2"/><rect x="955" y="408" width="150" height="2"/>
      <rect x="955" y="422" width="150" height="2"/><rect x="955" y="436" width="150" height="2"/>
      <rect x="955" y="450" width="150" height="2"/><rect x="955" y="464" width="150" height="2"/>
      <rect x="955" y="478" width="150" height="2"/><rect x="955" y="492" width="150" height="2"/>
    </g>
    <path d="M1105 215 L1121 205 L1121 492 L1105 500 Z" fill="{{deep}}"/>
    <path d="M955 215 L971 205 L1121 205 L1105 215 Z" fill="{{pale}}"/>
  </g>

  <!-- Échelle appuyée contre la pile -->
  <g stroke="{{subject}}" stroke-width="4" stroke-linecap="round">
    <line x1="905" y1="500" x2="958" y2="230"/>
    <line x1="928" y1="500" x2="978" y2="240"/>
    <g stroke-width="3">
      <line x1="911" y1="470" x2="934" y2="472"/><line x1="917" y1="440" x2="940" y2="442"/>
      <line x1="923" y1="410" x2="946" y2="412"/><line x1="929" y1="380" x2="952" y2="382"/>
      <line x1="935" y1="350" x2="958" y2="352"/><line x1="941" y1="320" x2="964" y2="322"/>
      <line x1="947" y1="290" x2="970" y2="292"/><line x1="953" y1="260" x2="976" y2="262"/>
    </g>
  </g>

  <!-- Personnage au sommet qui pose la dernière feuille -->
  <use href="#man" transform="translate(1030 205) scale(0.78)"/>
  <g transform="translate(1004 118) rotate(-8)">
    <rect x="-24" y="-8" width="40" height="27" fill="{{light}}" stroke="{{deep}}" stroke-width="1.2"/>
  </g>
  <path d="M1022 152 L1008 132" stroke="{{subject}}" stroke-width="5" stroke-linecap="round"/>

  <!-- Petit témoin au loin, de dos -->
  <use href="#man" transform="translate(250 560) scale(0.42)"/>
</svg>
