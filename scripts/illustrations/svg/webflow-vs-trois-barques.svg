<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Webflow, WordPress ou site codé » : au bout d'un ponton, un homme choisit entre trois
       embarcations amarrées, un voilier, une barque à rames et un canot à moteur
       (ground = eau bleue).
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="860" cy="482" rx="380" ry="36" fill="{{ground}}"/>
  <rect x="760" y="500" width="26" height="4" fill="{{detail}}"/><rect x="880" y="486" width="26" height="4" fill="{{detail}}"/><rect x="1000" y="506" width="26" height="4" fill="{{detail}}"/><rect x="1100" y="498" width="26" height="4" fill="{{detail}}"/><rect x="640" y="484" width="26" height="4" fill="{{detail}}"/><rect x="1170" y="482" width="26" height="4" fill="{{detail}}"/>
  <!-- Ponton -->
  <rect x="470" y="430" width="216" height="12" fill="{{deep}}"/>
  <rect x="520" y="442" width="10" height="50" fill="{{deep}}"/>
  <rect x="660" y="442" width="10" height="50" fill="{{deep}}"/>
  <path d="M680 440 L734 472" fill="none" stroke="{{deep}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Voilier -->
  <path d="M794 336 L794 462 L862 462 Z" fill="{{shape}}"/>
  <path d="M784 352 L784 462 L742 462 Z" fill="{{pale}}"/>
  <rect x="786" y="326" width="6" height="146" fill="{{deep}}"/>
  <path d="M728 468 L856 468 L840 492 L744 492 Z" fill="{{shadow}}"/>
  <!-- Barque à rames -->
  <path d="M912 476 L1012 476 L998 494 L926 494 Z" fill="{{mid}}"/>
  <path d="M922 470 L892 504" fill="none" stroke="{{deep}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1002 470 L1032 504" fill="none" stroke="{{deep}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Canot à moteur -->
  <rect x="1090" y="436" width="62" height="32" rx="4" fill="{{mid}}"/>
  <rect x="1104" y="444" width="34" height="12" rx="3" fill="{{light}}"/>
  <path d="M1056 466 L1198 466 L1182 492 L1068 492 Z" fill="{{shadow}}"/>
  <rect x="1044" y="452" width="14" height="30" rx="3" fill="{{deep}}"/>
  <!-- L'homme sur le ponton -->
  <use href="#man" transform="translate(640 430) scale(1.9 1.9)"/>
</svg>
