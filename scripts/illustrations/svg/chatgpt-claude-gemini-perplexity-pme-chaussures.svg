<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- tritone ciel-bleu · « trouver chaussure à son pied » : quatre chaussures géantes de formes
       différentes (botte cavalière, escarpin, mocassin, chaussure de marche) posées en rang sur
       une plaine ; deux petites silhouettes les comparent. Aucune n'est la meilleure partout. -->
  <defs>
    <g id="man">
      <circle cx="0" cy="-90" r="7.5" fill="{{subject}}"/>
      <path d="M-7.5 -93 Q0 -101 7.5 -93 L7 -90 Q0 -95 -7 -90 Z" fill="{{subject}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{subject}}"/>
      <rect x="-11.5" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="2" y="-44" width="9.5" height="42" fill="{{subject}}"/>
      <rect x="-13" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="1.5" y="-3" width="11.5" height="3" rx="1.5" fill="{{subject}}"/>
      <rect x="12" y="-46" width="16" height="12" fill="{{subject}}"/>
    </g>
    <g id="woman">
      <circle cx="0" cy="-90" r="7" fill="{{subject}}"/>
      <circle cx="-5" cy="-96" r="5" fill="{{subject}}"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z" fill="{{subject}}"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z" fill="{{subject}}"/>
      <rect x="-6" y="-25" width="4" height="23" fill="{{subject}}"/>
      <rect x="2" y="-25" width="4" height="23" fill="{{subject}}"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L8 -3 L8 0 L1 0 Z" fill="{{subject}}"/>
    </g>
  </defs>

  <!-- Grand ciel uni, soleil crème -->
  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="940" cy="150" r="46" fill="{{detail}}"/>

  <!-- Plaine -->
  <rect y="430" width="1456" height="194" fill="{{ground}}"/>
  <g transform="translate(730 430) scale(0.5) translate(-751 -470)">
  <!-- Ombres portées -->
  <g fill="{{soft}}">
    <path d="M120 470 L360 470 L420 500 L180 500 Z"/>
    <path d="M430 470 L700 470 L760 500 L490 500 Z"/>
    <path d="M740 470 L984 470 L1044 500 L800 500 Z"/>
    <path d="M1080 470 L1324 470 L1384 500 L1140 500 Z"/>
  </g>

  <!-- 1. Botte cavalière -->
  <path d="M356 470 L356 236 L272 236 L274 384 Q252 404 186 414 Q126 424 122 452 L122 470 Z" fill="{{shape}}"/>
  <rect x="266" y="222" width="96" height="18" fill="{{subject}}"/>
  <rect x="118" y="456" width="244" height="14" fill="{{subject}}"/>
  <rect x="318" y="440" width="44" height="20" fill="{{subject}}"/>
  <rect x="300" y="250" width="12" height="190" fill="{{deep}}"/>

  <!-- 2. Escarpin -->
  <path d="M436 470 L556 470 Q606 460 640 414 L668 410 L668 366 Q648 372 626 392 Q600 414 572 414 L516 410 Q456 418 436 450 Z" fill="{{shape}}"/>
  <path d="M640 414 L668 410 L658 470 L648 470 Z" fill="{{subject}}"/>
  <rect x="432" y="462" width="128" height="8" fill="{{subject}}"/>

  <!-- 3. Mocassin -->
  <path d="M744 470 L744 450 Q754 418 814 408 L864 398 Q904 392 944 378 L984 378 L988 470 Z" fill="{{shape}}"/>
  <rect x="740" y="456" width="252" height="14" fill="{{subject}}"/>
  <path d="M846 402 Q880 394 916 386 L920 400 Q884 408 850 416 Z" fill="{{deep}}"/>
  <rect x="872" y="392" width="20" height="6" fill="{{detail}}"/>

  <!-- 4. Chaussure de marche montante -->
  <path d="M1084 470 L1084 448 Q1094 420 1154 410 L1202 400 L1222 318 L1316 318 L1322 470 Z" fill="{{shape}}"/>
  <rect x="1214" y="306" width="110" height="16" fill="{{subject}}"/>
  <rect x="1080" y="452" width="246" height="18" fill="{{subject}}"/>
  <g fill="{{detail}}">
    <rect x="1214" y="338" width="26" height="6"/>
    <rect x="1210" y="358" width="26" height="6"/>
    <rect x="1206" y="378" width="26" height="6"/>
  </g>

  <!-- Silhouettes : une devant le mocassin, une qui marche vers la chaussure de marche -->
  <use href="#man" transform="translate(708 490) scale(1)"/>
  <use href="#woman" transform="translate(1034 492) scale(1)"/>
  <use href="#man" transform="translate(402 498) scale(0.86)"/>
  </g>
</svg>
