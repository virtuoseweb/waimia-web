    </g>
    <g id="walker">
      <circle cx="0" cy="-90" r="7.5" fill="{{shadow}}"/>
      <path d="M-11 -80 Q0 -84 11 -80 L13 -42 L-13 -42 Z" fill="{{shadow}}"/>
      <rect x="-5" y="-46" width="9.5" height="44" fill="{{shadow}}" transform="rotate(16 0 -44)"/>
      <rect x="-5" y="-46" width="9.5" height="44" fill="{{shadow}}" transform="rotate(-16 0 -44)"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>
  <circle cx="790" cy="300" r="230" fill="{{shape}}"/>
  <rect y="472" width="1456" height="152" fill="{{ground}}"/>
  <ellipse cx="700" cy="478" rx="330" ry="10" fill="{{soft}}"/>
  <path d="M-16 0 L-16 -300 Q4 -350 22 -300 L16 0 Z" fill="{{detail}}" transform="translate(930 440) rotate(-78)"/>
  <path d="M-12 0 L-12 -250 L-4 -262 L4 -250 L12 -262 L12 0 Z" fill="{{deep}}" transform="translate(930 440) rotate(-54)"/>
