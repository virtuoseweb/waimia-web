  <path d="M-9 0 L-9 -210 Q0 -240 9 -210 L9 0 Z" fill="{{subject}}" transform="translate(930 440) rotate(-8)"/>
  <path d="M-7 0 L-7 -180 L-14 -180 L-14 -196 L14 -196 L14 -180 L7 -180 L7 0 Z" fill="{{deep}}" transform="translate(930 440) rotate(14)"/>
  <path d="M-6 0 L-6 -150 L0 -176 L6 -150 L6 0 Z" fill="{{detail}}" transform="translate(930 440) rotate(34)"/>
  <rect x="380" y="410" width="580" height="62" rx="31" fill="{{subject}}"/>
  <rect x="404" y="426" width="520" height="8" rx="4" fill="{{deep}}"/>
  <circle cx="450" cy="450" r="9" fill="{{field}}"/><circle cx="700" cy="450" r="9" fill="{{field}}"/>
  <circle cx="930" cy="440" r="22" fill="{{field}}"/><circle cx="930" cy="440" r="10" fill="{{subject}}"/>
  <use href="#pointer" transform="translate(250 474) scale(1.15)"/>
  <use href="#woman" transform="translate(196 474) scale(1.1)"/>

