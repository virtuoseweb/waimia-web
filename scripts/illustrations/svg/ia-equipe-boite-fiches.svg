<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « IA pour équipe commerciale » : un long fichier de fiches clients (subject = bleu) posé
       sur un bureau, vu de trois quarts, avec ses intercalaires ; la commerciale en sort une
       fiche pour préparer son rendez-vous.
       Hero de billet (multiply sur fond paper) : fond crème fixe (ton light, jamais le rôle field),
       aucun aplat ne touche les bords, sujet entre x 300 et 1250, sol en ellipse.
       Silhouettes en ton shadow quelle que soit la distribution. -->
  <defs>
    <g id="man" fill="{{shadow}}"><circle cx="0" cy="-91" r="7.5"/><path d="M-11 -81 Q0 -85 11 -81 L12 -44 L-12 -44 Z"/><rect x="-10" y="-46" width="8.5" height="44"/><rect x="1.5" y="-46" width="8.5" height="44"/><rect x="-11" y="-3" width="11" height="3" rx="1.5"/><rect x="1" y="-3" width="13" height="3" rx="1.5"/></g>
    <g id="woman" fill="{{shadow}}"><circle cx="0" cy="-90" r="7"/><circle cx="-5" cy="-96" r="5"/><path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/><path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/><rect x="-6" y="-25" width="4" height="23"/><rect x="2" y="-25" width="4" height="23"/><path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/></g>
    <g id="sit" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><path d="M-6 -68 Q4 -72 13 -68 L12 -30 L-7 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="8" height="28"/><rect x="17" y="-3" width="14" height="3" rx="1.5"/></g>
    <g id="sitw" fill="{{shadow}}"><circle cx="4" cy="-78" r="7"/><circle cx="-1" cy="-84" r="5"/><path d="M-5 -68 Q4 -72 12 -68 L11 -42 L-6 -42 Z"/><path d="M-8 -43 L13 -43 L14 -30 L-8 -30 Z"/><rect x="-7" y="-34" width="32" height="10" rx="3"/><rect x="17" y="-30" width="6" height="28"/><rect x="17" y="-3" width="13" height="3" rx="1.5"/></g>
  </defs>
  <rect width="1456" height="624" fill="{{light}}"/>
  <ellipse cx="880" cy="506" rx="360" ry="22" fill="{{ground}}"/>
  <ellipse cx="960" cy="502" rx="190" ry="7" fill="{{soft}}"/>
  <!-- Bureau -->
  <rect x="770" y="440" width="380" height="12" fill="{{deep}}"/>
  <rect x="790" y="452" width="10" height="48" fill="{{deep}}"/>
  <rect x="1120" y="452" width="10" height="48" fill="{{deep}}"/>
  <!-- Fiches et intercalaires, de l'arrière vers l'avant -->
  <rect x="872" y="296" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="868" y="300" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="888" y="288" width="44" height="18" rx="3" fill="{{soft}}"/><rect x="864" y="304" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="860" y="308" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="856" y="312" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="852" y="316" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="976" y="304" width="44" height="18" rx="3" fill="{{soft}}"/><rect x="848" y="320" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="844" y="324" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="840" y="328" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="908" y="316" width="44" height="18" rx="3" fill="{{soft}}"/><rect x="836" y="332" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="832" y="336" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <rect x="828" y="340" width="196" height="92" fill="{{light}}" stroke="{{mid}}" stroke-width="3"/>
  <!-- La boîte : face avant, flanc, porte-étiquette vide -->
  <path d="M1060 352 L1100 312 L1100 400 L1060 440 Z" fill="{{deep}}"/>
  <rect x="820" y="352" width="240" height="88" fill="{{subject}}"/>
  <rect x="916" y="380" width="48" height="22" rx="3" fill="{{detail}}"/>
  <!-- La fiche sortie -->
  <rect x="760" y="210" width="104" height="70" fill="{{light}}" stroke="{{mid}}" stroke-width="3" transform="rotate(-8 812 245)"/>
  <!-- La commerciale -->
  <use href="#woman" transform="translate(700 500) scale(2.1 2.1)"/>
  <path d="M712 336 L738 296 L762 262" fill="none" stroke="{{shadow}}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
