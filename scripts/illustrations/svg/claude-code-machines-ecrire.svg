<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 624" width="1456" height="624">
  <!-- Waimia · « Claude Code, Codex ou Mistral Vibe » : trois machines à écrire de tailles
       différentes posées sur trois tables ; une femme tient sa feuille et choisit où la
       glisser. Le bon agent dépend de votre situation.
       Hero (multiply sur paper) : fond crème, aucun aplat ne touche les bords, sujet entre
       x 400 et 1230. Rôles : subject = corps des machines, detail = lignes des feuilles ;
       la silhouette reste en {{shadow}}. -->
  <defs>
    <g id="machine">
      <path d="M-100 0 L100 0 L82 -88 L-82 -88 Z" fill="{{subject}}"/>
      <g fill="{{light}}">
        <circle cx="-77" cy="-20" r="6"/><circle cx="-55" cy="-20" r="6"/><circle cx="-33" cy="-20" r="6"/><circle cx="-11" cy="-20" r="6"/><circle cx="11" cy="-20" r="6"/><circle cx="33" cy="-20" r="6"/><circle cx="55" cy="-20" r="6"/><circle cx="77" cy="-20" r="6"/>
        <circle cx="-66" cy="-42" r="6"/><circle cx="-44" cy="-42" r="6"/><circle cx="-22" cy="-42" r="6"/><circle cx="0" cy="-42" r="6"/><circle cx="22" cy="-42" r="6"/><circle cx="44" cy="-42" r="6"/><circle cx="66" cy="-42" r="6"/>
        <circle cx="-55" cy="-64" r="6"/><circle cx="-33" cy="-64" r="6"/><circle cx="-11" cy="-64" r="6"/><circle cx="11" cy="-64" r="6"/><circle cx="33" cy="-64" r="6"/><circle cx="55" cy="-64" r="6"/>
      </g>
      <rect x="-84" y="-118" width="168" height="30" fill="{{deep}}"/>
      <rect x="-112" y="-140" width="224" height="24" rx="12" fill="{{shadow}}"/>
      <circle cx="-118" cy="-128" r="11" fill="{{shadow}}"/>
      <circle cx="118" cy="-128" r="11" fill="{{shadow}}"/>
      <path d="M-120 -142 L-150 -170" stroke="{{shadow}}" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="feuille">
      <rect x="-58" y="-104" width="116" height="104" fill="{{pale}}"/>
      <g fill="{{detail}}">
        <rect x="-42" y="-88" width="60" height="7"/>
        <rect x="-42" y="-70" width="84" height="7"/>
        <rect x="-42" y="-52" width="70" height="7"/>
        <rect x="-42" y="-34" width="84" height="7"/>
      </g>
    </g>
    <g id="table">
      <rect x="-130" y="0" width="260" height="12" fill="{{deep}}"/>
      <rect x="-118" y="12" width="11" height="96" fill="{{deep}}"/>
      <rect x="107" y="12" width="11" height="96" fill="{{deep}}"/>
    </g>
  </defs>

  <rect width="1456" height="624" fill="{{field}}"/>

  <!-- Sol local -->
  <ellipse cx="860" cy="506" rx="430" ry="22" fill="{{ground}}"/>
  <ellipse cx="680" cy="502" rx="100" ry="7" fill="{{shape}}"/>
  <ellipse cx="895" cy="502" rx="120" ry="7" fill="{{shape}}"/>
  <ellipse cx="1120" cy="502" rx="150" ry="7" fill="{{shape}}"/>
  <ellipse cx="500" cy="502" rx="36" ry="6" fill="{{shape}}"/>

  <!-- Trois tables, trois machines de tailles différentes -->
  <use href="#table" transform="translate(680 392) scale(0.56 1)"/>
  <use href="#table" transform="translate(895 392) scale(0.7 1)"/>
  <use href="#table" transform="translate(1120 392) scale(0.86 1)"/>

  <use href="#feuille" transform="translate(680 316) scale(0.66 0.8)"/>
  <use href="#feuille" transform="translate(895 292) scale(0.82 1.05)"/>
  <use href="#feuille" transform="translate(1120 266) scale(0.95 1.3)"/>
  <use href="#machine" transform="translate(680 392) scale(0.66)"/>
  <use href="#machine" transform="translate(895 392) scale(0.82)"/>
  <use href="#machine" transform="translate(1120 392) scale(1)"/>

  <!-- La femme, de profil vers les machines, tend sa feuille -->
  <g transform="translate(500 500) scale(2.1)">
    <g fill="{{shadow}}">
      <circle cx="0" cy="-90" r="7"/>
      <circle cx="-5" cy="-96" r="5"/>
      <path d="M-8 -81 Q0 -85 8 -81 L9 -52 L-9 -52 Z"/>
      <path d="M-10 -53 L10 -53 L8 -24 L-8 -24 Z"/>
      <rect x="-6" y="-25" width="4" height="23"/>
      <rect x="2" y="-25" width="4" height="23"/>
      <path d="M-8 -3 L-1 -3 L-1 0 L-8 0 Z M1 -3 L10 -3 L10 0 L1 0 Z"/>
    </g>
    <path d="M6 -78 L14 -66 L26 -66" fill="none" stroke="{{shadow}}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="25" y="-80" width="20" height="26" fill="{{pale}}"/>
    <rect x="29" y="-75" width="12" height="2.4" fill="{{detail}}"/>
    <rect x="29" y="-69" width="12" height="2.4" fill="{{detail}}"/>
    <rect x="29" y="-63" width="9" height="2.4" fill="{{detail}}"/>
  </g>
</svg>
